<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>まこマッチ 💕</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #fff0f6,
          #f2efff
        );

      color: #333;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: auto;
      background: white;
      box-shadow:
        0 0 30px rgba(0,0,0,.08);
    }

    header {
      padding: 22px 18px;
      color: white;

      background:
        linear-gradient(
          135deg,
          #ff6f9f,
          #9b8cff
        );

      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      font-size: 27px;
      font-weight: 800;
    }

    .sub {
      margin-top: 5px;
      font-size: 13px;
      opacity: .95;
    }

    main {
      padding: 16px;
    }

    .card {
      background: white;
      border: 1px solid #eee;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 14px;

      box-shadow:
        0 6px 20px rgba(0,0,0,.06);
    }

    h2 {
      margin-top: 0;
    }

    h3 {
      margin-bottom: 8px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #ddd;
      border-radius: 12px;
      margin: 5px 0 10px;
      background: white;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #ff72a2;

      box-shadow:
        0 0 0 3px
        rgba(255,114,162,.12);
    }

    textarea {
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 13px;
      padding: 11px 15px;
      font-weight: 700;
    }

    .primary {
      width: 100%;
      color: white;

      background:
        linear-gradient(
          135deg,
          #ff5f96,
          #9a86ff
        );
    }

    .like {
      background: #ff5c91;
      color: white;
    }

    .liked {
      background: #ffd6e4;
      color: #d94f7e;
    }

    .block {
      background: #eee;
      color: #555;
    }

    .secondary {
      background: #f0ebff;
      color: #654bd1;
    }

    .logout {
      background: #eee;
      color: #555;
    }

    .danger {
      background: #ffe5eb;
      color: #d33;
    }

    .small {
      font-size: 12px;
      color: #888;
    }

    .message {
      padding: 10px;
      border-radius: 12px;
      margin: 7px 0;
    }

    .success {
      background: #edfff2;
      color: #248a48;
    }

    .error {
      background: #fff0f2;
      color: #c52b46;
    }

    .profile {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .avatar {
      width: 58px;
      height: 58px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #ffe0ec,
          #e5ddff
        );

      font-size: 29px;
    }

    .name {
      font-weight: 800;
    }

    .age {
      color: #777;
      font-weight: 500;
    }

    .tag {
      display: inline-block;
      background: #f1ebff;
      color: #6652c7;
      padding: 5px 9px;
      border-radius: 20px;
      margin: 4px 3px 0 0;
      font-size: 12px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .actions button {
      flex: 1;
    }

    .account {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .accountEmail {
      font-size: 13px;
      color: #666;
      overflow-wrap: anywhere;
    }

    .hidden {
      display: none !important;
    }

    .center {
      text-align: center;
    }

    .loading {
      padding: 15px;
      text-align: center;
      color: #888;
    }

    .location {
      margin-top: 8px;
      color: #777;
      font-size: 13px;
    }

    .post {
      background: #fff7fa;
    }

    .postItem {
      background: white;
      border: 1px solid #eee;
      border-radius: 14px;
      padding: 12px;
      margin-top: 10px;
    }

    .postHeader {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .matchCard {
      background:
        linear-gradient(
          135deg,
          #fff0f7,
          #f3efff
        );

      border:
        1px solid #eadff5;
    }

    .chatMessages {
      height: 330px;
      overflow-y: auto;
      padding: 10px;
      background: #fafafa;
      border-radius: 15px;
      margin-bottom: 10px;
    }

    .chatRow {
      display: flex;
      margin: 7px 0;
    }

    .chatRow.mine {
      justify-content: flex-end;
    }

    .chatBubble {
      max-width: 78%;
      padding: 9px 12px;
      border-radius: 15px;
      background: #eee;
    }

    .mine .chatBubble {
      background: #ffdeea;
    }

    .chatTime {
      font-size: 10px;
      color: #999;
      margin-top: 3px;
    }

    .chatInputRow {
      display: flex;
      gap: 7px;
    }

    .chatInputRow input {
      margin: 0;
    }

    .chatInputRow button {
      flex-shrink: 0;
    }

    .tabs {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      margin-bottom: 15px;
    }

    .tab {
      white-space: nowrap;
      background: #f2eefb;
      color: #6755b9;
    }

    .tab.active {
      background: #ff6f9f;
      color: white;
    }

    .checkboxRow {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 13px;
      margin: 5px 0 12px;
    }

    .checkboxRow input {
      width: auto;
      margin-top: 3px;
    }

    .empty {
      padding: 20px;
      text-align: center;
      color: #999;
      background: #fafafa;
      border-radius: 15px;
    }

    .unreadBadge {
      display: inline-block;
      min-width: 22px;
      padding: 3px 7px;
      border-radius: 20px;
      background: #ff4f87;
      color: white;
      font-size: 11px;
      text-align: center;
      margin-left: 5px;
    }

    .lastMessage {
      margin-top: 8px;
      color: #777;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

  </style>
</head>


<body>

<div class="app">

  <header>

    <div class="brand">
      まこマッチ 💕
    </div>

    <div class="sub">
      18歳以上限定・安心して話せる場所
    </div>

  </header>


  <main>

    <!-- ログイン -->

    <section
      id="authSection"
      class="card"
    >

      <h2>🔐 ログイン</h2>

      <input
        id="email"
        type="email"
        placeholder="メールアドレス"
        autocomplete="email"
      >

      <input
        id="password"
        type="password"
        placeholder="パスワード"
        autocomplete="current-password"
      >

      <div class="checkboxRow">

        <input
          id="ageConfirm"
          type="checkbox"
        >

        <label for="ageConfirm">
          私は18歳以上です
        </label>

      </div>

      <button
        id="loginButton"
        class="primary"
      >
        ログイン
      </button>

      <br><br>

      <button
        id="registerButton"
        class="secondary"
        style="width:100%"
      >
        新規登録
      </button>

      <div
        id="authMessage"
        class="small"
        style="margin-top:12px"
      ></div>

    </section>


    <!-- ログイン後 -->

    <section
      id="appSection"
      class="hidden"
    >

      <div class="card">

        <div class="account">

          <div>

            <div>
              🔐 ログイン中
            </div>

            <div
              id="accountEmail"
              class="accountEmail"
            ></div>

          </div>

          <button
            id="logoutButton"
            class="logout"
          >
            ログアウト
          </button>

        </div>

      </div>


      <!-- タブ -->

      <div class="tabs">

        <button
          class="tab active"
          data-tab="profileTab"
        >
          👤プロフィール
        </button>

        <button
          class="tab"
          data-tab="peopleTab"
        >
          💕おすすめ
        </button>

        <button
          class="tab"
          data-tab="matchTab"
        >
          💖マッチ
        </button>

        <button
          class="tab"
          data-tab="chatTab"
        >
          💬チャット
        </button>

        <button
          class="tab"
          data-tab="talkTab"
        >
          🗣️雑談
        </button>

      </div>


      <!-- プロフィール -->

      <section
        id="profileTab"
        class="tabContent"
      >

        <div class="card">

          <h2>👤 プロフィール</h2>

          <label>ニックネーム</label>

          <input
            id="myName"
            placeholder="ニックネーム"
            maxlength="30"
          >

          <label>年齢</label>

          <input
            id="myAge"
            type="number"
            min="18"
            max="120"
            placeholder="18歳以上"
          >

          <label>性別</label>

          <select id="myGender">

            <option value="">
              選択してください
            </option>

            <option value="男性">
              男性
            </option>

            <option value="女性">
              女性
            </option>

            <option value="その他">
              その他
            </option>

          </select>

          <label>都道府県</label>

          <select id="prefecture">

            <option value="">
              読み込み中...
            </option>

          </select>

          <label>市区町村</label>

          <select
            id="municipality"
            disabled
          >

            <option value="">
              先に都道府県を選択してください
            </option>

          </select>

          <label>自己紹介</label>

          <textarea
            id="myBio"
            rows="4"
            maxlength="500"
            placeholder="よろしくお願いします！"
          ></textarea>

          <button
            id="saveProfileButton"
            class="primary"
          >
            プロフィールを保存 💕
          </button>

          <div
            id="profileMessage"
            class="small"
            style="margin-top:10px"
          ></div>

          <div
            id="myLocation"
            class="location"
          ></div>

        </div>

      </section>


      <!-- おすすめ -->

      <section
        id="peopleTab"
        class="tabContent hidden"
      >

        <h2>💕 おすすめの人</h2>

        <div id="profiles">

          <div class="loading">
            読み込み中...
          </div>

        </div>

      </section>


      <!-- マッチ -->

      <section
        id="matchTab"
        class="tabContent hidden"
      >

        <h2>💖 マッチした人</h2>

        <div id="matches">

          <div class="loading">
            読み込み中...
          </div>

        </div>

      </section>


      <!-- チャット -->

      <section
        id="chatTab"
        class="tabContent hidden"
      >

        <h2>💬 二人だけのチャット</h2>

        <div id="chatArea">

          <div class="empty">
            マッチした人を選ぶと<br>
            チャットできます 💕
          </div>

        </div>

      </section>


      <!-- 雑談 -->

      <section
        id="talkTab"
        class="tabContent hidden"
      >

        <div class="card post">

          <h2>🗣️ 雑談コーナー</h2>

          <textarea
            id="postText"
            rows="3"
            maxlength="500"
            placeholder="気軽にひとこと投稿しよう"
          ></textarea>

          <button
            id="postButton"
            class="primary"
          >
            投稿する
          </button>

        </div>

        <div id="posts"></div>

      </section>

    </section>

  </main>

</div>


<script type="module">

  /*
   * ========================================
   * Firebase
   * ========================================
   */

  import {
    initializeApp
  }
  from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  }
  from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


  import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    updateDoc,
    addDoc,
    collection,
    getDocs,
    onSnapshot,
    serverTimestamp
  }
  from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


  const firebaseConfig = {

    apiKey:
      "AIzaSyBVtlfUgyyt6eic_chW_ADyz3SCBtCz9GA",

    authDomain:
      "makomatch-7a96b.firebaseapp.com",

    projectId:
      "makomatch-7a96b",

    storageBucket:
      "makomatch-7a96b.firebasestorage.app",

    messagingSenderId:
      "371872457458",

    appId:
      "1:371872457458:web:6c9391508fbba63df2a66b",

    measurementId:
      "G-Y39HTKE7ZZ"

  };


  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);


  /*
   * ========================================
   * 市区町村
   * ========================================
   */

  const CITY_URL =
    "https://code4fukui.github.io/localgovjp/localgovjp.json";

  const prefecture =
    document.getElementById("prefecture");

  const municipality =
    document.getElementById("municipality");

  let municipalities = [];


  async function loadMunicipalities() {

    try {

      const response =
        await fetch(CITY_URL);

      if (!response.ok) {
        throw new Error(
          "市区町村データ取得失敗"
        );
      }

      municipalities =
        await response.json();

      const prefMap =
        new Map();

      municipalities.forEach(
        city => {

          if (
            city.pid &&
            city.pref
          ) {

            prefMap.set(
              String(city.pid),
              city.pref
            );

          }

        }
      );

      prefecture.innerHTML =
        '<option value="">選択してください</option>';

      Array.from(
        prefMap.entries()
      )
      .sort(
        (a,b) =>
          Number(a[0]) -
          Number(b[0])
      )
      .forEach(
        ([pid,pref]) => {

          const option =
            document.createElement(
              "option"
            );

          option.value = pid;
          option.textContent = pref;

          prefecture.appendChild(
            option
          );

        }
      );

    } catch(error) {

      console.error(error);

      prefecture.innerHTML =
        '<option value="">読み込み失敗</option>';

      municipality.innerHTML =
        '<option value="">読み込み失敗</option>';

    }

  }


  prefecture.addEventListener(
    "change",
    function() {

      const pid =
        String(
          prefecture.value
        );

      municipality.innerHTML =
        '<option value="">選択してください</option>';

      municipality.disabled =
        true;

      if (!pid) {

        municipality.innerHTML =
          '<option value="">先に都道府県を選択してください</option>';

        return;

      }

      const cities =
        municipalities
        .filter(
          city =>
            String(city.pid) === pid
        )
        .sort(
          (a,b) =>
            String(a.city)
              .localeCompare(
                String(b.city),
                "ja"
              )
        );

      cities.forEach(
        city => {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            city.city;

          option.textContent =
            city.city;

          municipality.appendChild(
            option
          );

        }
      );

      municipality.disabled =
        false;

    }
  );


  /*
   * ========================================
   * 状態
   * ========================================
   */

  let currentUser = null;

  let currentProfile = null;

  let selectedMatchId = null;

  let selectedMatchUser = null;

  let unsubscribeChat = null;


  /*
   * ========================================
   * DOM
   * ========================================
   */

  const authSection =
    document.getElementById(
      "authSection"
    );

  const appSection =
    document.getElementById(
      "appSection"
    );

  const authMessage =
    document.getElementById(
      "authMessage"
    );

  const accountEmail =
    document.getElementById(
      "accountEmail"
    );

  const profilesBox =
    document.getElementById(
      "profiles"
    );

  const matchesBox =
    document.getElementById(
      "matches"
    );

  const chatArea =
    document.getElementById(
      "chatArea"
    );

  const postsBox =
    document.getElementById(
      "posts"
    );


  /*
   * ========================================
   * HTMLエスケープ
   * ========================================
   */

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(
        /[&<>"']/g,
        char => {

          return {
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"
          }[char];

        }
      );

  }


  /*
   * ========================================
   * Firebaseエラー
   * ========================================
   */

  function firebaseErrorMessage(error) {

    const code =
      error?.code || "";

    if (
      code ===
      "auth/email-already-in-use"
    ) {

      return "このメールアドレスはすでに登録されています。";

    }

    if (
      code ===
      "auth/invalid-email"
    ) {

      return "メールアドレスを確認してください。";

    }

    if (
      code ===
      "auth/weak-password"
    ) {

      return "パスワードは6文字以上にしてください。";

    }

    if (
      code ===
      "auth/invalid-credential" ||
      code ===
      "auth/wrong-password" ||
      code ===
      "auth/user-not-found"
    ) {

      return "メールアドレスまたはパスワードが違います。";

    }

    if (
      code ===
      "permission-denied"
    ) {

      return "Firebaseの権限設定を確認してください。";

    }

    return (
      error?.message ||
      "エラーが発生しました。"
    );

  }


  /*
   * ========================================
   * 認証
   * ========================================
   */

  document
    .getElementById("registerButton")
    .addEventListener(
      "click",
      async function() {

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;

        const ageConfirm =
          document
            .getElementById("ageConfirm")
            .checked;

        if (!ageConfirm) {

          authMessage.textContent =
            "18歳以上であることを確認してください。";

          authMessage.className =
            "message error";

          return;

        }

        if (!email || !password) {

          authMessage.textContent =
            "メールアドレスとパスワードを入力してください。";

          authMessage.className =
            "message error";

          return;

        }

        try {

          authMessage.textContent =
            "登録中...";

          const result =
            await createUserWithEmailAndPassword(
              auth,
              email,
              password
            );

          await setDoc(
            doc(
              db,
              "users",
              result.user.uid
            ),
            {

              uid:
                result.user.uid,

              email:
                result.user.email,

              createdAt:
                serverTimestamp(),

              updatedAt:
                serverTimestamp()

            },
            {
              merge:true
            }
          );

          authMessage.textContent =
            "登録しました！💕";

          authMessage.className =
            "message success";

        } catch(error) {

          console.error(error);

          authMessage.textContent =
            firebaseErrorMessage(error);

          authMessage.className =
            "message error";

        }

      }
    );


  document
    .getElementById("loginButton")
    .addEventListener(
      "click",
      async function() {

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;

        const ageConfirm =
          document
            .getElementById("ageConfirm")
            .checked;

        if (!ageConfirm) {

          authMessage.textContent =
            "18歳以上であることを確認してください。";

          authMessage.className =
            "message error";

          return;

        }

        if (!email || !password) {

          authMessage.textContent =
            "メールアドレスとパスワードを入力してください。";

          authMessage.className =
            "message error";

          return;

        }

        try {

          authMessage.textContent =
            "ログイン中...";

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

          authMessage.textContent =
            "";

        } catch(error) {

          console.error(error);

          authMessage.textContent =
            firebaseErrorMessage(error);

          authMessage.className =
            "message error";

        }

      }
    );


  document
    .getElementById("logoutButton")
    .addEventListener(
      "click",
      async function() {

        await signOut(auth);

      }
    );


  /*
   * ========================================
   * 自分のプロフィール
   * ========================================
   */

  async function loadMyProfile() {

    if (!currentUser) {
      return;
    }

    const snap =
      await getDoc(
        doc(
          db,
          "users",
          currentUser.uid
        )
      );

    if (!snap.exists()) {

      currentProfile = null;

      return;

    }

    currentProfile =
      snap.data();

    document
      .getElementById("myName")
      .value =
      currentProfile.name || "";

    document
      .getElementById("myAge")
      .value =
      currentProfile.age || "";

    document
      .getElementById("myGender")
      .value =
      currentProfile.gender || "";

    if (
      currentProfile.prefecturePid
    ) {

      prefecture.value =
        String(
          currentProfile.prefecturePid
        );

      prefecture.dispatchEvent(
        new Event("change")
      );

      setTimeout(

        document

        .getElementById("myBio")

    }

    if (!prefecturePid) {

      message.textContent =

      message.className =
        "message error";

  async function getAllBlockedIds() {

    const result =
      new Set();

    if (!currentUser) {
      return result;
    }

    const snapshot =
      await getDocs(
        collection(
          db,
          "blocks"
        )
      );

    snapshot.forEach(
      item => {

        const data =
          item.data();

        if (
          data.from ===
          currentUser.uid
        ) {

          result.add(data.to);

        }

        if (
          data.to ===
          currentUser.uid
        ) {

          result.add(data.from);

        }

      }
    );

    return result;

  }

  async function loadPeople() {

    if (!currentUser) {
      return;
    }

    profilesBox.innerHTML =
      '<div class="loading">読み込み中...</div>';

    try {

      const snapshot =
        await getDocs(
          collection(
            db,
            "users"
          )
        );

      const blockedIds =
        await getAllBlockedIds();

      const likesSnapshot =
        await getDocs(
          collection(
            db,
            "likes"
          )
        );

      const likedIds =
        new Set();

      likesSnapshot.forEach(
        item => {

          const data =
            item.data();

          if (
            data.from ===
            currentUser.uid
          ) {

            likedIds.add(
              data.to
            );

          }

        }
      );

      const users = [];

      snapshot.forEach(
        item => {

          const data =
            item.data();

          if (
            item.id ===
            currentUser.uid
          ) {
            return;
          }

          if (
            blockedIds.has(
              item.id
            )
          ) {
            return;
          }

          users.push({
            id:item.id,
            ...data,

            alreadyLiked:
              likedIds.has(
                item.id
              )

          });

        }
      );

      if (!users.length) {

        profilesBox.innerHTML =
          '<div class="empty">まだ他のユーザーがいません。<br>新しいユーザーが登録するとここに表示されます💕</div>';

        return;

        users

      profilesBox.innerHTML =
        '<div class="message error">ユーザーを読み込めませんでした。</div>';

  window.sendLike =
    async function(targetUid) {

      if (!currentUser) {
        return;
      }

      try {

        const likeId =
          currentUser.uid +
          "_" +
          targetUid;

        const reverseLikeId =
          targetUid +
          "_" +
          currentUser.uid;

        await setDoc(
          doc(
            db,
            "likes",
            likeId
          ),
          {

            from:
              currentUser.uid,

            to:
              targetUid,

            createdAt:
              serverTimestamp()

          },
          {
            merge:true
          }
        );

        const reverse =
          await getDoc(
            doc(
              db,
              "likes",
              reverseLikeId
            )
          );

        if (
          reverse.exists()
        ) {

          const matchId =
            makeMatchId(
              currentUser.uid,
              targetUid
            );

          await setDoc(
            doc(
              db,
              "matches",
              matchId
            ),
            {

              matchId,

              users: [
                currentUser.uid,
                targetUid
              ],

              createdAt:
                serverTimestamp(),

              updatedAt:
                serverTimestamp()

            },
            {
              merge:true
            }
          );

          alert(
            "💕 マッチしました！\nチャットできます！"
          );

          await loadMatches();

          openTab(
            "matchTab"
          );

        } else {

          alert(
            "❤️ いいねしました！\n相手もいいねするとマッチします💕"
          );

          await loadPeople();

        }

      } catch(error) {

        console.error(error);

        alert(
          firebaseErrorMessage(error)
        );

      }

    };

  /*

   * ========================================

  function makeMatchId(
    uid1,
    uid2
  ) {

    return [
      uid1,
      uid2
    ]
      .sort()
      .join("_");

  }


  /*
   * ========================================
   * マッチ一覧
   * ========================================
   */

  async function loadMatches() {

    if (!currentUser) {
      return;
    }

    matchesBox.innerHTML =
      '<div class="loading">読み込み中...</div>';

    try {

      const snapshot =
        await getDocs(
          collection(
            db,
            "matches"
          )
        );

      const blockedIds =
        await getAllBlockedIds();

      const matches = [];

      snapshot.forEach(
        item => {

          const data =
            item.data();

          if (
            !Array.isArray(
              data.users
            )
          ) {
            return;
          }

          if (
            !data.users.includes(
              currentUser.uid
            )
          ) {
            return;
          }

          const otherUid =
            data.users.find(
              uid =>
                uid !==
                currentUser.uid
            );

          if (
            !otherUid
          ) {
            return;
          }

          if (
            blockedIds.has(
              otherUid
            )
          ) {
            return;
          }

          matches.push({
            id:
              item.id,

            ...data,

            otherUid
          });

        }
      );

      if (!matches.length) {

        matchesBox.innerHTML =
          '<div class="empty">まだマッチしていません💕<br>おすすめの人に「いいね」してみよう！</div>';

        return;

      }

      matches.sort(
        (a,b) => {

          const at =
            a.updatedAt?.seconds ||
            a.createdAt?.seconds ||
            0;

          const bt =
            b.updatedAt?.seconds ||
            b.createdAt?.seconds ||
            0;

          return bt - at;

        }
      );

      const cards = [];

      for (
        const match of matches
      ) {

        const userSnap =
          await getDoc(
            doc(
              db,
              "users",
              match.otherUid
            )
          );

        if (
          !userSnap.exists()
        ) {
          continue;
        }

        const user =
          userSnap.data();

        const unread =
          Number(
            match.unread?.[
              currentUser.uid
            ] || 0
          );

        const unreadHtml =
          unread > 0
            ? `
              <span
                class="unreadBadge"
              >
                ${unread}
              </span>
            `
            : "";

        const lastMessage =
          match.lastMessage
            ? escapeHtml(
                match.lastMessage
              )
            : "まだメッセージはありません";

        cards.push(`

          <div
            class="card matchCard"
          >

            <div class="profile">

              <div class="avatar">
                💖
              </div>

              <div>

                <div class="name">

                  ${escapeHtml(
                    user.name ||
                    "ユーザー"
                  )}

                  ${unreadHtml}

                </div>

                <div class="small">

                  ${
                    user.age
                      ? escapeHtml(
                          user.age
                        ) + "歳"
                      : ""
                  }

                  ${
                    user.prefecture
                      ? " ・ " +
                        escapeHtml(
                          user.prefecture
                        )
                      : ""
                  }

                </div>

              </div>

            </div>

            <div class="lastMessage">
              ${lastMessage}
            </div>

            <div class="actions">

              <button
                class="like"
                onclick="openChat('${match.id}','${match.otherUid}')"
              >
                💬 チャットする
              </button>

            </div>

          </div>

        `);

      }

      matchesBox.innerHTML =
        cards.join("");

    } catch(error) {

      console.error(error);

      matchesBox.innerHTML =
        '<div class="message error">マッチを読み込めませんでした。</div>';

    }

  }

  /*
   * ========================================
   * チャットリアルタイム
   * ========================================
   */

  function listenChat() {

    if (unsubscribeChat) {

      unsubscribeChat();

      unsubscribeChat =
        null;

    }

    if (!selectedMatchId) {
      return;
    }

    const messagesRef =
      collection(
        db,
        "matches",
        selectedMatchId,
        "messages"
      );

    unsubscribeChat =
      onSnapshot(
        messagesRef,
        async snapshot => {

          const messages = [];

          snapshot.forEach(
            item => {

              messages.push({
                id:
                  item.id,

                ...item.data()

              });

            }
          );

          messages.sort(
            (a,b) => {

              const at =
                a.createdAt?.seconds ||
                0;

              const bt =
                b.createdAt?.seconds ||
                0;

              return at - bt;

            }
          );

          const box =
            document.getElementById(
              "chatMessages"
            );

          if (!box) {
            return;
          }

          if (!messages.length) {

            box.innerHTML =
              '<div class="empty">まだメッセージはありません。<br>最初のメッセージを送ってみよう💕</div>';

            return;

          }

          box.innerHTML =
            messages
              .map(
                message => {

                  const mine =
                    message.from ===
                    currentUser.uid;

                  const time =
                    message.createdAt?.toDate
                      ? message.createdAt
                          .toDate()
                          .toLocaleString(
                            "ja-JP"
                          )
                      : "";

                  return `

                    <div
                      class="chatRow ${
                        mine
                          ? "mine"
                          : ""
                      }"
                    >

                      <div
                        class="chatBubble"
                      >

                        <div>
                          ${escapeHtml(
                            message.text
                          )}
                        </div>

                        <div
                          class="chatTime"
                        >
                          ${escapeHtml(
                            time
                          )}
                        </div>

                      </div>

                    </div>

                  `;

                }
              )
              .join("");

          box.scrollTop =
            box.scrollHeight;

          await markChatRead();

          await loadMatches();

        },
        error => {

          console.error(error);

          const box =
            document.getElementById(
              "chatMessages"
            );

          if (box) {

            box.innerHTML =
              '<div class="message error">チャットを読み込めませんでした。</div>';

          }

        }
      );

  }

  /*

   * ========================================
   */

  async function sendChatMessage() {

    if (
      !currentUser ||
      !selectedMatchId
    ) {
      return;
    }

    const input =
      document.getElementById(
        "chatInput"
      );

    if (!input) {
      return;
    }

    const text =
      input.value.trim();

    if (!text) {
      return;
    }

    try {

      const matchRef =
        doc(
          db,
          "matches",
          selectedMatchId
        );

      const matchSnap =
        await getDoc(
          matchRef
        );

      if (
        !matchSnap.exists()
      ) {

        alert(
          "このチャットは利用できません。"
        );

        return;

      }

      const match =
        matchSnap.data();

      if (
        !Array.isArray(
          match.users
        ) ||
        !match.users.includes(
          currentUser.uid
        )
      ) {

        alert(
          "このチャットを利用する権限がありません。"
        );

        return;

      }

      const otherUid =
        match.users.find(
          uid =>
            uid !==
            currentUser.uid
        );

      if (!otherUid) {
        return;
      }

      await addDoc(
        collection(
          db,
          "matches",
          selectedMatchId,
          "messages"
        ),
        {

          from:
            currentUser.uid,

          to:
            otherUid,

          text,

          createdAt:
            serverTimestamp()

        }
      );

      await updateDoc(
        matchRef,
        {

          lastMessage:
            text,

          lastMessageFrom:
            currentUser.uid,

          updatedAt:
            serverTimestamp(),

          [`unread.${otherUid}`]:
            Number(
              match.unread?.[otherUid] ||
              0
            ) + 1,

          [`unread.${currentUser.uid}`]:
            0

        }
      );

      input.value = "";

      input.focus();

    } catch(error) {

      console.error(error);

      alert(
        firebaseErrorMessage(error)
      );

    }

  }

      if (!posts.length) {

        postsBox.innerHTML =
          '<div class="empty">まだ投稿はありません。<br>最初の投稿をしてみよう💕</div>';

        return;

      }

      postsBox.innerHTML =
        posts
          .map(
            post => {

              const time =
                post.createdAt?.toDate
                  ? post.createdAt
                      .toDate()
                      .toLocaleString(
                        "ja-JP"
                      )
                  : "投稿直後";

              return `

                <div
                  class="postItem"
                >

                  <div
                    class="postHeader"
                  >

                    <strong>
                      ${escapeHtml(
                        post.name ||
                        "匿名"
                      )}
                    </strong>

                    <span
                      class="small"
                    >
                      ${escapeHtml(
                        time
                      )}
                    </span>

                  </div>

                  <div
                    style="margin-top:8px"
                  >
                    ${escapeHtml(
                      post.text
                    )}
                  </div>

                </div>

              `;

            }
          )
          .join("");

    } catch(error) {

      console.error(error);

      postsBox.innerHTML =
        '<div class="message error">投稿を読み込めませんでした。</div>';

    }

  }


  /*
   * ========================================
   * タブ
   * ========================================
   */

  document
    .querySelectorAll(
      ".tab"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          function() {

            openTab(
              button.dataset.tab
            );

          }
        );

      }
    );


  function openTab(
    tabId
  ) {

    document
      .querySelectorAll(
        ".tabContent"
      )
      .forEach(
        section => {

          section.classList.add(
            "hidden"
          );

        }
      );

    document
      .querySelectorAll(
        ".tab"
      )
      .forEach(
        button => {

          button.classList.remove(
            "active"
          );

        }
      );

    const section =
      document.getElementById(
        tabId
      );

    if (section) {

      section.classList.remove(
        "hidden"
      );

    }

    const button =
      document.querySelector(
        `.tab[data-tab="${tabId}"]`
      );

    if (button) {

      button.classList.add(
        "active"
      );

    }

    if (
      tabId ===
      "peopleTab"
    ) {

      loadPeople();

    }

    if (
      tabId ===
      "matchTab"
    ) {

      loadMatches();

    }

    if (
      tabId ===
      "talkTab"
    ) {

      loadPosts();

    }

  }


  /*
   * ========================================
   * ログイン状態
   * ========================================
   */

  onAuthStateChanged(
    auth,
    async function(user) {

      if (user) {

        currentUser =
          user;

        authSection.classList.add(
          "hidden"
        );

        appSection.classList.remove(
          "hidden"
        );

        accountEmail.textContent =
          user.email || "";

        try {

          await loadMyProfile();

          await loadPeople();

          await loadMatches();

          await loadPosts();

        } catch(error) {

          console.error(error);

        }

      } else {

        currentUser =
          null;

        currentProfile =
          null;

        selectedMatchId =
          null;

        selectedMatchUser =
          null;

        authSection.classList.remove(
          "hidden"
        );

        appSection.classList.add(
          "hidden"
        );

        if (unsubscribeChat) {

          unsubscribeChat();

          unsubscribeChat =
            null;

        }

      }

    }
  );


  /*
   * ========================================
   * 初期化
   * ========================================
   */

  async function init() {

    await loadMunicipalities();

  }

  init();

</script>

</body>

</html>
