<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>まこマッチ 💕</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        sans-serif;
      background: #f7f3f8;
      color: #333;
    }

    .app {
      max-width: 480px;
      margin: auto;
      min-height: 100vh;
      background: white;
    }

    header {
      padding: 22px 18px;
      background: linear-gradient(135deg,#ff7aa8,#9b8cff);
      color: white;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    h2 {
      margin-top: 0;
    }

    .sub {
      opacity: .9;
      margin-top: 5px;
    }

    main {
      padding: 16px;
    }

    .card {
      border: 1px solid #eee;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 5px 18px #0000000d;
    }

    .form-title {
      font-weight: bold;
      margin-top: 14px;
      margin-bottom: 5px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 12px;
      margin: 6px 0 10px;
      font: inherit;
      background: white;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
    }

    .like {
      background: #ff5c91;
      color: white;
    }

    .like:disabled {
      background: #ccc;
    }

    .block {
      background: #eee;
      color: #555;
      margin-left: 6px;
    }

    .profile {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .avatar {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #eee;
      font-size: 30px;
      flex-shrink: 0;
    }

    .name {
      font-weight: 700;
      font-size: 18px;
    }

    .age {
      color: #777;
      font-weight: normal;
    }

    .location {
      color: #777;
      font-size: 13px;
      margin-top: 4px;
    }

    .tag {
      display: inline-block;
      background: #f2eaff;
      padding: 5px 9px;
      border-radius: 20px;
      margin: 4px 3px 0 0;
      font-size: 12px;
    }

    .small {
      font-size: 12px;
      color: #888;
    }

    .saved-location {
      margin-top: 10px;
      padding: 10px;
      background: #f7f3ff;
      border-radius: 12px;
      font-size: 13px;
    }

    .success {
      margin-top: 10px;
      padding: 12px;
      background: #effff5;
      color: #16834b;
      border-radius: 12px;
    }

    .match {
      background: linear-gradient(135deg,#fff0f6,#f1edff);
      border: 1px solid #eadcf5;
    }

    .post {
      background: #fff4f7;
    }

    .loading {
      color: #888;
      text-align: center;
      padding: 20px;
    }

    .error {
      color: #e44;
      background: #fff0f0;
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
    }

    .account {
      background: #f7f3ff;
    }

    .logout {
      background: #eee;
      color: #555;
      margin-top: 10px;
    }

    .empty {
      padding: 20px;
      text-align: center;
      color: #888;
      border: 1px dashed #ddd;
      border-radius: 15px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>まこマッチ 💕</h1>
    <div class="sub">
      18歳以上限定・安心して話せる場所
    </div>
  </header>

  <main>

    <!-- アカウント -->
    <div class="card account">

      <h2>👤 アカウント</h2>

      <div id="accountEmail">
        読み込み中...
      </div>

      <button
        class="logout"
        onclick="logout()"
      >
        ログアウト
      </button>

    </div>


    <!-- プロフィール -->
    <div class="card">

      <h2>プロフィール</h2>

      <div class="form-title">
        ニックネーム
      </div>

      <input
        id="myName"
        placeholder="ニックネーム"
      >

      <div class="form-title">
        年齢
      </div>

      <input
        id="myAge"
        type="number"
        min="18"
        placeholder="18歳以上"
      >

      <div class="form-title">
        性別
      </div>

      <select id="myGender">
        <option value="">
          選択してください
        </option>
        <option value="男性">男性</option>
        <option value="女性">女性</option>
        <option value="その他">その他</option>
        <option value="回答しない">回答しない</option>
      </select>


      <div class="form-title">
        都道府県
      </div>

      <select id="prefecture">
        <option value="">
          読み込み中...
        </option>
      </select>


      <div class="form-title">
        市区町村
      </div>

      <select
        id="municipality"
        disabled
      >
        <option value="">
          先に都道府県を選択してください
        </option>
      </select>


      <div class="form-title">
        自己紹介
      </div>

      <textarea
        id="myBio"
        rows="3"
        placeholder="自己紹介"
      ></textarea>


      <button
        class="like"
        onclick="saveProfile()"
      >
        プロフィールを保存
      </button>

      <div
        id="saved"
        class="success"
        style="display:none;"
      ></div>

      <div
        id="savedLocation"
        class="saved-location"
        style="display:none;"
      ></div>

    </div>


    <!-- マッチした人 -->
    <h2>💕 マッチした人</h2>

    <div id="matches">
      <div class="loading">
        読み込み中...
      </div>
    </div>


    <!-- おすすめ -->
    <h2>💞 おすすめの人</h2>

    <div id="profiles">
      <div class="loading">
        読み込み中...
      </div>
    </div>


    <!-- 雑談 -->
    <div class="card post">

      <h2>💬 雑談コーナー</h2>

      <input
        id="postName"
        placeholder="名前（任意）"
      >

      <textarea
        id="postText"
        rows="3"
        placeholder="気軽にひとこと投稿しよう"
      ></textarea>

      <button
        class="like"
        onclick="addPost()"
      >
        投稿する
      </button>

      <div id="posts"></div>

    </div>

  </main>

</div>


<script type="module">

  /*
   * Firebase
   */

  import {
    initializeApp
  } from
  "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from
  "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

  import {
    getFirestore,
    doc,
    setDoc,
    getDoc,
    getDocs,
    collection,
    query,
    where,
    serverTimestamp
  } from
  "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";


  /*
   * Firebase設定
   */

  const firebaseConfig = {

    apiKey:
      "AIzaSyBVtlfUgyyt6eic_chW_ADyz3SCBtCz9GA",

    authDomain:
      "makomatch-7a96b.firebaseapp.com",

    projectId:
      "makomatch-7a96b",

    storageBucket:
      "makomatch-7a96b.firebasestorage.app",

    messagingSenderId:
      "371872457458",

    appId:
      "1:371872457458:web:6c9391508fbba63df2a66b",

    measurementId:
      "G-Y39HTKE7ZZ"

  };


  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);


  let currentUser = null;

  let municipalities = [];


  /*
   * 地域データ
   */

  const PREF_URL =
    "https://code4fukui.github.io/localgovjp/prefjp.json";

  const CITY_URL =
    "https://code4fukui.github.io/localgovjp/localgovjp.json";


  const prefecture =
    document.getElementById("prefecture");

  const municipality =
    document.getElementById("municipality");

  const myName =
    document.getElementById("myName");

  const myAge =
    document.getElementById("myAge");

  const myGender =
    document.getElementById("myGender");

  const myBio =
    document.getElementById("myBio");

  const saved =
    document.getElementById("saved");

  const savedLocation =
    document.getElementById("savedLocation");


  /*
   * 都道府県
   */

  async function loadPrefectures() {

    try {

      const response =
        await fetch(PREF_URL);

      if (!response.ok) {
        throw new Error();
      }

      const data =
        await response.json();

      prefecture.innerHTML =
        '<option value="">選択してください</option>';

      data.forEach(pref => {

        const option =
          document.createElement("option");

        option.value =
          pref.pid;

        option.textContent =
          pref.pref;

        prefecture.appendChild(option);

      });

    } catch (e) {

      prefecture.innerHTML =
        '<option value="">読み込み失敗</option>';

    }

  }


  /*
   * 市区町村
   */

  async function loadMunicipalities() {

    try {

      const response =
        await fetch(CITY_URL);

      if (!response.ok) {
        throw new Error();
      }

      municipalities =
        await response.json();

    } catch (e) {

      municipality.innerHTML =
        '<option value="">読み込み失敗</option>';

    }

  }


  /*
   * 都道府県変更
   */

  prefecture.addEventListener(
    "change",
    function() {

      const pid =
        this.value;

      municipality.innerHTML =
        '<option value="">市区町村を選択してください</option>';

      municipality.disabled = true;

      if (!pid) {
        return;
      }

      const cities =
        municipalities.filter(
          city =>
            String(city.pid) ===
            String(pid)
        );

      cities.forEach(city => {

        const option =
          document.createElement("option");

        option.value =
          city.city;

        option.textContent =
          city.city;

        municipality.appendChild(option);

      });

      municipality.disabled = false;

    }
  );


  /*
   * Firebaseにプロフィール保存
   */

  window.saveProfile = async function() {

    if (!currentUser) {

      alert(
        "ログインしてください。"
      );

      return;

    }


    const name =
      myName.value.trim();

    const age =
      Number(myAge.value);

    const gender =
      myGender.value;

    const pref =
      prefecture.options[
        prefecture.selectedIndex
      ]?.textContent || "";

    const city =
      municipality.value;

    const bio =
      myBio.value.trim();


    if (!name) {

      alert(
        "ニックネームを入力してください。"
      );

      return;

    }


    if (!age || age < 18) {

      alert(
        "18歳以上のみ登録できます。"
      );

      return;

    }


    if (!gender) {

      alert(
        "性別を選択してください。"
      );

      return;

    }


    if (!prefecture.value) {

      alert(
        "都道府県を選択してください。"
      );

      return;

    }


    if (!city) {

      alert(
        "市区町村を選択してください。"
      );

      return;

    }


    try {

      await setDoc(
        doc(
          db,
          "users",
          currentUser.uid
        ),
        {

          uid:
            currentUser.uid,

          name:
            name,

          age:
            age,

          gender:
            gender,

          prefecture:
            pref,

          municipality:
            city,

          bio:
            bio,

          updatedAt:
            serverTimestamp()

        },
        {
          merge: true
        }
      );


      localStorage.setItem(
        "makoProfile",
        JSON.stringify({
          name,
          age,
          gender,
          prefecture: pref,
          municipality: city,
          bio
        })
      );


      saved.style.display =
        "block";

      saved.textContent =
        "プロフィールを保存しました！💕";


      savedLocation.style.display =
        "block";

      savedLocation.innerHTML =
        "📍 " +
        escapeHtml(pref) +
        " " +
        escapeHtml(city);


      await loadUsers();

      await loadMatches();


    } catch (error) {

      console.error(error);

      alert(
        "保存できませんでした。\n" +
        error.message
      );

    }

  };


  /*
   * プロフィール読み込み
   */

  async function loadProfile() {

    if (!currentUser) {
      return;
    }

    try {

      const snapshot =
        await getDoc(
          doc(
            db,
            "users",
            currentUser.uid
          )
        );


      if (!snapshot.exists()) {

        return;

      }


      const profile =
        snapshot.data();


      myName.value =
        profile.name || "";

      myAge.value =
        profile.age || "";

      myGender.value =
        profile.gender || "";

      myBio.value =
        profile.bio || "";


      if (profile.prefecture) {

        const options =
          Array.from(
            prefecture.options
          );

        const option =
          options.find(
            o =>
              o.textContent ===
              profile.prefecture
          );


        if (option) {

          prefecture.value =
            option.value;

          prefecture.dispatchEvent(
            new Event("change")
          );


          setTimeout(() => {

            municipality.value =
              profile.municipality || "";

          }, 200);

        }


        savedLocation.style.display =
          "block";

        savedLocation.innerHTML =
          "📍 " +
          escapeHtml(
            profile.prefecture
          ) +
          " " +
          escapeHtml(
            profile.municipality || ""
          );

      }

    } catch (error) {

      console.error(error);

    }

  }


  /*
   * 他ユーザー取得
   */

  async function loadUsers() {

    const box =
      document.getElementById(
        "profiles"
      );

    box.innerHTML =
      '<div class="loading">ユーザーを読み込んでいます…</div>';


    if (!currentUser) {

      box.innerHTML =
        '<div class="empty">ログインしてください。</div>';

      return;

    }


    try {

      const snapshot =
        await getDocs(
          collection(
            db,
            "users"
          )
        );


      const users = [];


      snapshot.forEach(docSnap => {

        const data =
          docSnap.data();


        if (
          data.uid !==
          currentUser.uid &&
          data.age >= 18
        ) {

          users.push(data);

        }

      });


      if (!users.length) {

        box.innerHTML =
          '<div class="empty">まだ他のユーザーがいません。</div>';

        return;

      }


      box.innerHTML =
        "";


      for (const user of users) {

        const card =
          document.createElement("div");

        card.className =
          "card";


        card.innerHTML = `

          <div class="profile">

            <div class="avatar">
              ${getAvatar(user.gender)}
            </div>

            <div>

              <div class="name">
                ${escapeHtml(user.name || "匿名")}

                <span class="age">
                  ${user.age || ""}歳
                </span>
              </div>

              <div class="location">
                📍 ${escapeHtml(user.prefecture || "")}
                ${escapeHtml(user.municipality || "")}
              </div>

            </div>

          </div>

          <p>
            ${escapeHtml(user.bio || "よろしくお願いします！")}
          </p>

          <button
            class="like"
            data-uid="${escapeHtml(user.uid)}"
          >
            ❤️ いいね
          </button>

        `;


        const button =
          card.querySelector("button");


        button.addEventListener(
          "click",
          () =>
            sendLike(
              user,
              button
            )
        );


        box.appendChild(card);

      }

    } catch (error) {

      console.error(error);

      box.innerHTML =
        `<div class="error">
          ユーザーを取得できませんでした。<br>
          ${escapeHtml(error.message)}
        </div>`;

    }

  }


  /*
   * いいね
   */

  async function sendLike(
    user,
    button
  ) {

    if (!currentUser) {

      alert(
        "ログインしてください。"
      );

      return;

    }


    button.disabled = true;

    button.textContent =
      "送信中…";


    try {

      const likeId =
        currentUser.uid +
        "_" +
        user.uid;


      await setDoc(
        doc(
          db,
          "likes",
          likeId
        ),
        {

          from:
            currentUser.uid,

          to:
            user.uid,

          createdAt:
            serverTimestamp()

        }
      );


      /*
       * 相手からもいいねされているか確認
       */

      const reverseLike =
        await getDoc(
          doc(
            db,
            "likes",
            user.uid +
            "_" +
            currentUser.uid
          )
        );


      if (reverseLike.exists()) {

        /*
         * マッチ成立
         */

        const ids = [
          currentUser.uid,
          user.uid
        ].sort();


        const matchId =
          ids[0] +
          "_" +
          ids[1];


        await setDoc(
          doc(
            db,
            "matches",
            matchId
          ),
          {

            users: ids,

            createdAt:
              serverTimestamp()

          },
          {
            merge: true
          }
        );


        alert(
          "🎉 マッチしました！💕\n" +
          user.name +
          "さんとマッチ成立です！"
        );


        button.textContent =
          "💕 マッチ成立";

      } else {

        alert(
          user.name +
          "さんに「いいね！」しました💕"
        );


        button.textContent =
          "❤️ いいね済み";

      }


      await loadMatches();


    } catch (error) {

      console.error(error);

      alert(
        "いいねに失敗しました。\n" +
        error.message
      );


      button.disabled = false;

      button.textContent =
        "❤️ いいね";

    }

  }


  /*
   * マッチ一覧
   */

  async function loadMatches() {

    const box =
      document.getElementById(
        "matches"
      );


    if (!currentUser) {

      box.innerHTML =
        '<div class="empty">ログインしてください。</div>';

      return;

    }


    try {

      const snapshot =
        await getDocs(
          query(
            collection(
              db,
              "matches"
            ),
            where(
              "users",
              "array-contains",
              currentUser.uid
            )
          )
        );


      if (snapshot.empty) {

        box.innerHTML =
          '<div class="empty">まだマッチした人はいません。</div>';

        return;

      }


      box.innerHTML =
        "";


      for (
        const matchDoc
        of snapshot.docs
      ) {

        const match =
          matchDoc.data();


        const otherUid =
          match.users.find(
            uid =>
              uid !==
              currentUser.uid
          );


        if (!otherUid) {
          continue;
        }


        const userDoc =
          await getDoc(
            doc(
              db,
              "users",
              otherUid
            )
          );


        if (!userDoc.exists()) {
          continue;
        }


        const user =
          userDoc.data();


        const card =
          document.createElement("div");

        card.className =
          "card match";


        card.innerHTML = `

          <div class="profile">

            <div class="avatar">
              ${getAvatar(user.gender)}
            </div>

            <div>

              <div class="name">
                ${escapeHtml(user.name || "匿名")}
              </div>

              <div class="location">
                📍 ${escapeHtml(user.prefecture || "")}
                ${escapeHtml(user.municipality || "")}
              </div>

            </div>

          </div>

          <p>
            🎉 相互いいねでマッチしました！
          </p>

          <button
            class="like"
            onclick="openChat('${escapeJs(otherUid)}')"
          >
            💬 チャット
          </button>

        `;


        box.appendChild(card);

      }

    } catch (error) {

      console.error(error);

      box.innerHTML =
        `<div class="error">
          マッチ一覧を取得できませんでした。
        </div>`;

    }

  }


  /*
   * チャット
   *
   * 次の段階で本格的な
   * 1対1チャット画面を追加します。
   */

  window.openChat = function(uid) {

    alert(
      "💬 チャット機能を次に追加します！\n\n" +
      "相手ID:\n" +
      uid
    );

  };


  /*
   * ログアウト
   */

  window.logout = async function() {

    try {

      await signOut(auth);

    } catch (error) {

      alert(
        "ログアウトできませんでした。"
      );

    }

  };


  /*
   * 雑談
   */

  window.addPost = function() {

    const name =
      document
        .getElementById("postName")
        .value
        .trim() ||
      "匿名";


    const text =
      document
        .getElementById("postText")
        .value
        .trim();


    if (!text) {

      alert(
        "投稿内容を入力してください。"
      );

      return;

    }


    const posts =
      JSON.parse(
        localStorage.getItem(
          "makoPosts"
        ) || "[]"
      );


    posts.unshift({

      name:
        name,

      text:
        text,

      time:
        new Date()
          .toLocaleString("ja-JP")

    });


    localStorage.setItem(
      "makoPosts",
      JSON.stringify(posts)
    );


    document
      .getElementById("postText")
      .value = "";


    renderPosts();

  };


  function renderPosts() {

    const posts =
      JSON.parse(
        localStorage.getItem(
          "makoPosts"
        ) || "[]"
      );


    document.getElementById(
      "posts"
    ).innerHTML =

      posts.map(
        p => `

          <div class="card">

            <b>
              ${escapeHtml(p.name)}
            </b>

            <div>
              ${escapeHtml(p.text)}
            </div>

            <div class="small">
              ${escapeHtml(p.time)}
            </div>

          </div>

        `
      ).join("");

  }


  /*
   * アイコン
   */

  function getAvatar(gender) {

    if (gender === "女性") {
      return "👩";
    }

    if (gender === "男性") {
      return "👨";
    }

    return "🙂";

  }


  /*
   * HTMLエスケープ
   */

  function escapeHtml(text) {

    return String(text).replace(
      /[&<>"']/g,
      char => ({

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"

      }[char])
    );

  }


  /*
   * JavaScript用エスケープ
   */

  function escapeJs(text) {

    return String(text)
      .replace(
        /\\/g,
        "\\\\"
      )
      .replace(
        /'/g,
        "\\'"
      );

  }


  /*
   * ログイン状態
   */

  onAuthStateChanged(
    auth,
    async user => {

      if (!user) {

        currentUser =
          null;

        document
          .getElementById(
            "accountEmail"
          )
          .textContent =
          "ログインしていません。";

        document
          .getElementById(
            "profiles"
          )
          .innerHTML =
          '<div class="empty">ログインしてください。</div>';

        return;

      }


      currentUser =
        user;


      document
        .getElementById(
          "accountEmail"
        )
        .textContent =
        user.email ||
        "ログイン中";


      try {

        await Promise.all([
          loadPrefectures(),
          loadMunicipalities()
        ]);

        await loadProfile();

        await loadUsers();

        await loadMatches();

      } catch (error) {

        console.error(error);

      }

    }
  );


  /*
   * 雑談表示
   */

  renderPosts();

</script>
