<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>まこマッチ 💕</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        sans-serif;
      background: #f7f3f8;
      color: #333;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      max-width: 480px;
      margin: auto;
      min-height: 100vh;
      background: white;
    }

    header {
      padding: 22px 18px;
      background:
        linear-gradient(
          135deg,
          #ff7aa8,
          #9b8cff
        );
      color: white;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    h2 {
      margin-top: 0;
    }

    .sub {
      opacity: .9;
      margin-top: 5px;
    }

    main {
      padding: 16px;
    }

    .card {
      border: 1px solid #eee;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow:
        0 5px 18px #0000000d;
    }

    .form-title {
      font-weight: bold;
      margin-top: 14px;
      margin-bottom: 5px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 12px;
      margin: 6px 0 10px;
      background: white;
    }

    textarea {
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 12px 16px;
      font-weight: 700;
      font-size: 15px;
    }

    .primary {
      background: #ff5c91;
      color: white;
      width: 100%;
    }

    .secondary {
      background: #eee;
      color: #555;
    }

    .google {
      background: #fff;
      color: #444;
      border: 1px solid #ddd;
      width: 100%;
      margin-top: 8px;
    }

    .like {
      background: #ff5c91;
      color: white;
    }

    .block {
      background: #eee;
      color: #555;
      margin-left: 6px;
    }

    .logout {
      background: #eee;
      color: #555;
      width: 100%;
    }

    .profile {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .avatar {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #eee;
      font-size: 30px;
      flex-shrink: 0;
    }

    .name {
      font-weight: 700;
    }

    .age {
      color: #777;
      font-weight: normal;
    }

    .tag {
      display: inline-block;
      background: #f2eaff;
      padding: 5px 9px;
      border-radius: 20px;
      margin: 4px 3px 0 0;
      font-size: 12px;
    }

    .small {
      font-size: 12px;
      color: #888;
    }

    .saved-location {
      margin-top: 10px;
      padding: 10px;
      background: #f7f3ff;
      border-radius: 12px;
      font-size: 13px;
    }

    .post {
      background: #fff4f7;
    }

    #posts {
      margin-top: 10px;
    }

    .loading {
      color: #888;
      text-align: center;
      padding: 10px;
    }

    .error {
      color: #c33;
      background: #fff0f0;
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .success {
      color: #26733a;
      background: #effff2;
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .hidden {
      display: none !important;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .tab {
      flex: 1;
      background: #eee;
      color: #555;
    }

    .tab.active {
      background: #ff5c91;
      color: white;
    }

    .match-card {
      border: 1px solid #eee;
      border-radius: 16px;
      padding: 13px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .match-info {
      min-width: 0;
    }

    .chat-button {
      background: #9b8cff;
      color: white;
      white-space: nowrap;
    }

    .chat-box {
      height: 330px;
      overflow-y: auto;
      background: #f7f7fa;
      border-radius: 15px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .message {
      margin: 7px 0;
      display: flex;
    }

    .message.mine {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 78%;
      padding: 9px 12px;
      border-radius: 15px;
      background: white;
      box-shadow: 0 2px 5px #0000000b;
      word-break: break-word;
    }

    .message.mine .bubble {
      background: #ffe0ec;
    }

    .message-time {
      font-size: 10px;
      color: #999;
      margin-top: 3px;
    }

    .chat-input-row {
      display: flex;
      gap: 7px;
    }

    .chat-input-row input {
      flex: 1;
      margin: 0;
    }

    .chat-input-row button {
      background: #ff5c91;
      color: white;
    }

    .empty {
      text-align: center;
      color: #999;
      padding: 20px 10px;
    }

    .user-email {
      background: #f7f3ff;
      padding: 10px;
      border-radius: 12px;
      margin-bottom: 12px;
      font-size: 13px;
    }

    .notice {
      background: #fff8df;
      border-radius: 12px;
      padding: 10px;
      font-size: 13px;
      margin-bottom: 12px;
    }

  </style>
</head>

<body>

<div class="app">

  <header>

    <h1>まこマッチ 💕</h1>

    <div class="sub">
      18歳以上限定・安心して話せる場所
    </div>

  </header>


  <main>

    <!-- =========================
         ログイン
    ========================== -->

    <section
      id="authSection"
      class="card"
    >

      <h2>🔐 ログイン</h2>

      <div class="notice">
        18歳以上の方のみ利用できます。
      </div>

      <div
        id="authError"
        class="error hidden"
      ></div>

      <input
        id="email"
        type="email"
        placeholder="メールアドレス"
        autocomplete="email"
      >

      <input
        id="password"
        type="password"
        placeholder="パスワード（6文字以上）"
        autocomplete="current-password"
      >

      <button
        class="primary"
        onclick="login()"
      >
        ログイン
      </button>

      <button
        class="google"
        onclick="register()"
      >
        ✨ 新規アカウントを作る
      </button>

      <div
        class="small"
        style="margin-top:10px;"
      >
        新規登録ではメールアドレスと
        パスワードを使用します。
      </div>

    </section>


    <!-- =========================
         ログイン後
    ========================== -->

    <section
      id="appSection"
      class="hidden"
    >

      <div
        id="userEmail"
        class="user-email"
      ></div>


      <!-- プロフィール -->

      <div class="card">

        <h2>👤 プロフィール</h2>

        <div class="form-title">
          ニックネーム
        </div>

        <input
          id="myName"
          placeholder="ニックネーム"
        >

        <div class="form-title">
          年齢
        </div>

        <input
          id="myAge"
          type="number"
          min="18"
          max="120"
          placeholder="年齢（18歳以上）"
        >

        <div class="form-title">
          性別
        </div>

        <select id="myGender">

          <option value="">
            選択してください
          </option>

          <option value="男性">
            男性
          </option>

          <option value="女性">
            女性
          </option>

          <option value="その他">
            その他
          </option>

          <option value="回答しない">
            回答しない
          </option>

        </select>


        <div class="form-title">
          都道府県
        </div>

        <select id="prefecture">

          <option value="">
            読み込み中...
          </option>

        </select>


        <div class="form-title">
          市区町村
        </div>

        <select
          id="municipality"
          disabled
        >

          <option value="">
            先に都道府県を選択してください
          </option>

        </select>


        <div class="form-title">
          自己紹介
        </div>

        <textarea
          id="myBio"
          rows="4"
          placeholder="自己紹介を書いてみよう！"
        ></textarea>


        <button
          class="primary"
          onclick="saveProfile()"
        >
          プロフィールを保存 💕
        </button>


        <div
          id="saved"
          class="success hidden"
          style="margin-top:10px;"
        ></div>


        <div
          id="savedLocation"
          class="saved-location hidden"
        ></div>

      </div>


      <!-- =========================
           マッチング
      ========================== -->

      <div class="card">

        <h2>💕 マッチング</h2>

        <div class="small">
          気になる人に「いいね」してみよう！
          お互いにいいねするとマッチします。
        </div>

      </div>


      <div id="profiles">

        <div class="loading">
          プロフィールを読み込んでいます…
        </div>

      </div>


      <!-- =========================
           マッチした人
      ========================== -->

      <div class="card">

        <h2>💬 マッチした人</h2>

        <div id="matches">

          <div class="loading">
            読み込み中…
          </div>

        </div>

      </div>


      <!-- =========================
           チャット
      ========================== -->

      <div
        id="chatSection"
        class="card hidden"
      >

        <h2 id="chatTitle">
          💬 チャット
        </h2>

        <div
          id="chatBox"
          class="chat-box"
        ></div>

        <div class="chat-input-row">

          <input
            id="chatInput"
            placeholder="メッセージを入力"
            maxlength="500"
          >

          <button
            onclick="sendMessage()"
          >
            送信
          </button>

        </div>

        <button
          class="secondary"
          style="margin-top:10px;width:100%;"
          onclick="closeChat()"
        >
          チャットを閉じる
        </button>

      </div>


      <!-- =========================
           雑談
      ========================== -->

      <div class="card post">

        <h2>
          💬 雑談コーナー
        </h2>

        <input
          id="postName"
          placeholder="表示名"
        >

        <textarea
          id="postText"
          rows="3"
          maxlength="500"
          placeholder="気軽にひとこと投稿しよう"
        ></textarea>

        <button
          class="like"
          onclick="addPost()"
        >
          投稿する
        </button>

        <div id="posts"></div>

      </div>


      <!-- ログアウト -->

      <div class="card">

        <button
          class="logout"
          onclick="logout()"
        >
          ログアウト
        </button>

      </div>

    </section>

  </main>

</div>


<script type="module">

  /*
   * ========================================
   * Firebase
   * ========================================
   */

  import {
    initializeApp
  }
  from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
  }
  from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


  import {
    getFirestore,
    doc,
    setDoc,
    getDoc,
    getDocs,
    collection,
    query,
    where,
    orderBy,
    onSnapshot,
    addDoc,
    serverTimestamp
  }
  from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  const firebaseConfig = {

    apiKey:
      "AIzaSyBVtlfUgyyt6eic_chW_ADyz3SCBtCz9GA",

    authDomain:
      "makomatch-7a96b.firebaseapp.com",

    projectId:
      "makomatch-7a96b",

    storageBucket:
      "makomatch-7a96b.firebasestorage.app",

    messagingSenderId:
      "371872457458",

    appId:
      "1:371872457458:web:6c9391508fbba63df2a66b",

    measurementId:
      "G-Y39HTKE7ZZ"

  };


  const app =
    initializeApp(firebaseConfig);


  const auth =
    getAuth(app);


  const db =
    getFirestore(app);



  /*
   * ========================================
   * 地域データ
   * ========================================
   */

  const PREF_URL =
    "https://code4fukui.github.io/localgovjp/prefjp.json";


  const CITY_URL =
    "https://code4fukui.github.io/localgovjp/localgovjp.json";


  const prefecture =
    document.getElementById(
      "prefecture"
    );


  const municipality =
    document.getElementById(
      "municipality"
    );


  let municipalities = [];



  /*
   * ========================================
   * Firebase現在ユーザー
   * ========================================
   */

  let currentUser = null;


  let currentProfile = null;


  let currentChatUserId = null;


  let currentChatRoomId = null;


  let unsubscribeMessages = null;



  /*
   * ========================================
   * HTMLエスケープ
   * ========================================
   */

  function escapeHtml(text) {

    return String(text ?? "")
      .replace(
        /[&<>"']/g,
        function(char) {

          return {

            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"

          }[char];

        }
      );

  }



  /*
   * ========================================
   * エラー表示
   * ========================================
   */

  function showAuthError(message) {

    const box =
      document.getElementById(
        "authError"
      );

    box.textContent =
      message;

    box.classList.remove(
      "hidden"
    );

  }


  function hideAuthError() {

    document
      .getElementById(
        "authError"
      )
      .classList.add(
        "hidden"
      );

  }



  /*
   * ========================================
   * 新規登録
   * ========================================
   */

  window.register =
    async function() {

      hideAuthError();

      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;


      if (!email) {

        showAuthError(
          "メールアドレスを入力してください。"
        );

        return;

      }


      if (password.length < 6) {

        showAuthError(
          "パスワードは6文字以上にしてください。"
        );

        return;

      }


      try {

        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );


        alert(
          "アカウントを作成しました！💕"
        );


      } catch(error) {

        console.error(error);

        showAuthError(
          firebaseErrorMessage(
            error.code
          )
        );

      }

    };



  /*
   * ========================================
   * ログイン
   * ========================================
   */

  window.login =
    async function() {

      hideAuthError();

      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;


      if (!email || !password) {

        showAuthError(
          "メールアドレスとパスワードを入力してください。"
        );

        return;

      }


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


      } catch(error) {

        console.error(error);

        showAuthError(
          firebaseErrorMessage(
            error.code
          )
        );

      }

    };



  /*
   * ========================================
   * Firebaseエラー
   * ========================================
   */

  function firebaseErrorMessage(code) {

    switch(code) {

      case "auth/email-already-in-use":
        return "このメールアドレスはすでに登録されています。";

      case "auth/invalid-email":
        return "メールアドレスの形式が正しくありません。";

      case "auth/weak-password":
        return "パスワードは6文字以上にしてください。";

      case "auth/invalid-credential":
        return "メールアドレスまたはパスワードが違います。";

      case "auth/user-not-found":
        return "このアカウントは見つかりません。";

      case "auth/wrong-password":
        return "パスワードが違います。";

      case "auth/too-many-requests":
        return "試行回数が多すぎます。少し待ってください。";

      default:
        return "ログイン処理でエラーが発生しました。";

    }

  }



  /*
   * ========================================
   * ログアウト
   * ========================================
   */

  window.logout =
    async function() {

      await signOut(auth);

    };



  /*
   * ========================================
   * 認証状態
   * ========================================
   */

  onAuthStateChanged(
    auth,
    async function(user) {

      currentUser =
        user;


      if (!user) {

        document
          .getElementById(
            "authSection"
          )
          .classList.remove(
            "hidden"
          );


        document
          .getElementById(
            "appSection"
          )
          .classList.add(
            "hidden"
          );


        return;

      }


      document
        .getElementById(
          "authSection"
        )
        .classList.add(
          "hidden"
        );


      document
        .getElementById(
          "appSection"
        )
        .classList.remove(
          "hidden"
        );


      document
        .getElementById(
          "userEmail"
        )
        .textContent =
          "ログイン中：" +
          user.email;


      await loadProfile();


      loadUsers();


      loadMatches();


      renderPosts();

    }
  );



  /*
   * ========================================
   * 都道府県
   * ========================================
   */

  async function loadPrefectures() {

    try {

      const response =
        await fetch(
          PREF_URL
        );


      if (!response.ok) {

        throw new Error(
          "都道府県データ取得失敗"
        );

      }


      const prefectures =
        await response.json();


      prefecture.innerHTML =
        '<option value="">選択してください</option>';


      prefectures.forEach(
        pref => {

          const option =
            document.createElement(
              "option"
            );


          option.value =
            pref.pid;


          option.textContent =
            pref.pref;


          prefecture.appendChild(
            option
          );

        }
      );


    } catch(error) {

      console.error(error);


      prefecture.innerHTML =
        '<option value="">読み込み失敗</option>';

    }

  }



  /*
   * ========================================
   * 市区町村
   * ========================================
   */

  async function loadMunicipalities() {

    try {

      const response =
        await fetch(
          CITY_URL
        );


      if (!response.ok) {

        throw new Error(
          "市区町村データ取得失敗"
        );

      }


      municipalities =
        await response.json();


    } catch(error) {

      console.error(error);


      municipality.innerHTML =
        '<option value="">読み込み失敗</option>';

    }

  }



  prefecture.addEventListener(
    "change",
    function() {

      const selectedPid =
        this.value;


      municipality.innerHTML =
        '<option value="">市区町村を選択してください</option>';


      municipality.disabled =
        true;


      if (!selectedPid) {

        return;

      }


      const cities =
        municipalities.filter(
          city =>
            String(city.pid) ===
            String(selectedPid)
        );


      cities.forEach(
        city => {

          const option =
            document.createElement(
              "option"
            );


          option.value =
            city.city;


          option.textContent =
            city.city;


          municipality.appendChild(
            option
          );

        }
      );


      municipality.disabled =
        false;

    }
  );



  /*
   * ========================================
   * プロフィール保存
   * ========================================
   */

  window.saveProfile =
    async function() {

      if (!currentUser) {

        alert(
          "先にログインしてください。"
        );

        return;

      }


      const name =
        document
          .getElementById("myName")
          .value
          .trim();


      const age =
        Number(
          document
            .getElementById("myAge")
            .value
        );


      const gender =
        document
          .getElementById("myGender")
          .value;


      const pref =
        prefecture
          .options[
            prefecture.selectedIndex
          ]
          ?.textContent || "";


      const city =
        municipality.value;


      const bio =
        document
          .getElementById("myBio")
          .value
          .trim();


      if (!name) {

        alert(
          "ニックネームを入力してください。"
        );

        return;

      }


      if (!age || age < 18) {

        alert(
          "18歳以上のみ登録できます。"
        );

        return;

      }


      if (!gender) {

        alert(
          "性別を選択してください。"
        );

        return;

      }


      if (!prefecture.value) {

        alert(
          "都道府県を選択してください。"
        );

        return;

      }


      if (!city) {

        alert(
          "市区町村を選択してください。"
        );

        return;

      }


      const profile = {

        uid:
          currentUser.uid,

        name:
          name,

        age:
          age,

        gender:
          gender,

        prefecture:
          pref,

        municipality:
          city,

        bio:
          bio,

        updatedAt:
          serverTimestamp()

      };


      try {

        await setDoc(
          doc(
            db,
            "users",
            currentUser.uid
          ),
          profile,
          {
            merge: true
          }
        );


        currentProfile =
          profile;


        const saved =
          document.getElementById(
            "saved"
          );


        saved.textContent =
          "プロフィールを保存しました！💕";


        saved.classList.remove(
          "hidden"
        );


        const savedLocation =
          document.getElementById(
            "savedLocation"
          );


        savedLocation.innerHTML =
          "📍 " +
          escapeHtml(pref) +
          " " +
          escapeHtml(city);


        savedLocation.classList.remove(
          "hidden"
        );


        loadUsers();


      } catch(error) {

        console.error(error);


        alert(
          "プロフィール保存に失敗しました。"
        );

      }

    };



  /*
   * ========================================
   * プロフィール読み込み
   * ========================================
   */

  async function loadProfile() {

    if (!currentUser) {

      return;

    }


    try {

      const snapshot =
        await getDoc(
          doc(
            db,
            "users",
            currentUser.uid
          )
        );


      if (!snapshot.exists()) {

        return;

      }


      const profile =
        snapshot.data();


      currentProfile =
        profile;


      document
        .getElementById("myName")
        .value =
          profile.name || "";


      document
        .getElementById("myAge")
        .value =
          profile.age || "";


      document
        .getElementById("myGender")
        .value =
          profile.gender || "";


      document
        .getElementById("myBio")
        .value =
          profile.bio || "";


      if (profile.prefecture) {

        const option =
          Array.from(
            prefecture.options
          ).find(
            o =>
              o.textContent ===
              profile.prefecture
          );


        if (option) {

          prefecture.value =
            option.value;


          prefecture.dispatchEvent(
            new Event("change")
          );


          setTimeout(
            () => {

              municipality.value =
                profile.municipality || "";

            },
            100
          );

        }

      }


      if (
        profile.prefecture &&
        profile.municipality
      ) {

        const savedLocation =
          document.getElementById(
            "savedLocation"
          );


        savedLocation.innerHTML =
          "📍 " +
          escapeHtml(
            profile.prefecture
          ) +
          " " +
          escapeHtml(
            profile.municipality
          );


        savedLocation.classList.remove(
          "hidden"
        );

      }

    } catch(error) {

      console.error(error);

    }

  }



  /*
   * ========================================
   * ユーザー一覧
   * ========================================
   */

  async function loadUsers() {

    const box =
      document.getElementById(
        "profiles"
      );


    box.innerHTML =
      '<div class="loading">読み込み中…</div>';


    try {

      const snapshot =
        await getDocs(
          collection(
            db,
            "users"
          )
        );


      const users =
        [];


      snapshot.forEach(
        docSnap => {

          const data =
            docSnap.data();


          if (
            docSnap.id !==
            currentUser.uid
          ) {

            if (
              Number(data.age) >= 18
            ) {

              users.push(data);

            }

          }

        }
      );


      if (!users.length) {

        box.innerHTML =
          '<div class="empty">まだ他のユーザーがいません。<br>友達を招待してみよう💕</div>';

        return;

      }


      box.innerHTML =
        "";


      for (const user of users) {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "card";


        const name =
          escapeHtml(
            user.name ||
            "名前なし"
          );


        const age =
          escapeHtml(
            user.age ||
            ""
          );


        const gender =
          escapeHtml(
            user.gender ||
            ""
          );


        const location =
          escapeHtml(
            (
              user.prefecture ||
              ""
            ) +
            " " +
            (
              user.municipality ||
              ""
            )
          );


        const bio =
          escapeHtml(
            user.bio ||
            "自己紹介はまだありません。"
          );


        card.innerHTML = `

          <div class="profile">

            <div class="avatar">
              💕
            </div>

            <div>

              <div class="name">
                ${name}
                <span class="age">
                  ${age}歳
                </span>
              </div>

              <div class="small">
                ${gender}
              </div>

            </div>

          </div>

          <div
            class="saved-location"
          >
            📍 ${location}
          </div>

          <p>
            ${bio}
          </p>

          <button
            class="like"
            data-user-id="${escapeHtml(user.uid)}"
          >
            ❤️ いいね
          </button>

          <button
            class="block"
            data-block-id="${escapeHtml(user.uid)}"
          >
            🚫 ブロック
          </button>

        `;


        const likeButton =
          card.querySelector(
            "[data-user-id]"
          );


        likeButton.addEventListener(
          "click",
          () =>
            likeUser(
              user.uid,
              user.name
            )
        );


        const blockButton =
          card.querySelector(
            "[data-block-id]"
          );


        blockButton.addEventListener(
          "click",
          () =>
            blockUser(
              user.uid,
              user.name
            )
        );


        box.appendChild(
          card
        );

      }


    } catch(error) {

      console.error(error);


      box.innerHTML =
        '<div class="error">ユーザーの読み込みに失敗しました。</div>';

    }

  }



  /*
   * ========================================
   * いいね
   * ========================================
   */

  async function likeUser(
    otherUid,
    otherName
  ) {

    if (!currentUser) {

      return;

    }


    try {

      const likeId =
        currentUser.uid +
        "_" +
        otherUid;


      await setDoc(
        doc(
          db,
          "likes",
          likeId
        ),
        {

          from:
            currentUser.uid,

          to:
            otherUid,

          createdAt:
            serverTimestamp()

        }
      );


      const reverseId =
        otherUid +
        "_" +
        currentUser.uid;


      const reverse =
        await getDoc(
          doc(
            db,
            "likes",
            reverseId
          )
        );


      if (reverse.exists()) {

        const roomId =
          makeRoomId(
            currentUser.uid,
            otherUid
          );


        await setDoc(
          doc(
            db,
            "matches",
            roomId
          ),
          {

            users: [
              currentUser.uid,
              otherUid
            ],

            createdAt:
              serverTimestamp()

          },
          {
            merge: true
          }
        );


        alert(
          "💕 マッチしました！\n" +
          otherName +
          "さんとチャットできます！"
        );


        loadMatches();


      } else {

        alert(
          otherName +
          "さんにいいねしました！💕"
        );

      }


    } catch(error) {

      console.error(error);


      alert(
        "いいねに失敗しました。"
      );

    }

  }



  /*
   * ========================================
   * マッチ一覧
   * ========================================
   */

  async function loadMatches() {

    const box =
      document.getElementById(
        "matches"
      );


    if (!currentUser) {

      return;

    }


    try {

      const snapshot =
        await getDocs(
          collection(
            db,
            "matches"
          )
        );


      const matches =
        [];


      snapshot.forEach(
        snap => {

          const data =
            snap.data();


          if (
            Array.isArray(
              data.users
            ) &&
            data.users.includes(
              currentUser.uid
            )
          ) {

            matches.push(
              data
            );

          }

        }
      );


      if (!matches.length) {

        box.innerHTML =
          '<div class="empty">まだマッチしていません💕<br>気になる人にいいねしてみよう！</div>';

        return;

      }


      box.innerHTML =
        "";


      for (
        const match
        of matches
      ) {

        const otherUid =
          match.users.find(
            uid =>
              uid !==
              currentUser.uid
          );


        if (!otherUid) {

          continue;

        }


        const userSnap =
          await getDoc(
            doc(
              db,
              "users",
              otherUid
            )
          );


        if (!userSnap.exists()) {

          continue;

        }


        const user =
          userSnap.data();


        const card =
          document.createElement(
            "div"
          );


        card.className =
          "match-card";


        card.innerHTML = `

          <div class="match-info">

            <div class="name">
              💕
              ${escapeHtml(
                user.name ||
                "ユーザー"
              )}
            </div>

            <div class="small">
              ${escapeHtml(
                user.age ||
                ""
              )}歳
              ・
              ${escapeHtml(
                user.prefecture ||
                ""
              )}
            </div>

          </div>

          <button
            class="chat-button"
          >
            💬 チャット
          </button>

        `;


        card
          .querySelector(
            "button"
          )
          .addEventListener(
            "click",
            () =>
              openChat(
                otherUid,
                user
              )
          );


        box.appendChild(
          card
        );

      }


    } catch(error) {

      console.error(error);


      box.innerHTML =
        '<div class="error">マッチ一覧の読み込みに失敗しました。</div>';

    }

  }



  /*
   * ========================================
   * チャットルームID
   * ========================================
   */

  function makeRoomId(
    uid1,
    uid2
  ) {

    return [
      uid1,
      uid2
    ]
      .sort()
      .join("_");

  }



  /*
   * ========================================
   * チャット開始
   * ========================================
   */

  async function openChat(
    otherUid,
    user
  ) {

    currentChatUserId =
      otherUid;


    currentChatRoomId =
      makeRoomId(
        currentUser.uid,
        otherUid
      );


    document
      .getElementById(
        "chatSection"
      )
      .classList.remove(
        "hidden"
      );


    document
      .getElementById(
        "chatTitle"
      )
      .textContent =
        "💬 " +
        (
          user.name ||
          "ユーザー"
        ) +
        "さんとのチャット";


    document
      .getElementById(
        "chatInput"
      )
      .focus();


    loadMessages();

  }



  /*
   * ========================================
   * メッセージ読み込み
   * ========================================
   */

  function loadMessages() {

    const chatBox =
      document.getElementById(
        "chatBox"
      );


    chatBox.innerHTML =
      '<div class="loading">メッセージを読み込んでいます…</div>';


    if (unsubscribeMessages) {

      unsubscribeMessages();

    }


    const messagesRef =
      collection(
        db,
        "rooms",
        currentChatRoomId,
        "messages"
      );


    const q =
      query(
        messagesRef,
        orderBy(
          "createdAt",
          "asc"
        )
      );


    unsubscribeMessages =
      onSnapshot(
        q,
        snapshot => {

          chatBox.innerHTML =
            "";


          if (
            snapshot.empty
          ) {

            chatBox.innerHTML =
              '<div class="empty">まだメッセージはありません。<br>最初のメッセージを送ろう💕</div>';

            return;

          }


          snapshot.forEach(
            snap => {

              const message =
                snap.data();


              const mine =
                message.uid ===
                currentUser.uid;


              const wrapper =
                document.createElement(
                  "div"
                );


              wrapper.className =
                "message" +
                (
                  mine
                    ? " mine"
                    : ""
                );


              const bubble =
                document.createElement(
                  "div"
                );


              bubble.className =
                "bubble";


              bubble.innerHTML =
                escapeHtml(
                  message.text
                );


              wrapper.appendChild(
                bubble
              );


              chatBox.appendChild(
                wrapper
              );

            }
          );


          chatBox.scrollTop =
            chatBox.scrollHeight;

        },
        error => {

          console.error(error);

          chatBox.innerHTML =
            '<div class="error">チャットを読み込めませんでした。</div>';

        }
      );

  }



  /*
   * ========================================
   * メッセージ送信
   * ========================================
   */

  window.sendMessage =
    async function() {

      if (
        !currentUser ||
        !currentChatRoomId
      ) {

        return;

      }


      const input =
        document.getElementById(
          "chatInput"
        );


      const text =
        input.value.trim();


      if (!text) {

        return;

      }


      try {

        await addDoc(
          collection(
            db,
            "rooms",
            currentChatRoomId,
            "messages"
          ),
          {

            uid:
              currentUser.uid,

            text:
              text,

            createdAt:
              serverTimestamp()

          }
        );


        input.value =
          "";


        input.focus();


      } catch(error) {

        console.error(error);


        alert(
          "メッセージ送信に失敗しました。"
        );

      }

    };



  /*
   * Enterで送信
   */

  document
    .getElementById(
      "chatInput"
    )
    .addEventListener(
      "keydown",
      function(event) {

        if (
          event.key ===
          "Enter"
        ) {

          event.preventDefault();

          window.sendMessage();

        }

      }
    );



  /*
   * ========================================
   * チャットを閉じる
   * ========================================
   */

  window.closeChat =
    function() {

      document
        .getElementById(
          "chatSection"
        )
        .classList.add(
          "hidden"
        );


      currentChatUserId =
        null;


      currentChatRoomId =
        null;


      if (unsubscribeMessages) {

        unsubscribeMessages();

        unsubscribeMessages =
          null;

      }

    };



  /*
   * ========================================
   * ブロック
   * ========================================
   */

  async function blockUser(
    otherUid,
    otherName
  ) {

    const ok =
      confirm(
        otherName +
        "さんをブロックしますか？"
      );


    if (!ok) {

      return;

    }


    try {

      await setDoc(
        doc(
          db,
          "blocks",
          currentUser.uid +
          "_" +
          otherUid
        ),
        {

          from:
            currentUser.uid,

          to:
            otherUid,

          createdAt:
            serverTimestamp()

        }
      );


      alert(
        otherName +
        "さんをブロックしました。"
      );


      loadUsers();


    } catch(error) {

      console.error(error);


      alert(
        "ブロックに失敗しました。"
      );

    }

  }



  /*
   * ========================================
   * 雑談投稿
   * ========================================
   */

  window.addPost =
    async function() {

      if (!currentUser) {

        return;

      }


      const name =
        document
          .getElementById(
            "postName"
          )
          .value
          .trim();


      const text =
        document
          .getElementById(
            "postText"
          )
          .value
          .trim();


      if (!text) {

        alert(
          "投稿内容を入力してください。"
        );

        return;

      }


      try {

        await addDoc(
          collection(
            db,
            "posts"
          ),
          {

            uid:
              currentUser.uid,

            name:
              name ||
              (
                currentProfile?.name ||
                "匿名"
              ),

            text:
              text,

            createdAt:
              serverTimestamp()

          }
        );


        document
          .getElementById(
            "postText"
          )
          .value =
            "";


        renderPosts();


      } catch(error) {

        console.error(error);


        alert(
          "投稿に失敗しました。"
        );

      }

    };



  /*
   * ========================================
   * 雑談表示
   * ========================================
   */

  async function renderPosts() {

    const box =
      document.getElementById(
        "posts"
      );


    box.innerHTML =
      '<div class="loading">投稿を読み込んでいます…</div>';


    try {

      const q =
        query(
          collection(
            db,
            "posts"
          ),
          orderBy(
            "createdAt",
            "desc"
          )
        );


      const snapshot =
        await getDocs(q);


      if (snapshot.empty) {

        box.innerHTML =
          '<div class="empty">まだ投稿はありません。</div>';

        return;

      }


      box.innerHTML =
        "";


      snapshot.forEach(
        snap => {

          const post =
            snap.data();


          const card =
            document.createElement(
              "div"
            );


          card.className =
            "card";


          card.innerHTML = `

            <b>
              ${escapeHtml(
                post.name ||
                "匿名"
              )}
            </b>

            <div style="margin-top:6px;">
              ${escapeHtml(
                post.text
              )}
            </div>

          `;


          box.appendChild(
            card
          );

        }
      );


    } catch(error) {

      console.error(error);


      box.innerHTML =
        '<div class="error">投稿の読み込みに失敗しました。</div>';

    }

  }



  /*
   * ========================================
   * 起動
   * ========================================
   */

  async function init() {

    await Promise.all([

      loadPrefectures(),

      loadMunicipalities()

    ]);

  }


  init();

</script>
