<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>ゼロ円マッチ 💕</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
      background: linear-gradient(
        135deg,
        #fff0f6,
        #f2efff
      );
      color: #333;
    }

    body {
      padding: 15px 0;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: min(100%, 520px);
      min-height: calc(100vh - 30px);
      margin: 0 auto;
      background: #fff;
      box-shadow: 0 8px 30px rgba(100, 70, 100, .15);
      overflow: hidden;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      padding: 20px 18px;
      color: #fff;
      background:
        linear-gradient(
          135deg,
          #ff6f9f,
          #9b8cff
        );
    }

    .brand {
      font-size: 25px;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 5px;
      font-size: 12px;
      opacity: .92;
    }

    /* =========================
       AUTH
    ========================= */

    .auth {
      padding: 24px 18px 30px;
    }

    .authTitle {
      text-align: center;
      font-size: 23px;
      font-weight: 800;
      margin: 10px 0 8px;
    }

    .authDescription {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-bottom: 22px;
      line-height: 1.7;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #555;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 12px;
      background: #fff;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #ff77a5;
      box-shadow: 0 0 0 3px rgba(255, 119, 165, .12);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .ageCheck {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 0 16px;
      font-size: 13px;
    }

    .ageCheck input {
      width: auto;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 13px;
      font-weight: 800;
      margin-top: 7px;
    }

    .btnPrimary {
      color: #fff;
      background: linear-gradient(
        135deg,
        #ff6f9f,
        #9b8cff
      );
    }

    .btnSecondary {
      color: #555;
      background: #f3f3f7;
    }

    .btnDanger {
      color: #fff;
      background: #e85c74;
    }

    .smallBtn {
      border: 0;
      border-radius: 9px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 700;
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      display: none;
    }

    .content {
      padding: 15px;
      padding-bottom: 90px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .sectionTitle {
      font-size: 20px;
      font-weight: 800;
      margin: 5px 0 15px;
    }

    .card {
      background: #fff;
      border: 1px solid #eee;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 12px;
      box-shadow: 0 3px 12px rgba(80, 50, 80, .06);
    }

    .profileName {
      font-size: 18px;
      font-weight: 800;
    }

    .profileInfo {
      margin-top: 5px;
      color: #777;
      font-size: 13px;
    }

    .bio {
      margin-top: 10px;
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .cardActions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .cardActions button {
      flex: 1;
    }

    .empty {
      text-align: center;
      padding: 35px 15px;
      color: #888;
      line-height: 1.8;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #888;
    }

    /* =========================
       MATCH
    ========================= */

    .matchItem {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      border-radius: 13px;
      background: #faf8ff;
      margin-bottom: 9px;
    }

    .matchInfo {
      min-width: 0;
    }

    .matchNameRow {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .matchName {
      font-weight: 800;
    }

    .matchMeta {
      margin-top: 3px;
      font-size: 12px;
      color: #888;
    }

    .unreadBadge {
      min-width: 21px;
      height: 21px;
      padding: 0 6px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #ff4f86;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
    }

    /* =========================
       CHAT
    ========================= */

    .chatHeader {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid #eee;
    }

    .backBtn {
      border: 0;
      background: #f3f3f7;
      border-radius: 9px;
      padding: 7px 10px;
    }

    .chatTitle {
      font-weight: 800;
    }

    .chatMessages {
      height: 430px;
      overflow-y: auto;
      padding: 14px 4px;
      background: #fafafa;
      border-radius: 13px;
      margin-top: 12px;
    }

    .messageRow {
      display: flex;
      margin: 8px 0;
    }

    .messageRow.mine {
      justify-content: flex-end;
    }

    .messageRow.other {
      justify-content: flex-start;
    }

    .messageBubble {
      max-width: 78%;
      padding: 9px 11px;
      border-radius: 15px;
      position: relative;
      word-break: break-word;
    }

    .mine .messageBubble {
      background: #ffdfeb;
      border-bottom-right-radius: 4px;
    }

    .other .messageBubble {
      background: #fff;
      border: 1px solid #eee;
      border-bottom-left-radius: 4px;
    }

    .messageText {
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 14px;
    }

    .messageTime {
      margin-top: 4px;
      font-size: 10px;
      color: #999;
      text-align: right;
    }

    .deleteMessage {
      margin-top: 5px;
      border: 0;
      background: transparent;
      color: #c66;
      font-size: 10px;
      padding: 0;
    }

    .chatInputArea {
      display: flex;
      gap: 7px;
      margin-top: 10px;
    }

    .chatInputArea textarea {
      min-height: 48px;
      height: 48px;
      resize: none;
    }

    .sendBtn {
      width: 72px;
      border: 0;
      border-radius: 12px;
      color: #fff;
      font-weight: 800;
      background: linear-gradient(
        135deg,
        #ff6f9f,
        #9b8cff
      );
    }

    /* =========================
       POSTS
    ========================= */

    .postForm textarea {
      min-height: 85px;
    }

    .post {
      padding: 13px;
      border-radius: 13px;
      background: #faf8ff;
      margin-bottom: 10px;
    }

    .postTop {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .postName {
      font-weight: 800;
      font-size: 14px;
    }

    .postTime {
      color: #999;
      font-size: 10px;
    }

    .postText {
      margin-top: 8px;
      white-space: pre-wrap;
      line-height: 1.6;
      font-size: 14px;
    }

    .deletePost {
      margin-top: 7px;
      border: 0;
      background: transparent;
      color: #c66;
      font-size: 11px;
    }

    /* =========================
       BOTTOM NAV
    ========================= */

    .bottomNav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(100%, 520px);
      display: none;
      grid-template-columns: repeat(5, 1fr);
      background: rgba(255, 255, 255, .97);
      border-top: 1px solid #eee;
      z-index: 100;
    }

    .navBtn {
      position: relative;
      border: 0;
      background: transparent;
      padding: 9px 2px 10px;
      color: #777;
      font-size: 11px;
    }

    .navBtn.active {
      color: #ff5f91;
      font-weight: 800;
    }

    .navIcon {
      display: block;
      font-size: 19px;
      margin-bottom: 2px;
    }

    .navBadge {
      position: absolute;
      top: 3px;
      right: 20%;
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      border-radius: 999px;
      background: #ff4f86;
      color: #fff;
      font-size: 9px;
      display: none;
      align-items: center;
      justify-content: center;
    }

    /* =========================
       PROFILE
    ========================= */

    .profileSave {
      margin-top: 5px;
    }

    .logout {
      margin-top: 20px;
    }

    .notice {
      padding: 11px;
      border-radius: 11px;
      background: #fff5fa;
      color: #777;
      font-size: 12px;
      line-height: 1.6;
      margin-bottom: 14px;
    }

    .errorBox {
      display: none;
      padding: 11px;
      margin-bottom: 12px;
      border-radius: 10px;
      background: #fff0f0;
      color: #b44;
      font-size: 12px;
      white-space: pre-wrap;
    }

    @media (max-width: 520px) {
      body {
        padding: 0;
      }

      .app {
        min-height: 100vh;
      }

      .bottomNav {
        width: 100%;
      }
    }
  </style>
</head>


<body>

<div class="app">

  <!-- =========================
       HEADER
  ========================= -->

  <header>
    <div class="brand">ゼロ円マッチ 💕</div>
    <div class="subtitle">
      18歳以上限定・安心して話せる場所
    </div>
  </header>


  <!-- =========================
       AUTH
  ========================= -->

  <section id="authScreen" class="auth">

    <div class="authTitle">
      ゼロ円マッチ 💕
    </div>

    <div class="authDescription">
      気になる人とつながって<br>
      2人だけでお話しできます。
    </div>

    <div id="authError" class="errorBox"></div>

    <div class="field">
      <label>メールアドレス</label>
      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="example@example.com"
      >
    </div>

    <div class="field">
      <label>パスワード</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="6文字以上"
      >
    </div>

    <label class="ageCheck">
      <input
        id="ageCheck"
        type="checkbox"
      >
      <span>私は18歳以上です</span>
    </label>

    <button
      id="loginBtn"
      class="btn btnPrimary"
    >
      ログイン
    </button>

    <button
      id="registerBtn"
      class="btn btnSecondary"
    >
      新規登録
    </button>

  </section>


  <!-- =========================
       MAIN
  ========================= -->

  <main id="mainScreen" class="main">

    <div class="content">

      <!-- =====================
           PROFILE
      ====================== -->

      <section
        id="profileScreen"
        class="screen active"
      >

        <div class="sectionTitle">
          👤 プロフィール
        </div>

        <div class="notice">
          プロフィールを登録すると、
          おすすめのユーザーに表示されます。
        </div>

        <div class="field">
          <label>ニックネーム</label>
          <input
            id="nickname"
            maxlength="30"
            placeholder="ニックネーム"
          >
        </div>

        <div class="field">
          <label>年齢</label>
          <input
            id="age"
            type="number"
            min="18"
            max="120"
            placeholder="18"
          >
        </div>

        <div class="field">
          <label>性別</label>
          <select id="gender">
            <option value="">選択してください</option>
            <option value="男性">男性</option>
            <option value="女性">女性</option>
            <option value="その他">その他</option>
          </select>
        </div>

        <div class="field">
          <label>都道府県</label>
          <select id="prefecture">
            <option value="">
              読み込み中...
            </option>
          </select>
        </div>

        <div class="field">
          <label>市区町村</label>
          <select id="city">
            <option value="">
              都道府県を先に選択してください
            </option>
          </select>
        </div>

        <div class="field">
          <label>自己紹介</label>
          <textarea
            id="bio"
            maxlength="500"
            placeholder="気軽に自己紹介を書いてみよう！"
          ></textarea>
        </div>

        <button
          id="saveProfileBtn"
          class="btn btnPrimary profileSave"
        >
          プロフィールを保存 💕
        </button>

        <button
          id="logoutBtn"
          class="btn btnDanger logout"
        >
          ログアウト
        </button>

      </section>


      <!-- =====================
           RECOMMEND
      ====================== -->

      <section
        id="recommendScreen"
        class="screen"
      >

        <div class="sectionTitle">
          💕 おすすめ
        </div>

        <div class="notice">
          気になる人に「いいね」を送ってみよう！
          お互いにいいねするとマッチします。
        </div>

        <div id="recommendList">
          <div class="loading">
            読み込み中...
          </div>
        </div>

      </section>


      <!-- =====================
           MATCH
      ====================== -->

      <section
        id="matchScreen"
        class="screen"
      >

        <div class="sectionTitle">
          💖 マッチ
        </div>

        <div id="matchList">
          <div class="loading">
            読み込み中...
          </div>
        </div>

      </section>


      <!-- =====================
           CHAT
      ====================== -->

      <section
        id="chatScreen"
        class="screen"
      >

        <div class="chatHeader">

          <button
            id="backToMatchBtn"
            class="backBtn"
          >
            ←
          </button>

          <div>
            <div
              id="chatPartnerName"
              class="chatTitle"
            >
              チャット
            </div>

            <div
              style="
                font-size:11px;
                color:#999;
              "
            >
              2人だけのチャット
            </div>
          </div>

        </div>

        <div
          id="chatMessages"
          class="chatMessages"
        >
          <div class="empty">
            メッセージはまだありません。
          </div>
        </div>

        <div class="chatInputArea">

          <textarea
            id="messageInput"
            maxlength="1000"
            placeholder="メッセージを入力..."
          ></textarea>

          <button
            id="sendMessageBtn"
            class="sendBtn"
          >
            送信
          </button>

        </div>

      </section>


      <!-- =====================
           POSTS
      ====================== -->

      <section
        id="talkScreen"
        class="screen"
      >

        <div class="sectionTitle">
          🗣️ 雑談コーナー
        </div>

        <div class="card postForm">

          <textarea
            id="postInput"
            maxlength="500"
            placeholder="気軽にひとこと投稿しよう"
          ></textarea>

          <button
            id="postBtn"
            class="btn btnPrimary"
          >
            投稿する
          </button>

        </div>

        <div id="postList">
          <div class="loading">
            投稿を読み込み中...
          </div>
        </div>

      </section>

    </div>


    <!-- =========================
         NAV
    ========================= -->

    <nav
      id="bottomNav"
      class="bottomNav"
    >

      <button
        class="navBtn active"
        data-screen="profileScreen"
      >
        <span class="navIcon">👤</span>
        プロフィール
      </button>

      <button
        class="navBtn"
        data-screen="recommendScreen"
      >
        <span class="navIcon">💕</span>
        おすすめ
      </button>

      <button
        class="navBtn"
        data-screen="matchScreen"
      >
        <span class="navIcon">💖</span>
        マッチ
        <span
          id="matchNavBadge"
          class="navBadge"
        >0</span>
      </button>

      <button
        class="navBtn"
        data-screen="chatScreen"
      >
        <span class="navIcon">💬</span>
        チャット
        <span
          id="chatNavBadge"
          class="navBadge"
        >0</span>
      </button>

      <button
        class="navBtn"
        data-screen="talkScreen"
      >
        <span class="navIcon">🗣️</span>
        雑談
      </button>

    </nav>

  </main>

</div>


<script type="module">

  /* =========================================
     FIREBASE
  ========================================= */

  import {
    initializeApp
  } from
  "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from
  "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    updateDoc,
    deleteDoc,
    addDoc,
    collection,
    getDocs,
    onSnapshot,
    serverTimestamp,
    query,
    orderBy
  } from
  "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


  /* =========================================
     FIREBASE CONFIG
  ========================================= */

  const firebaseConfig = {

    apiKey:
      "AIzaSyBVtlfUgyyt6eic_chW_ADyz3SCBtCz9GA",

    authDomain:
      "makomatch-7a96b.firebaseapp.com",

    projectId:
      "makomatch-7a96b",

    storageBucket:
      "makomatch-7a96b.firebasestorage.app",

    messagingSenderId:
      "371872457458",

    appId:
      "1:371872457458:web:6c9391508fbba63df2a66b",

    measurementId:
      "G-Y39HTKE7ZZ"
  };


  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);


  /* =========================================
     STATE
  ========================================= */

  let currentUser = null;

  let currentProfile = null;

  let currentMatchId = null;

  let currentChatPartner = null;

  let unsubscribeMessages = null;

  let unsubscribeMatches = null;

  let unsubscribePosts = null;

  let profilesCache = {};


  /* =========================================
     DOM
  ========================================= */

  const $ = id =>
    document.getElementById(id);


  /* =========================================
     ERROR
  ========================================= */

  function showAuthError(error) {

    const box = $("authError");

    box.style.display = "block";

    let message =
      error?.message ||
      String(error);

    if (
      error?.code ===
      "auth/email-already-in-use"
    ) {
      message =
        "このメールアドレスはすでに登録されています。";
    }

    if (
      error?.code ===
      "auth/invalid-credential"
    ) {
      message =
        "メールアドレスまたはパスワードが違います。";
    }

    if (
      error?.code ===
      "auth/weak-password"
    ) {
      message =
        "パスワードは6文字以上にしてください。";
    }

    box.textContent =
      message;
  }


  function hideAuthError() {

    $("authError").style.display =
      "none";

    $("authError").textContent =
      "";
  }


  /* =========================================
     AGE CHECK
  ========================================= */

  function checkAge() {

    if (!$("ageCheck").checked) {

      alert(
        "18歳以上であることを確認してください。"
      );

      return false;
    }

    return true;
  }


  /* =========================================
     REGISTER
  ========================================= */

  $("registerBtn").addEventListener(
    "click",
    async () => {

      hideAuthError();

      if (!checkAge()) {
        return;
      }

      const email =
        $("email").value.trim();

      const password =
        $("password").value;

      if (!email || !password) {

        alert(
          "メールアドレスとパスワードを入力してください。"
        );

        return;
      }

      if (password.length < 6) {

        alert(
          "パスワードは6文字以上にしてください。"
        );

        return;
      }

      try {

        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

        alert(
          "登録しました！プロフィールを設定してください💕"
        );

      } catch (error) {

        console.error(error);

        showAuthError(error);
      }
    }
  );


  /* =========================================
     LOGIN
  ========================================= */

  $("loginBtn").addEventListener(
    "click",
    async () => {

      hideAuthError();

      const email =
        $("email").value.trim();

      const password =
        $("password").value;

      if (!email || !password) {

        alert(
          "メールアドレスとパスワードを入力してください。"
        );

        return;
      }

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      } catch (error) {

        console.error(error);

        showAuthError(error);
      }
    }
  );


  /* =========================================
     AUTH STATE
  ========================================= */

  onAuthStateChanged(
    auth,
    async user => {

      if (user) {

        currentUser =
          user;

        $("authScreen").style.display =
          "none";

        $("mainScreen").style.display =
          "block";

        $("bottomNav").style.display =
          "grid";

        await loadMyProfile();

        await loadLocations();

        showScreen(
          "profileScreen"
        );

        loadRecommendations();

        loadMatches();

        loadPosts();

      } else {

        currentUser = null;

        $("authScreen").style.display =
          "block";

        $("mainScreen").style.display =
          "none";

        $("bottomNav").style.display =
          "none";

        if (unsubscribeMessages) {
          unsubscribeMessages();
          unsubscribeMessages = null;
        }

        if (unsubscribeMatches) {
          unsubscribeMatches();
          unsubscribeMatches = null;
        }

        if (unsubscribePosts) {
          unsubscribePosts();
          unsubscribePosts = null;
        }
      }
    }
  );

  /* =========================================
     FILL PROFILE

  function fillProfileForm(data) {

      data.nickname || "";

    $("age").value =
      data.age || "";

  /* =========================================
     LOCATIONS
  ========================================= */

  let locationData = [];


  async function loadLocations() {

    try {

      const response =
        await fetch(
          "https://code4fukui.github.io/localgovjp/localgovjp.json"
        );

      if (!response.ok) {
        throw new Error(
          "地域データを取得できませんでした。"
        );
      }

      locationData =
        await response.json();

      createPrefectureOptions();

      if (currentProfile?.prefecture) {

        createCityOptions(
          currentProfile.prefecture
        );

        if (currentProfile.city) {
          $("city").value =
            currentProfile.city;
        }
      }

    } catch (error) {

      console.error(error);

      $("prefecture").innerHTML =
        `
        <option value="">
          地域データを読み込めません
        </option>
        `;

    }
  }


  function getPrefectures() {

    const set =
      new Set();

    for (const item of locationData) {

      const pref =
        item.prefecture ||
        item.pref ||
        item.都道府県;

      if (pref) {
        set.add(pref);
      }
    }

    return [...set];
  }


  function createPrefectureOptions() {

    const select =
      $("prefecture");

    const current =
      select.value;

    select.innerHTML =
      `
      <option value="">
        選択してください
      </option>
      `;

    const prefectures =
      getPrefectures();

    for (
      const prefecture
      of prefectures
    ) {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        prefecture;

      option.textContent =
        prefecture;

      select.appendChild(
        option
      );
    }

    if (current) {
      select.value =
        current;
    }
  }


  function createCityOptions(
    prefecture
  ) {

    const select =
      $("city");

    select.innerHTML =
      `
      <option value="">
        選択してください
      </option>
      `;

    const cities =
      new Set();

    for (
      const item
      of locationData
    ) {

      const pref =
        item.prefecture ||
        item.pref ||
        item.都道府県;

      const city =
        item.city ||
        item.市区町村;

      if (
        pref === prefecture &&
        city
      ) {
        cities.add(city);
      }
    }

    for (
      const city
      of [...cities]
    ) {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        city;

      option.textContent =
        city;

      select.appendChild(
        option
      );
    }
  }


  $("prefecture").addEventListener(
    "change",
    () => {

      createCityOptions(
        $("prefecture").value
      );
    }
  );

  /* =========================================
     GET ALL USERS
  ========================================= */

  async function getAllUsers() {

    const snap =
      await getDocs(
        collection(
          db,
          "users"
        )
      );

    const users = [];

    snap.forEach(
      item => {

        const data =

        if (
          data.uid &&
          data.uid !== currentUser.uid
        ) {

  /* =========================================
     RECOMMENDATIONS
  ========================================= */

  async function loadRecommendations() {

    const list =
      $("recommendList");

    list.innerHTML =
      `
      <div class="loading">
        読み込み中...
      </div>
      `;

    if (!currentUser) {
      return;
    }

    try {

      const users =
        await getAllUsers();

      const likedSnap =
        await getDocs(
          collection(
            db,
            "users",
            currentUser.uid,
            "likes"
          )
        );

      const likedIds =
        new Set();

      likedSnap.forEach(
        docSnap => {
          likedIds.add(
            docSnap.id
          );
        }
      );

      const filtered =
        users.filter(
          user =>
            !likedIds.has(
              user.uid
            )
        );

      if (!filtered.length) {

        list.innerHTML =
          `
          <div class="empty">
            今おすすめできる人はいません。<br>
            新しいユーザーを待ってみてください💕
          </div>
          `;

        return;
      }

      list.innerHTML = "";

      for (
        const user
        of filtered
      ) {

        const card =
          createUserCard(
            user
          );

        list.appendChild(
          card
        );
      }

    } catch (error) {

      console.error(error);

      list.innerHTML =
        `
        <div class="empty">
          読み込みに失敗しました。
        </div>
        `;
    }
  }


  function createUserCard(user) {

    const card =
      document.createElement(
        "div"
      );

    card.className =
      "card";

    const name =
      escapeHtml(
        user.nickname ||
        "名前未設定"
      );

    const gender =
      escapeHtml(
        user.gender ||
        ""
      );

    const location =
      escapeHtml(
        [
          user.prefecture,
          user.city
        ]
        .filter(Boolean)
        .join("")
      );

    const age =
      user.age
        ? `${user.age}歳`
        : "";

    const bio =
      escapeHtml(
        user.bio ||
        "自己紹介はまだありません。"
      );

    card.innerHTML =
      `
      <div class="profileName">
        ${name}
      </div>

      <div class="profileInfo">
        ${age}
        ${gender ? "・" + gender : ""}
        ${location ? "・" + location : ""}
      </div>

      <div class="bio">
        ${bio}
      </div>

      <div class="cardActions">

        <button
          class="btn btnPrimary"
          style="margin:0"
          data-like="${user.uid}"
        >
          💕 いいね
        </button>

      </div>
      `;

    card
      .querySelector(
        "[data-like]"
      )
      .addEventListener(
        "click",
        () =>
          likeUser(
            user.uid
          )
      );

    return card;
  }


  /* =========================================
     LIKE
  ========================================= */

  async function likeUser(
    targetUid
  ) {

    if (!currentUser) {
      return;
    }

    try {

      const likeRef =
        doc(
          db,
          "users",
          currentUser.uid,
          "likes",
          targetUid
        );

      await setDoc(
        likeRef,
        {
          createdAt:
            serverTimestamp()
        }
      );

      const reverseRef =
        doc(
          db,
          "users",
          targetUid,
          "likes",
          currentUser.uid
        );

      const reverseSnap =
        await getDoc(
          reverseRef
        );

      if (reverseSnap.exists()) {

        await createMatch(
          currentUser.uid,
          targetUid
        );

        alert(
          "マッチしました！💕"
        );

      } else {

        alert(
          "いいねを送りました💕"
        );
      }

      loadRecommendations();

      loadMatches();

    } catch (error) {

      console.error(error);

      alert(
        "いいねに失敗しました。\n" +
        error.message
      );
    }
  }


  /* =========================================
     MATCH ID
  ========================================= */

  function makeMatchId(
    uid1,
    uid2
  ) {

    return [
      uid1,
      uid2
    ].sort().join("_");
  }


  /* =========================================
     CREATE MATCH
  ========================================= */

  async function createMatch(
    uid1,
    uid2
  ) {

    const matchId =
      makeMatchId(
        uid1,
        uid2
      );

    const ref =
      doc(
        db,
        "matches",
        matchId
      );

    const snap =
      await getDoc(ref);

    if (!snap.exists()) {

      await setDoc(
        ref,
        {

          users: [
            uid1,
            uid2
          ],

          createdAt:
            serverTimestamp(),

          lastMessage:
            "",

          lastMessageAt:
            serverTimestamp()

        }
      );
    }

    return matchId;
  }


  /* =========================================
     LOAD MATCHES
  ========================================= */

  async function loadMatches() {

    if (!currentUser) {
      return;
    }

    const list =
      $("matchList");

    list.innerHTML =
      `
      <div class="loading">
        読み込み中...
      </div>
      `;

    try {

      const snap =
        await getDocs(
          collection(
            db,
            "matches"
          )
        );

      const matches = [];

      snap.forEach(
        item => {

          const data =
            item.data();

          if (
            Array.isArray(
              data.users
            ) &&
            data.users.includes(
              currentUser.uid
            )
          ) {

            matches.push({
              id: item.id,
              ...data
            });
          }
        }
      );

      if (!matches.length) {

        list.innerHTML =
          `
          <div class="empty">
            まだマッチしていません💕<br>
            おすすめから「いいね」を送ってみよう！
          </div>
          `;

        $("matchNavBadge").style.display =
          "none";

        return;
      }

      list.innerHTML = "";

      let unreadTotal = 0;

      for (
        const match
        of matches
      ) {

        const partnerUid =
          match.users.find(
            uid =>
              uid !== currentUser.uid
          );

        const partner =
          await getUserProfile(
            partnerUid
          );

        const unread =
          await getUnreadCount(
            match.id
          );

        unreadTotal +=
          unread;

        const item =
          document.createElement(
            "div"
          );

        item.className =
          "matchItem";

        const name =
          escapeHtml(
            partner?.nickname ||
            "ユーザー"
          );

        const location =
          escapeHtml(
            [
              partner?.prefecture,
              partner?.city
            ]
            .filter(Boolean)
            .join("")
          );

        item.innerHTML =
          `
          <div class="matchInfo">

            <div class="matchNameRow">

              <span class="matchName">
                ${name}
              </span>

              ${
                unread > 0
                ? `
                  <span class="unreadBadge">
                    ${unread}
                  </span>
                `
                : ""
              }

            </div>

            <div class="matchMeta">
              ${location || "プロフィール未設定"}
            </div>

          </div>

          <button
            class="smallBtn btnPrimary"
          >
            💬 チャット
          </button>
          `;

        item
          .querySelector("button")
          .addEventListener(
            "click",
            () =>
              openChat(
                match.id,
                partnerUid,
                partner
              )
          );

        list.appendChild(
          item
        );
      }

      updateChatBadge(
        unreadTotal
      );

    } catch (error) {

      console.error(error);

      list.innerHTML =
        `
        <div class="empty">
          マッチの読み込みに失敗しました。<br>
          ${escapeHtml(error.message)}
        </div>
        `;
    }
  }


  /* =========================================
     GET USER
  ========================================= */

  async function getUserProfile(
    uid
  ) {

    if (!uid) {
      return null;
    }

    if (
      profilesCache[uid]
    ) {
      return profilesCache[uid];
    }

    const snap =
      await getDoc(
        doc(
          db,
          "users",
          uid
        )
      );

    if (!snap.exists()) {
      return null;
    }

    const data =
      snap.data();

    profilesCache[uid] =
      data;

    return data;
  }


  /* =========================================
     UNREAD COUNT
  ========================================= */

  async function getUnreadCount(
    matchId
  ) {

    if (!currentUser) {
      return 0;
    }

    try {

      const messages =
        await getDocs(
          collection(
            db,
            "matches",
            matchId,
            "messages"
          )
        );

      let count = 0;

      messages.forEach(
        item => {

          const data =
            item.data();

          if (
            data.senderId !==
              currentUser.uid &&
            data.read !== true
          ) {

            count++;
          }
        }
      );

      return count;

    } catch (error) {

      console.error(
        "未読数取得エラー",
        error
      );

      return 0;
    }
  }


  function updateChatBadge(
    count
  ) {

    const badge =
      $("chatNavBadge");

    if (count > 0) {

      badge.textContent =
        count > 99
          ? "99+"
          : count;

      badge.style.display =
        "flex";

    } else {

      badge.style.display =
        "none";
    }
  }


  /* =========================================
     OPEN CHAT
  ========================================= */

  async function openChat(
    matchId,
    partnerUid,
    partner
  ) {

    currentMatchId =
      matchId;

    currentChatPartner =
      partner;

    $("chatPartnerName")
      .textContent =
        partner?.nickname ||
        "チャット";

    showScreen(
      "chatScreen"
    );

    await markMessagesRead(
      matchId
    );

    loadChatMessages(
      matchId
    );

    setTimeout(
      () => {
        $("messageInput").focus();
      },
      100
    );
  }


  /* =========================================
     LOAD CHAT
  ========================================= */

  function loadChatMessages(
    matchId
  ) {

    if (unsubscribeMessages) {

      unsubscribeMessages();

      unsubscribeMessages =
        null;
    }

    const list =
      $("chatMessages");

    list.innerHTML =
      `
      <div class="loading">
        読み込み中...
      </div>
      `;

    const q =
      query(
        collection(
          db,
          "matches",
          matchId,
          "messages"
        ),
        orderBy(
          "createdAt",
          "asc"
        )
      );

    unsubscribeMessages =
      onSnapshot(
        q,
        snapshot => {

          list.innerHTML = "";

          if (
            snapshot.empty
          ) {

            list.innerHTML =
              `
              <div class="empty">
                まだメッセージはありません💕<br>
                最初のメッセージを送ってみよう！
              </div>
              `;

            return;
          }

          snapshot.forEach(
            messageSnap => {

              const data =
                messageSnap.data();

              const mine =
                data.senderId ===
                currentUser.uid;

              const row =
                document.createElement(
                  "div"
                );

              row.className =
                "messageRow " +
                (
                  mine
                    ? "mine"
                    : "other"
                );

              const bubble =
                document.createElement(
                  "div"
                );

              bubble.className =
                "messageBubble";

              const text =
                document.createElement(
                  "div"
                );

              text.className =
                "messageText";

              text.textContent =
                data.text || "";

              bubble.appendChild(
                text
              );

              const time =
                document.createElement(
                  "div"
                );

              time.className =
                "messageTime";

              time.textContent =
                formatTime(
                  data.createdAt
                );

              bubble.appendChild(
                time
              );


              if (mine) {

                const deleteBtn =
                  document.createElement(
                    "button"
                  );

                deleteBtn.className =
                  "deleteMessage";

                deleteBtn.textContent =
                  "削除";

                deleteBtn.addEventListener(
                  "click",
                  () =>
                    deleteMessage(
                      matchId,
                      messageSnap.id
                    )
                );

                bubble.appendChild(
                  deleteBtn
                );
              }


              row.appendChild(
                bubble
              );

              list.appendChild(
                row
              );
            }
          );

          list.scrollTop =
            list.scrollHeight;
        },
        error => {

          console.error(
            error
          );

          list.innerHTML =
            `
            <div class="empty">
              チャットを読み込めませんでした。
            </div>
            `;
        }
      );
  }


  /* =========================================
     SEND MESSAGE
  ========================================= */

  $("sendMessageBtn").addEventListener(
    "click",
    sendMessage
  );


  $("messageInput").addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();
      }
    }
  );


  async function sendMessage() {

    if (
      !currentUser ||
      !currentMatchId
    ) {
      return;
    }

    const input =
      $("messageInput");

    const text =
      input.value.trim();

    if (!text) {
      return;
    }

    if (text.length > 1000) {

      alert(
        "メッセージは1000文字以内です。"
      );

      return;
    }

    const sendBtn =
      $("sendMessageBtn");

    sendBtn.disabled =
      true;

    try {

      await addDoc(
        collection(
          db,
          "matches",
          currentMatchId,
          "messages"
        ),
        {

          senderId:
            currentUser.uid,

          text,

          read: false,

          createdAt:
            serverTimestamp()

        }
      );


      await updateDoc(
        doc(
          db,
          "matches",
          currentMatchId
        ),
        {

          lastMessage:
            text,

          lastMessageAt:
            serverTimestamp(),

          lastSenderId:
            currentUser.uid

        }
      );


      input.value = "";

    } catch (error) {

      console.error(error);

      alert(
        "メッセージ送信に失敗しました。\n" +
        error.message
      );

    } finally {

      sendBtn.disabled =
        false;
    }
  }


  /* =========================================
     DELETE MESSAGE
  ========================================= */

  async function deleteMessage(
    matchId,
    messageId
  ) {

    if (
      !confirm(
        "このメッセージを削除しますか？"
      )
    ) {
      return;
    }

    try {

      await deleteDoc(
        doc(
          db,
          "matches",
          matchId,
          "messages",
          messageId
        )
      );

    } catch (error) {

      console.error(error);

      alert(
        "メッセージを削除できませんでした。\n" +
        error.message
      );
    }
  }


  /* =========================================
     MARK READ
  ========================================= */

  async function markMessagesRead(
    matchId
  ) {

    if (!currentUser) {
      return;
    }

    try {

      const snap =
        await getDocs(
          collection(
            db,
            "matches",
            matchId,
            "messages"
          )
        );

      const tasks = [];

      snap.forEach(
        item => {

          const data =
            item.data();

          if (
            data.senderId !==
              currentUser.uid &&
            data.read !== true
          ) {

            tasks.push(
              updateDoc(
                item.ref,
                {
                  read: true
                }
              )
            );
          }
        }
      );

      await Promise.all(
        tasks
      );

      loadMatches();

    } catch (error) {

      console.error(
        "既読更新エラー",
        error
      );
    }
  }

          unsubscribeMessages();

        showScreen(

        );

        loadMatches();

    );

     POSTS

        ),

        )
      );

          ) {

              `
              <div class="empty">

                最初の投稿をしてみよう！
              </div>
              `;

            return;
          }

          snapshot.forEach(
            postSnap => {

              const data =
                postSnap.data();

              const post =
                document.createElement(
                  "div"
                );

              post.className =
                "post";

              const name =
                escapeHtml(
                  data.nickname ||
                  "ユーザー"
                );

              const text =
                escapeHtml(
                  data.text ||
                  ""
                );

              post.innerHTML =
                `
                <div class="postTop">

                  <div class="postName">
                    ${name}
                  </div>

                  <div class="postTime">
                    ${formatTime(
                      data.createdAt
                    )}
                  </div>

                </div>

                <div class="postText">
                  ${text}
                </div>
                `;


              if (
                data.uid ===
                currentUser.uid
              ) {

                const deleteBtn =
                  document.createElement(
                    "button"
                  );

                deleteBtn.className =
                  "deletePost";

                deleteBtn.textContent =
                  "投稿を削除";

                deleteBtn.addEventListener(
                  "click",
                  () =>
                    deletePost(
                      postSnap.id
                    )
                );

                post.appendChild(
                  deleteBtn
                );
              }

              list.appendChild(
                post
              );
            }
          );
        },
        error => {

          console.error(
            error
          );

          list.innerHTML =
            `
            <div class="empty">
              投稿を読み込めませんでした。
            </div>
            `;
        }
      );
  }


  /* =========================================
     CREATE POST
  ========================================= */

  $("postBtn").addEventListener(
    "click",
    async () => {

      if (!currentUser) {
        return;
      }

      const input =
        $("postInput");

      const text =
        input.value.trim();

      if (!text) {

        alert(
          "投稿内容を入力してください。"
        );

        return;
      }

      if (text.length > 500) {

        alert(
          "投稿は500文字以内です。"
        );

        return;
      }

      try {

        await addDoc(
          collection(
            db,
            "posts"
          ),
          {

            uid:
              currentUser.uid,

            nickname:
              currentProfile?.nickname ||
              "ユーザー",

            text,

            createdAt:
              serverTimestamp()

          }
        );

        input.value = "";

      } catch (error) {

        console.error(error);

        alert(
          "投稿できませんでした。\n" +
          error.message
        );
      }
    }
  );


  /* =========================================
     DELETE POST
  ========================================= */

  async function deletePost(
    postId
  ) {

    if (
      !confirm(
        "この投稿を削除しますか？"
      )
    ) {
      return;
    }

    try {

      await deleteDoc(
        doc(
          db,
          "posts",
          postId
        )
      );

    } catch (error) {

      console.error(error);

      alert(
        "投稿を削除できませんでした。\n" +
        error.message
      );
    }
  }


  /* =========================================
     NAVIGATION
  ========================================= */

  document
    .querySelectorAll(
      ".navBtn"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            const screen =
              button.dataset.screen;

            showScreen(
              screen
            );

            if (
              screen ===
              "recommendScreen"
            ) {

              loadRecommendations();
            }

            if (
              screen ===
              "matchScreen"
            ) {

              loadMatches();
            }

            if (
              screen ===
              "talkScreen"
            ) {

              loadPosts();
            }
          }
        );
      }
    );


  function showScreen(
    screenId
  ) {

    document
      .querySelectorAll(
        ".screen"
      )
      .forEach(
        screen => {

          screen.classList.remove(
            "active"
          );
        }
      );

    const target =
      $(screenId);

    if (target) {

      target.classList.add(
        "active"
      );
    }


    document
      .querySelectorAll(
        ".navBtn"
      )
      .forEach(
        button => {

          button.classList.toggle(
            "active",
            button.dataset.screen ===
              screenId
          );
        }
      );


    if (
      screenId ===
      "chatScreen"
    ) {

      document
        .querySelectorAll(
          ".navBtn"
        )
        .forEach(
          button => {

            button.classList.remove(
              "active"
            );
          }
        );
    }
  }


  /* =========================================
     LOGOUT
  ========================================= */

  $("logoutBtn").addEventListener(
    "click",
    async () => {

      if (
        !confirm(
          "ログアウトしますか？"
        )
      ) {
        return;
      }

      try {

        await signOut(
          auth
        );

      } catch (error) {

        console.error(error);

        alert(
          "ログアウトできませんでした。"
        );
      }
    }
  );


  /* =========================================
     TIME
  ========================================= */

  function formatTime(
    timestamp
  ) {

    if (
      !timestamp ||
      typeof timestamp.toDate !==
        "function"
    ) {
      return "";
    }

    const date =
      timestamp.toDate();

    return date.toLocaleString(
      "ja-JP",
      {
        month: "numeric",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      }
    );
  }


  /* =========================================
     ESCAPE HTML
  ========================================= */

  function escapeHtml(
    value
  ) {

    return String(
      value ?? ""
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );
  }


  /* =========================================
     PAGE START
  ========================================= */

  console.log(
    "ゼロ円マッチ 起動完了"
  );

  console.log(
    "Firebase Storageは使用していません。"
  );

</script>

</body>
</html>
