<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>まこマッチ 💕</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        sans-serif;
      background: #f7f3f8;
      color: #333;
    }

    .app {
      max-width: 480px;
      margin: auto;
      min-height: 100vh;
      background: white;
    }

    header {
      padding: 22px 18px;
      background: linear-gradient(
        135deg,
        #ff7aa8,
        #9b8cff
      );
      color: white;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    h2 {
      margin-top: 8px;
    }

    .sub {
      opacity: .9;
      margin-top: 5px;
    }

    main {
      padding: 16px;
    }

    .card {
      border: 1px solid #eee;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 5px 18px #0000000d;
    }

    .form-title {
      font-weight: bold;
      margin-top: 14px;
      margin-bottom: 5px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 12px;
      margin: 6px 0 10px;
      font: inherit;
      background: white;
    }

    textarea {
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
    }

    button:disabled {
      opacity: .5;
    }

    .like {
      background: #ff5c91;
      color: white;
    }

    .google {
      background: #4285f4;
      color: white;
    }

    .logout {
      background: #eee;
      color: #555;
    }

    .block {
      background: #eee;
      color: #555;
      margin-left: 6px;
    }

    .profile {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .avatar {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #eee;
      font-size: 30px;
      flex-shrink: 0;
    }

    .name {
      font-weight: 700;
    }

    .age {
      color: #777;
    }

    .tag {
      display: inline-block;
      background: #f2eaff;
      padding: 5px 9px;
      border-radius: 20px;
      margin: 4px 3px 0 0;
      font-size: 12px;
    }

    .small {
      font-size: 12px;
      color: #888;
    }

    .saved-location {
      margin-top: 10px;
      padding: 10px;
      background: #f7f3ff;
      border-radius: 12px;
      font-size: 13px;
    }

    .post {
      background: #fff4f7;
    }

    .chat {
      background: #faf8ff;
    }

    .chat-box {
      max-height: 350px;
      overflow-y: auto;
      margin-bottom: 10px;
    }

    .message {
      padding: 10px 12px;
      border-radius: 15px;
      margin: 6px 0;
      max-width: 85%;
      background: #eee;
    }

    .message.mine {
      margin-left: auto;
      background: #ffd5e3;
    }

    .match-button {
      width: 100%;
      margin-top: 6px;
      text-align: left;
      background: #f3edff;
    }

    .loading {
      color: #888;
      text-align: center;
      padding: 10px;
    }

    .error {
      color: #e44;
      background: #fff0f0;
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
    }

    .success {
      color: #16834b;
      background: #effcf5;
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      margin-top: 8px;
    }

    .hidden {
      display: none !important;
    }

    .user-email {
      word-break: break-all;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>まこマッチ 💕</h1>
    <div class="sub">
      18歳以上限定・安心して話せる場所
    </div>
  </header>

  <main>

    <!-- =========================
         ログイン
    ========================== -->

    <div
      id="authCard"
      class="card"
    >

      <h2>🔐 ログイン</h2>

      <div class="form-title">
        メールアドレス
      </div>

      <input
        id="email"
        type="email"
        placeholder="メールアドレス"
      >

      <div class="form-title">
        パスワード
      </div>

      <input
        id="password"
        type="password"
        placeholder="パスワード"
      >

      <button
        class="like"
        onclick="signUp()"
      >
        新規登録
      </button>

      <button
        class="google"
        onclick="login()"
      >
        ログイン
      </button>

      <div
        id="authMessage"
        class="small"
        style="margin-top:10px;"
      ></div>

    </div>


    <!-- =========================
         ログイン後
    ========================== -->

    <div
      id="userCard"
      class="card hidden"
    >

      <h2>👋 ログイン中</h2>

      <div
        id="userEmail"
        class="user-email small"
      ></div>

      <br>

      <button
        class="logout"
        onclick="logout()"
      >
        ログアウト
      </button>

    </div>


    <!-- =========================
         プロフィール
    ========================== -->

    <div
      id="profileCard"
      class="card hidden"
    >

      <h2>プロフィール</h2>

      <div class="form-title">
        ニックネーム
      </div>

      <input
        id="myName"
        placeholder="ニックネーム"
      >

      <div class="form-title">
        年齢
      </div>

      <input
        id="myAge"
        type="number"
        min="18"
        placeholder="18歳以上"
      >

      <div class="form-title">
        性別
      </div>

      <select id="myGender">

        <option value="">
          選択してください
        </option>

        <option value="男性">
          男性
        </option>

        <option value="女性">
          女性
        </option>

        <option value="その他">
          その他
        </option>

        <option value="回答しない">
          回答しない
        </option>

      </select>


      <div class="form-title">
        都道府県
      </div>

      <select id="prefecture">
        <option value="">
          読み込み中...
        </option>
      </select>


      <div class="form-title">
        市区町村
      </div>

      <select
        id="municipality"
        disabled
      >
        <option value="">
          先に都道府県を選択してください
        </option>
      </select>


      <div class="form-title">
        自己紹介
      </div>

      <textarea
        id="myBio"
        rows="3"
        placeholder="自己紹介"
      ></textarea>


      <button
        class="like"
        onclick="saveProfile()"
      >
        プロフィールを保存
      </button>

      <div
        id="saved"
        class="small"
      ></div>

      <div
        id="savedLocation"
        class="saved-location"
        style="display:none;"
      ></div>

    </div>


    <!-- =========================
         おすすめ
    ========================== -->

    <div
      id="recommendCard"
      class="hidden"
    >

      <h2>
        💕 おすすめの人
      </h2>

      <div id="profiles">
        <div class="loading">
          読み込み中...
        </div>
      </div>

    </div>


    <!-- =========================
         マッチ
    ========================== -->

    <div
      id="matchCard"
      class="card hidden"
    >

      <h2>
        💕 マッチした人
      </h2>

      <div id="matches">
        まだマッチしていません。
      </div>

    </div>


    <!-- =========================
         チャット
    ========================== -->

    <div
      id="chatCard"
      class="card chat hidden"
    >

      <h2>
        💬 2人だけのチャット
      </h2>

      <div
        id="chatWith"
        class="small"
      ></div>

      <div
        id="chatMessages"
        class="chat-box"
      ></div>

      <textarea
        id="chatText"
        rows="2"
        placeholder="メッセージを入力"
      ></textarea>

      <button
        class="like"
        onclick="sendMessage()"
      >
        送信 💕
      </button>

    </div>


    <!-- =========================
         雑談
    ========================== -->

    <div
      id="postCard"
      class="card post hidden"
    >

      <h2>
        雑談コーナー 💬
      </h2>

      <input
        id="postName"
        placeholder="名前"
      >

      <textarea
        id="postText"
        rows="3"
        placeholder="気軽にひとこと投稿しよう"
      ></textarea>

      <button
        class="like"
        onclick="addPost()"
      >
        投稿する
      </button>

      <div id="posts"></div>

    </div>

  </main>

</div>


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore-compat.js"></script>


<script>

  /* =========================================
     Firebase設定
  ========================================== */

  const firebaseConfig = {

    apiKey:
      "AIzaSyBVtlfUgyyt6eic_chW_ADyz3SCBtCz9GA",

    authDomain:
      "makomatch-7a96b.firebaseapp.com",

    projectId:
      "makomatch-7a96b",

    storageBucket:
      "makomatch-7a96b.firebasestorage.app",

    messagingSenderId:
      "371872457458",

    appId:
      "1:371872457458:web:6c9391508fbba63df2a66b",

    measurementId:
      "G-Y39HTKE7ZZ"

  };


  firebase.initializeApp(firebaseConfig);


  const auth =
    firebase.auth();

  const db =
    firebase.firestore();


  /* =========================================
     地域データ
  ========================================== */

  const PREF_URL =
    "https://code4fukui.github.io/localgovjp/prefjp.json";

  const CITY_URL =
    "https://code4fukui.github.io/localgovjp/localgovjp.json";


  const prefecture =
    document.getElementById("prefecture");

  const municipality =
    document.getElementById("municipality");

  const myName =
    document.getElementById("myName");

  const myAge =
    document.getElementById("myAge");

  const myGender =
    document.getElementById("myGender");

  const myBio =
    document.getElementById("myBio");

  const saved =
    document.getElementById("saved");

  const savedLocation =
    document.getElementById("savedLocation");


  let municipalities = [];


  /* =========================================
     認証
  ========================================== */

  async function signUp() {

    const email =
      document.getElementById("email")
        .value
        .trim();

    const password =
      document.getElementById("password")
        .value;


    if (!email || !password) {

      alert(
        "メールアドレスとパスワードを入力してください。"
      );

      return;

    }


    if (password.length < 6) {

      alert(
        "パスワードは6文字以上にしてください。"
      );

      return;

    }


    try {

      await auth.createUserWithEmailAndPassword(
        email,
        password
      );

      document.getElementById(
        "authMessage"
      ).textContent =
        "登録しました！プロフィールを作成してください💕";


    } catch (error) {

      console.error(error);

      alert(
        firebaseError(error)
      );

    }

  }



  async function login() {

    const email =
      document.getElementById("email")
        .value
        .trim();

    const password =
      document.getElementById("password")
        .value;


    if (!email || !password) {

      alert(
        "メールアドレスとパスワードを入力してください。"
      );

      return;

    }


    try {

      await auth.signInWithEmailAndPassword(
        email,
        password
      );

    } catch (error) {

      console.error(error);

      alert(
        firebaseError(error)
      );

    }

  }



  async function logout() {

    await auth.signOut();

  }



  function firebaseError(error) {

    const code =
      error.code || "";


    if (
      code.includes(
        "email-already-in-use"
      )
    ) {

      return "このメールアドレスはすでに登録されています。";

    }


    if (
      code.includes(
        "invalid-email"
      )
    ) {

      return "メールアドレスが正しくありません。";

    }


    if (
      code.includes(
        "weak-password"
      )
    ) {

      return "パスワードは6文字以上にしてください。";

    }


    if (
      code.includes(
        "invalid-credential"
      )
    ) {

      return "メールアドレスまたはパスワードが違います。";

    }


    return (
      "エラーが発生しました: " +
      error.message
    );

  }



  /* =========================================
     ログイン状態監視
  ========================================== */

  auth.onAuthStateChanged(
    async function(user) {

      if (user) {

        document
          .getElementById("authCard")
          .classList
          .add("hidden");


        document
          .getElementById("userCard")
          .classList
          .remove("hidden");


        document
          .getElementById("profileCard")
          .classList
          .remove("hidden");


        document
          .getElementById("recommendCard")
          .classList
          .remove("hidden");


        document
          .getElementById("matchCard")
          .classList
          .remove("hidden");


        document
          .getElementById("postCard")
          .classList
          .remove("hidden");


        document
          .getElementById("userEmail")
          .textContent =
          user.email || "";


        await loadMyProfile();

        await renderProfiles();

        await renderMatches();

        await renderPosts();

      } else {

        document
          .getElementById("authCard")
          .classList
          .remove("hidden");


        document
          .getElementById("userCard")
          .classList
          .add("hidden");


        document
          .getElementById("profileCard")
          .classList
          .add("hidden");


        document
          .getElementById("recommendCard")
          .classList
          .add("hidden");


        document
          .getElementById("matchCard")
          .classList
          .add("hidden");


        document
          .getElementById("chatCard")
          .classList
          .add("hidden");


        document
          .getElementById("postCard")
          .classList
          .add("hidden");

      }

    }
  );


  /* =========================================
     都道府県
  ========================================== */

  async function loadPrefectures() {

    try {

      const response =
        await fetch(PREF_URL);


      if (!response.ok) {

        throw new Error(
          "都道府県データ取得失敗"
        );

      }


      const prefectures =
        await response.json();


      prefecture.innerHTML =
        '<option value="">選択してください</option>';


      prefectures.forEach(
        pref => {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            pref.pid;

          option.textContent =
            pref.pref;

          prefecture.appendChild(
            option
          );

        }
      );


    } catch (error) {

      console.error(error);

      prefecture.innerHTML =
        '<option value="">読み込み失敗</option>';

    }

  }



  /* =========================================
     市区町村
  ========================================== */

  async function loadMunicipalities() {

    try {

      const response =
        await fetch(CITY_URL);


      if (!response.ok) {

        throw new Error(
          "市区町村データ取得失敗"
        );

      }


      municipalities =
        await response.json();


    } catch (error) {

      console.error(error);

      municipality.innerHTML =
        '<option value="">読み込み失敗</option>';

    }

  }



  prefecture.addEventListener(
    "change",
    function() {

      const selectedPid =
        this.value;


      municipality.innerHTML =
        '<option value="">市区町村を選択してください</option>';


      municipality.disabled =
        true;


      if (!selectedPid) {

        return;

      }


      const cities =
        municipalities.filter(
          city =>
            String(city.pid) ===
            String(selectedPid)
        );


      cities.forEach(
        city => {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            city.city;

          option.textContent =
            city.city;

          municipality.appendChild(
            option
          );

        }
      );


      municipality.disabled =
        false;

    }
  );


  /* =========================================
     プロフィール保存
  ========================================== */

  async function saveProfile() {

    const user =
      auth.currentUser;


    if (!user) {

      alert(
        "先にログインしてください。"
      );

      return;

    }


    const name =
      myName.value.trim();

    const age =
      Number(myAge.value);

    const gender =
      myGender.value;

    const pref =
      prefecture.options[
        prefecture.selectedIndex
      ]?.textContent || "";

    const city =
      municipality.value;

    const bio =
      myBio.value.trim();


    if (!name) {

      alert(
        "ニックネームを入力してください。"
      );

      return;

    }


    if (!age || age < 18) {

      alert(
        "18歳以上のみ登録できます。"
      );

      return;

    }


    if (!gender) {

      alert(
        "性別を選択してください。"
      );

      return;

    }


    if (!prefecture.value) {

      alert(
        "都道府県を選択してください。"
      );

      return;

    }


    if (!city) {

      alert(
        "市区町村を選択してください。"
      );

      return;

    }


    try {

      await db
        .collection("profiles")
        .doc(user.uid)
        .set({

          uid: user.uid,

          name: name,

          age: age,

          gender: gender,

          prefecture: pref,

          municipality: city,

          bio: bio,

          createdAt:
            firebase.firestore.FieldValue.serverTimestamp(),

          updatedAt:
            firebase.firestore.FieldValue.serverTimestamp()

        }, {
          merge: true
        });


      saved.textContent =
        "プロフィールを保存しました！💕";


      savedLocation.style.display =
        "block";


      savedLocation.innerHTML =
        "📍 " +
        escapeHtml(pref) +
        " " +
        escapeHtml(city);


      await renderProfiles();

    } catch (error) {

      console.error(error);

      alert(
        "プロフィール保存に失敗しました。\n" +
        error.message
      );

    }

  }



  /* =========================================
     自分のプロフィール読み込み
  ========================================== */

  async function loadMyProfile() {

    const user =
      auth.currentUser;


    if (!user) {

      return;

    }


    try {

      const snap =
        await db
          .collection("profiles")
          .doc(user.uid)
          .get();


      if (!snap.exists) {

        return;

      }


      const profile =
        snap.data();


      myName.value =
        profile.name || "";

      myAge.value =
        profile.age || "";

      myGender.value =
        profile.gender || "";

      myBio.value =
        profile.bio || "";


      if (profile.prefecture) {

        const options =
          Array.from(
            prefecture.options
          );


        const option =
          options.find(
            o =>
              o.textContent ===
              profile.prefecture
          );


        if (option) {

          prefecture.value =
            option.value;


          prefecture.dispatchEvent(
            new Event("change")
          );


          setTimeout(
            function() {

              municipality.value =
                profile.municipality || "";

            },
            300
          );

        }

      }


      if (
        profile.prefecture &&
        profile.municipality
      ) {

        savedLocation.style.display =
          "block";


        savedLocation.innerHTML =
          "📍 " +
          escapeHtml(
            profile.prefecture
          ) +
          " " +
          escapeHtml(
            profile.municipality
          );

      }

    } catch (error) {

      console.error(error);

    }

  }



  /* =========================================
     ユーザー表示
  ========================================== */

  async function renderProfiles() {

    const user =
      auth.currentUser;


    if (!user) {

      return;

    }


    const box =
      document.getElementById(
        "profiles"
      );


    try {

      const snap =
        await db
          .collection("profiles")
          .limit(50)
          .get();


      let people =
        [];


      snap.forEach(
        doc => {

          if (doc.id !== user.uid) {

            people.push({
              id: doc.id,
              ...doc.data()
            });

          }

        }
      );


      if (people.length === 0) {

        box.innerHTML =
          '<div class="card">' +
          'まだ他のユーザーがいません。' +
          '</div>';

        return;

      }


      const myProfile =
        await getMyProfile();


      if (myProfile) {

        people.sort(
          (a, b) => {

            const aSame =
              a.prefecture ===
              myProfile.prefecture;

            const bSame =
              b.prefecture ===
              myProfile.prefecture;


            return (
              Number(bSame) -
              Number(aSame)
            );

          }
        );

      }


      box.innerHTML =
        people.map(
          p => `

            <div class="card">

              <div class="profile">

                <div class="avatar">
                  ${avatarFor(p.gender)}
                </div>

                <div>

                  <div class="name">
                    ${escapeHtml(p.name || "匿名")}

                    <span class="age">
                      ${p.age || ""}歳
                    </span>
                  </div>

                  <div>
                    ${escapeHtml(p.bio || "")}
                  </div>

                  <div class="small">
                    📍 ${escapeHtml(p.prefecture || "")}
                    ${escapeHtml(p.municipality || "")}
                  </div>

                </div>

              </div>

              <br>

              <button
                class="like"
                onclick="likeUser('${p.id}')"
              >
                ❤️ いいね
              </button>

              <button
                class="block"
                onclick="blockUser('${p.id}')"
              >
                🚫 ブロック
              </button>

            </div>

          `
        ).join("");


    } catch (error) {

      console.error(error);

      box.innerHTML =
        '<div class="error">' +
        'ユーザーの読み込みに失敗しました。' +
        '</div>';

    }

  }



  function avatarFor(gender) {

    if (gender === "女性") {

      return "🌸";

    }

    if (gender === "男性") {

      return "💙";

    }

    return "😊";

  }



  /* =========================================
     いいね
  ========================================== */

  async function likeUser(targetUid) {

    const user =
      auth.currentUser;


    if (!user) {

      return;

    }


    if (user.uid === targetUid) {

      return;

    }


    try {

      const myRef =
        db
          .collection("profiles")
          .doc(user.uid);


      const targetRef =
        db
          .collection("profiles")
          .doc(targetUid);


      await myRef.update({

        likes:
          firebase.firestore.FieldValue
            .arrayUnion(targetUid)

      });


      const targetSnap =
        await targetRef.get();


      const target =
        targetSnap.data() || {};


      const targetLikes =
        target.likes || [];


      if (
        targetLikes.includes(
          user.uid
        )
      ) {

        await createMatch(
          user.uid,
          targetUid
        );


        alert(
          "🎉 マッチしました！💕"
        );


        await renderMatches();

      } else {

        alert(
          "いいねしました！💕"
        );

      }

    } catch (error) {

      console.error(error);

      alert(
        "いいねに失敗しました。\n" +
        error.message
      );

    }

  }



  /* =========================================
     マッチ作成
  ========================================== */

  async function createMatch(
    uid1,
    uid2
  ) {

    const ids =
      [
        uid1,
        uid2
      ].sort();


    const matchId =
      ids.join("_");


    await db
      .collection("matches")
      .doc(matchId)
      .set({

        users: ids,

        createdAt:
          firebase.firestore.FieldValue
            .serverTimestamp()

      }, {
        merge: true
      });

  }



  /* =========================================
     マッチ一覧
  ========================================== */

  async function renderMatches() {

    const user =
      auth.currentUser;


    if (!user) {

      return;

    }


    const box =
      document.getElementById(
        "matches"
      );


    try {

      const snap =
        await db
          .collection("matches")
          .where(
            "users",
            "array-contains",
            user.uid
          )
          .get();


      if (snap.empty) {

        box.innerHTML =
          "まだマッチしていません。";

        return;

      }


      let html = "";


      for (
        const doc of snap.docs
      ) {

        const data =
          doc.data();


        const otherUid =
          data.users.find(
            id =>
              id !== user.uid
          );


        if (!otherUid) {

          continue;

        }


        const otherSnap =
          await db
            .collection("profiles")
            .doc(otherUid)
            .get();


        const other =
          otherSnap.data();


        if (!other) {

          continue;

        }


        html += `

          <button
            class="match-button"
            onclick="openChat(
              '${doc.id}',
              '${otherUid}',
              '${escapeJs(other.name || "相手")}'
            )"
          >
            💕 ${escapeHtml(other.name || "相手")}
            さんとチャット
          </button>

        `;

      }


      box.innerHTML =
        html ||
        "まだマッチしていません。";

    } catch (error) {

      console.error(error);

      box.innerHTML =
        '<div class="error">' +
        'マッチ一覧の読み込みに失敗しました。' +
        '</div>';

    }

  }



  /* =========================================
     チャット
  ========================================== */

  let currentMatchId =
    null;

  let currentOtherUid =
    null;

  let unsubscribeChat =
    null;


  function openChat(
    matchId,
    otherUid,
    otherName
  ) {

    currentMatchId =
      matchId;

    currentOtherUid =
      otherUid;


    document
      .getElementById("chatCard")
      .classList
      .remove("hidden");


    document
      .getElementById("chatWith")
      .textContent =
      "💕 " +
      otherName +
      " さんとのチャット";


    if (unsubscribeChat) {

      unsubscribeChat();

    }


    const messagesRef =
      db
        .collection("matches")
        .doc(matchId)
        .collection("messages")
        .orderBy(
          "createdAt",
          "asc"
        );


    unsubscribeChat =
      messagesRef.onSnapshot(
        snap => {

          const box =
            document.getElementById(
              "chatMessages"
            );


          box.innerHTML = "";


          snap.forEach(
            doc => {

              const data =
                doc.data();


              const mine =
                data.senderId ===
                auth.currentUser.uid;


              const div =
                document.createElement(
                  "div"
                );


              div.className =
                "message" +
                (
                  mine
                    ? " mine"
                    : ""
                );


              div.textContent =
                data.text || "";


              box.appendChild(
                div
              );

            }
          );


          box.scrollTop =
            box.scrollHeight;

        }
      );

  }



  async function sendMessage() {

    const user =
      auth.currentUser;


    if (
      !user ||
      !currentMatchId
    ) {

      alert(
        "チャット相手を選択してください。"
      );

      return;

    }


    const input =
      document.getElementById(
        "chatText"
      );


    const text =
      input.value.trim();


    if (!text) {

      return;

    }


    try {

      await db
        .collection("matches")
        .doc(currentMatchId)
        .collection("messages")
        .add({

          senderId:
            user.uid,

          text:
            text,

          createdAt:
            firebase.firestore.FieldValue
              .serverTimestamp()

        });


      input.value = "";


    } catch (error) {

      console.error(error);

      alert(
        "メッセージ送信に失敗しました。\n" +
        error.message
      );

    }

  }



  /* =========================================
     雑談掲示板
  ========================================== */

  async function addPost() {

    const user =
      auth.currentUser;


    if (!user) {

      return;

    }


    const nameInput =
      document
        .getElementById("postName");


    const textInput =
      document
        .getElementById("postText");


    const name =
      nameInput.value.trim() ||
      "匿名";


    const text =
      textInput.value.trim();


    if (!text) {

      alert(
        "投稿内容を入力してください。"
      );

      return;

    }


    try {

      await db
        .collection("posts")
        .add({

          uid:
            user.uid,

          name:
            name,

          text:
            text,

          createdAt:
            firebase.firestore.FieldValue
              .serverTimestamp()

        });


      textInput.value = "";


      await renderPosts();

    } catch (error) {

      console.error(error);

      alert(
        "投稿に失敗しました。\n" +
        error.message
      );

    }

  }



  async function renderPosts() {

    const box =
      document.getElementById(
        "posts"
      );


    try {

      const snap =
        await db
          .collection("posts")
          .orderBy(
            "createdAt",
            "desc"
          )
          .limit(50)
          .get();


      if (snap.empty) {

        box.innerHTML =
          '<div class="small">' +
          'まだ投稿がありません。' +
          '</div>';

        return;

      }


      box.innerHTML = "";


      snap.forEach(
        doc => {

          const p =
            doc.data();


          const card =
            document.createElement(
              "div"
            );


          card.className =
            "card";


          card.innerHTML =
            `
              <b>
                ${escapeHtml(p.name || "匿名")}
              </b>

              <div>
                ${escapeHtml(p.text || "")}
              </div>

              <div class="small">
                ${formatTime(p.createdAt)}
              </div>
            `;


          box.appendChild(
            card
          );

        }
      );

    } catch (error) {

      console.error(error);

      box.innerHTML =
        '<div class="error">' +
        '投稿の読み込みに失敗しました。' +
        '</div>';

    }

  }



  /* =========================================
     ブロック
  ========================================== */

  function blockUser(uid) {

    alert(
      "このユーザーをブロックしました。"
    );

  }



  /* =========================================
     自分のプロフィール取得
  ========================================== */

  async function getMyProfile() {

    const user =
      auth.currentUser;


    if (!user) {

      return null;

    }


    const snap =
      await db
        .collection("profiles")
        .doc(user.uid)
        .get();


    if (!snap.exists) {

      return null;

    }


    return snap.data();

  }



  /* =========================================
     時刻
  ========================================== */

  function formatTime(timestamp) {

    if (
      !timestamp ||
      !timestamp.toDate
    ) {

      return "";

    }


    return timestamp
      .toDate()
      .toLocaleString(
        "ja-JP"
      );

  }



  /* =========================================
     HTMLエスケープ
  ========================================== */

  function escapeHtml(text) {

    return String(text).replace(
      /[&<>"']/g,
      function(char) {

        return {

          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"

        }[char];

      }
    );

  }



  function escapeJs(text) {

    return String(text)
      .replace(
        /\\/g,
        "\\\\"
      )
      .replace(
        /'/g,
        "\\'"
      );

  }



  /* =========================================
     起動
  ========================================== */

  async function init() {

    await Promise.all([

      loadPrefectures(),

      loadMunicipalities()

    ]);

  }


  init();

</script>
