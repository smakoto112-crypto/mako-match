<!doctype html>
<html lang="ja">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>まこマッチ 💕</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,
  "Noto Sans JP",sans-serif;
  background:#f7f3f8;
  color:#333;
}

.app{
  max-width:480px;
  margin:auto;
  min-height:100vh;
  background:white;
}

header{
  padding:22px 18px;
  background:linear-gradient(135deg,#ff7aa8,#9b8cff);
  color:white;

h1{
  margin:0;
  font-size:28px;
}

.sub{
  opacity:.9;
  margin-top:5px;
}

main{
  padding:16px;
}

.card{
  border:1px solid #eee;

  padding:16px;

}

.form-title{

input,textarea,select{

button{

  font-size:15px;
}

.like{

}

.blue{

}

.block{

}

.logout{

.profile{

.avatar{

}

.name{

}

.age{

}

.tag{

  border-radius:20px;
  margin:4px 3px 0 0;

}

.small{
  font-size:12px;
  color:#888;
}

.saved-location{
  margin-top:10px;
  padding:10px;
  background:#f7f3ff;
  border-radius:12px;
  font-size:13px;
}

.post{
  background:#fff4f7;
}

.message{
  padding:10px;
  margin:7px 0;
  border-radius:12px;
  background:#f4f4f4;
}

.message.mine{
  background:#ffe3ed;
  text-align:right;
}

.loading{
  color:#888;
  text-align:center;
  padding:10px;
}

.error{

  background:#fff0f0;
  padding:10px;
  border-radius:10px;
  font-size:13px;
}

.success{
  color:#16834b;
  background:#effff5;
  padding:10px;

}

.hidden{

}

.chat-header{
  display:flex;

}

.chat-messages{
  max-height:350px;
  overflow-y:auto;
  padding:5px;
}

.match-card{
  border:1px solid #ffd0df;
  background:#fff7fa;
}

hr{
  border:0;
  border-top:1px solid #eee;
  margin:18px 0;
}
</style>
</head>

<body>

<!-- Firebase -->
<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  setDoc,
  getDoc,
  getDocs,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp,
  deleteDoc
} from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


/* =========================
   Firebase設定
========================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyBVtlfUgyyt6eic_chW_ADyz3SCBtCz9GA",

  authDomain:
  "makomatch-7a96b.firebaseapp.com",

  projectId:
  "makomatch-7a96b",

  storageBucket:
  "makomatch-7a96b.firebasestorage.app",

  messagingSenderId:
  "371872457458",

  appId:
  "1:371872457458:web:6c9391508fbba63df2a66b",

  measurementId:
  "G-Y39HTKE7ZZ"

};


/* =========================
   Firebase開始
========================= */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* =========================
   URL
========================= */

const PREF_URL =
"https://code4fukui.github.io/localgovjp/prefjp.json";

const CITY_URL =
"https://code4fukui.github.io/localgovjp/localgovjp.json";


/* =========================
   DOM
========================= */

const authArea =
document.getElementById("authArea");

const userArea =
document.getElementById("userArea");

const authMessage =
document.getElementById("authMessage");

const accountEmail =
document.getElementById("accountEmail");

const prefecture =
document.getElementById("prefecture");

const municipality =
document.getElementById("municipality");

const myName =
document.getElementById("myName");

const myAge =
document.getElementById("myAge");

const myGender =
document.getElementById("myGender");

const myBio =
document.getElementById("myBio");

const saved =
document.getElementById("saved");

const savedLocation =
document.getElementById("savedLocation");

let municipalities = [];

let currentUser = null;

let currentMatchId = null;

let currentChatUnsubscribe = null;


/* =========================
   HTMLエスケープ
========================= */

function escapeHtml(text){

  return String(text ?? "").replace(
    /[&<>"']/g,
    char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    })[char]
  );

}


/* =========================
   認証
========================= */

window.register = async function(){

  const email =
    document.getElementById("email")
      .value.trim();

  const password =
    document.getElementById("password")
      .value;

  if(!email || !password){

    authMessage.innerHTML =
      `<div class="error">
      メールアドレスとパスワードを入力してください。
      </div>`;

    return;
  }

  if(password.length < 6){

    authMessage.innerHTML =
      `<div class="error">
      パスワードは6文字以上にしてください。
      </div>`;

    return;
  }

  try{

    await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );

    authMessage.innerHTML =
      `<div class="success">
      登録しました！💕
      </div>`;

  }catch(error){

    authMessage.innerHTML =
      `<div class="error">
      ${escapeHtml(error.message)}
      </div>`;

  }

};


window.login = async function(){

  const email =
    document.getElementById("email")
      .value.trim();

  const password =
    document.getElementById("password")
      .value;

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(error){

    authMessage.innerHTML =
      `<div class="error">
      ログインできませんでした。
      ${escapeHtml(error.message)}
      </div>`;

  }

};


window.logout = async function(){

  await signOut(auth);

};


/* =========================
   認証状態
========================= */

onAuthStateChanged(
  auth,
  async user => {

    currentUser = user;

    if(user){

      authArea.classList.add("hidden");

      userArea.classList.remove("hidden");

      accountEmail.textContent =
        user.email || "";

      await loadProfile();

      await loadProfiles();

      await loadMatches();

      renderPosts();

    }else{

      authArea.classList.remove("hidden");

      userArea.classList.add("hidden");

    }

  }
);


/* =========================
   都道府県
========================= */

async function loadPrefectures(){

  try{

    const response =
      await fetch(PREF_URL);

    if(!response.ok)
      throw new Error();

    const data =
      await response.json();

    prefecture.innerHTML =
      `<option value="">
      選択してください
      </option>`;

    data.forEach(pref => {

      const option =
        document.createElement("option");

      option.value =
        pref.pid;

      option.textContent =
        pref.pref;

      prefecture.appendChild(option);

    });

  }catch(error){

    prefecture.innerHTML =
      `<option>
      読み込み失敗
      </option>`;

  }

}


/* =========================
   市区町村
========================= */

async function loadMunicipalities(){

  try{

    const response =
      await fetch(CITY_URL);

    if(!response.ok)
      throw new Error();

    municipalities =
      await response.json();

  }catch(error){

    municipality.innerHTML =
      `<option>
      読み込み失敗
      </option>`;

  }

}


prefecture.addEventListener(
  "change",
  function(){

    const pid =
      this.value;

    municipality.innerHTML =
      `<option value="">
      市区町村を選択してください
      </option>`;

    municipality.disabled =
      true;

    if(!pid)
      return;

    const cities =
      municipalities.filter(
        city =>
          String(city.pid) ===
          String(pid)
      );

    cities.forEach(city => {

      const option =
        document.createElement("option");

      option.value =
        city.city;

      option.textContent =
        city.city;

      municipality.appendChild(option);

    });

    municipality.disabled =
      false;

  }
);


/* =========================
   プロフィール保存
========================= */

window.saveProfile = async function(){

  if(!currentUser)
    return;

  const name =
    myName.value.trim();

  const age =
    Number(myAge.value);

  const gender =
    myGender.value;

  const pref =
    prefecture.options[
      prefecture.selectedIndex
    ]?.textContent || "";

  const city =
    municipality.value;

  const bio =
    myBio.value.trim();


  if(!name){

    alert("ニックネームを入力してください。");
    return;

  }

  if(!age || age < 18){

    alert("18歳以上のみ登録できます。");
    return;

  }

  if(!gender){

    alert("性別を選択してください。");
    return;

  }

  if(!prefecture.value){

    alert("都道府県を選択してください。");
    return;

  }

  if(!city){

    alert("市区町村を選択してください。");
    return;

  }


  try{

    await setDoc(
      doc(db,"users",currentUser.uid),
      {
        name,
        age,
        gender,
        prefecture:pref,
        municipality:city,
        bio,
        email:currentUser.email || "",
        updatedAt:serverTimestamp()
      },
      {merge:true}
    );


    saved.innerHTML =
      `<div class="success">
      プロフィールを保存しました！💕
      </div>`;


    savedLocation.classList.remove("hidden");

    savedLocation.innerHTML =
      "📍 " +
      escapeHtml(pref) +
      " " +
      escapeHtml(city);


    await loadProfiles();

  }catch(error){

    saved.innerHTML =
      `<div class="error">
      保存できませんでした。
      ${escapeHtml(error.message)}
      </div>`;

  }

};


/* =========================
   プロフィール読み込み
========================= */

async function loadProfile(){

  if(!currentUser)
    return;

  try{

    const snap =
      await getDoc(
        doc(db,"users",currentUser.uid)
      );

    if(!snap.exists())
      return;

    const profile =
      snap.data();

    myName.value =
      profile.name || "";

    myAge.value =
      profile.age || "";

    myGender.value =
      profile.gender || "";

    myBio.value =
      profile.bio || "";


    if(profile.prefecture){

      const option =
        Array.from(
          prefecture.options
        ).find(
          o =>
            o.textContent ===
            profile.prefecture
        );

      if(option){

        prefecture.value =
          option.value;

        prefecture.dispatchEvent(
          new Event("change")
        );

        setTimeout(() => {

          municipality.value =
            profile.municipality || "";

        },100);

      }

    }


    if(
      profile.prefecture &&
      profile.municipality
    ){

      savedLocation.classList.remove(
        "hidden"
      );

      savedLocation.innerHTML =
        "📍 " +
        escapeHtml(profile.prefecture) +
        " " +
        escapeHtml(profile.municipality);

    }

  }catch(error){

    console.error(error);

  }

}


/* =========================
   ユーザー一覧
========================= */

async function loadProfiles(){

  if(!currentUser)
    return;

  const box =
    document.getElementById("profiles");

  box.innerHTML =
    `<div class="loading">
    読み込み中...
    </div>`;

  try{

    const snap =
      await getDocs(
        collection(db,"users")
      );

    let html = "";

    snap.forEach(item => {

      if(item.id === currentUser.uid)
        return;

      const p =
        item.data();

      html += `

      <div class="card">

        <div class="profile">

          <div class="avatar">
            💕
          </div>

          <div>

            <div class="name">
              ${escapeHtml(p.name || "名前なし")}

              <span class="age">
                ${p.age || ""}歳
              </span>
            </div>

            <div>
              ${escapeHtml(p.gender || "")}
            </div>

          </div>

        </div>

        <div class="small">
          📍 ${escapeHtml(p.prefecture || "")}
          ${escapeHtml(p.municipality || "")}
        </div>

        <p>
          ${escapeHtml(p.bio || "")}
        </p>

        <button
          class="like"
          onclick="likeUser('${item.id}')">
          ❤️ いいね
        </button>

        <button
          class="block"
          onclick="blockUser('${item.id}')">
          🚫 ブロック
        </button>

      </div>

      `;

    });

    if(!html){

      html =
        `<div class="card">
        まだ他のユーザーがいません。
        </div>`;

    }

    box.innerHTML =
      html;

  }catch(error){

    box.innerHTML =
      `<div class="error">
      ユーザーを読み込めませんでした。
      ${escapeHtml(error.message)}
      </div>`;

  }

}


/* =========================
   いいね
========================= */

window.likeUser = async function(targetUid){

  if(!currentUser)
    return;

  if(targetUid === currentUser.uid)
    return;


  try{

    /* 自分から相手へのいいね */

    await setDoc(
      doc(
        db,
        "likes",
        currentUser.uid,
        "users",
        targetUid
      ),
      {
        from:currentUser.uid,
        to:targetUid,
        createdAt:serverTimestamp()
      }
    );


    /* 相手から自分へのいいね確認 */

    const reverse =
      await getDoc(
        doc(
          db,
          "likes",
          targetUid,
          "users",
          currentUser.uid
        )
      );


    if(reverse.exists()){

      const ids =
        [currentUser.uid,targetUid]
        .sort();

      const matchId =
        ids[0] + "_" + ids[1];


      const me =
        await getDoc(
          doc(
            db,
            "users",
            currentUser.uid
          )
        );

      const other =
        await getDoc(
          doc(
            db,
            "users",
            targetUid
          )
        );


      await setDoc(
        doc(
          db,
          "matches",
          matchId
        ),
        {
          users:ids,

          user1:ids[0],

          user2:ids[1],

          user1Name:
            ids[0] === currentUser.uid
              ? me.data()?.name || ""
              : other.data()?.name || "",

          user2Name:
            ids[1] === currentUser.uid
              ? me.data()?.name || ""
              : other.data()?.name || "",

          createdAt:
            serverTimestamp()
        },
        {merge:true}
      );


      alert(
        "💕 マッチしました！"
      );

      await loadMatches();

    }else{

      alert(
        "❤️ いいねしました！\n相手からもいいねされるとマッチします。"
      );

    }

  }catch(error){

    alert(
      "いいねに失敗しました。\n" +
      error.message
    );

  }

};


/* =========================
   マッチ一覧
========================= */

async function loadMatches(){

  if(!currentUser)
    return;

  const box =
    document.getElementById("matches");

  try{

    const snap =
      await getDocs(
        collection(db,"matches")
      );

    let html = "";

    snap.forEach(item => {

      const m =
        item.data();

      if(
        !m.users ||
        !m.users.includes(
          currentUser.uid
        )
      )
        return;


      const otherUid =
        m.users.find(
          uid =>
            uid !== currentUser.uid
        );


      const otherName =
        otherUid === m.user1
          ? m.user1Name
          : m.user2Name;


      html += `

      <div class="card match-card">

        <div class="profile">

          <div class="avatar">
            💕
          </div>

          <div>

            <div class="name">
              ${escapeHtml(otherName || "ユーザー")}
            </div>

            <div class="small">
              マッチ成立 💕
            </div>

          </div>

        </div>

        <br>

        <button
          class="like"
          onclick="openChat(
            '${item.id}',
            '${escapeJs(otherName || "ユーザー")}'
          )">
          💬 チャットする
        </button>

      </div>

      `;

    });


    if(!html){

      html =
        `<div class="card">
        まだマッチしていません。
        <br>
        <span class="small">
        気になる人に❤️いいねしてみよう！
        </span>
        </div>`;

    }

    box.innerHTML =
      html;

  }catch(error){

    box.innerHTML =
      `<div class="error">
      マッチを読み込めませんでした。
      ${escapeHtml(error.message)}
      </div>`;

  }

}


/* =========================
   チャット
========================= */

window.openChat =
async function(matchId,name){

  currentMatchId =
    matchId;

  document
    .getElementById("chatArea")
    .classList.remove("hidden");

  document
    .getElementById("chatName")
    .textContent =
      name;

  document
    .getElementById("chatMessages")
    .innerHTML =
      `<div class="loading">
      読み込み中...
      </div>`;


  if(currentChatUnsubscribe){

    currentChatUnsubscribe();

    currentChatUnsubscribe =
      null;

  }


  const messagesRef =
    collection(
      db,
      "matches",
      matchId,
      "messages"
    );


  const q =
    query(
      messagesRef,
      orderBy(
        "createdAt",
        "asc"
      )
    );


  currentChatUnsubscribe =
    onSnapshot(
      q,
      snapshot => {

        let html = "";

        snapshot.forEach(item => {

          const m =
            item.data();

          const mine =
            m.uid ===
            currentUser.uid;

          html += `

          <div class="message ${
            mine ? "mine" : ""
          }">

            <div>
              ${escapeHtml(m.text)}
            </div>

            <div class="small">
              ${mine ? "自分" : "相手"}
            </div>

          </div>

          `;

        });


        document
          .getElementById(
            "chatMessages"
          )
          .innerHTML =
            html ||
            `<div class="small">
            まだメッセージがありません。
            </div>`;


        const area =
          document.getElementById(
            "chatMessages"
          );

        area.scrollTop =
          area.scrollHeight;

      },
      error => {

        document
          .getElementById(
            "chatMessages"
          )
          .innerHTML =
            `<div class="error">
            チャットを読み込めませんでした。
            </div>`;

      }
    );

};


window.closeChat =
function(){

  if(currentChatUnsubscribe){

    currentChatUnsubscribe();

    currentChatUnsubscribe =
      null;

  }

  currentMatchId =
    null;

  document
    .getElementById("chatArea")
    .classList.add("hidden");

};


window.sendMessage =
async function(){

  if(
    !currentUser ||
    !currentMatchId
  )
    return;


  const input =
    document.getElementById(
      "chatInput"
    );

  const text =
    input.value.trim();


  if(!text)
    return;


  try{

    await addDoc(
      collection(
        db,
        "matches",
        currentMatchId,
        "messages"
      ),
      {
        uid:currentUser.uid,
        text:text,
        createdAt:
          serverTimestamp()
      }
    );


    input.value = "";

  }catch(error){

    alert(
      "送信できませんでした。\n" +
      error.message
    );

  }

};


/* =========================
   ブロック
========================= */

window.blockUser =
async function(targetUid){

  if(!currentUser)
    return;


  if(
    !confirm(
      "このユーザーをブロックしますか？"
    )
  )
    return;


  try{

    await setDoc(
      doc(
        db,
        "blocks",
        currentUser.uid,
        "users",
        targetUid
      ),
      {
        blocked:true,
        createdAt:
          serverTimestamp()
      }
    );


    alert(
      "ブロックしました。"
    );

    await loadProfiles();

  }catch(error){

    alert(
      "ブロックできませんでした。"
    );

  }

};


/* =========================
   雑談
========================= */

window.addPost =
async function(){

  if(!currentUser)
    return;


  const text =
    document
      .getElementById("postText")
      .value
      .trim();


  if(!text){

    alert(
      "投稿内容を入力してください。"
    );

    return;

  }


  const profile =
    await getDoc(
      doc(
        db,
        "users",
        currentUser.uid
      )
    );


  const name =
    profile.data()?.name ||
    "匿名";


  try{

    await addDoc(
      collection(db,"posts"),
      {
        uid:currentUser.uid,
        name:name,
        text:text,
        createdAt:
          serverTimestamp()
      }
    );


    document
      .getElementById(
        "postText"
      )
      .value = "";

    renderPosts();

  }catch(error){

    alert(
      "投稿できませんでした。\n" +
      error.message
    );

  }

};


/* =========================
   雑談表示
========================= */

function renderPosts(){

  const box =
    document.getElementById(
      "posts"
    );


  const q =
    query(
      collection(db,"posts"),
      orderBy(
        "createdAt",
        "desc"
      )
    );


  onSnapshot(
    q,
    snapshot => {

      let html = "";

      snapshot.forEach(item => {

        const p =
          item.data();

        html += `

        <div class="card">

          <b>
            ${escapeHtml(p.name || "匿名")}
          </b>

          <div>
            ${escapeHtml(p.text || "")}
          </div>

          <div class="small">
            ${p.createdAt?.toDate
              ? p.createdAt.toDate()
                .toLocaleString("ja-JP")
              : ""}
          </div>

        </div>

        `;

      });


      box.innerHTML =
        html ||
        `<div class="small">
        まだ投稿がありません。
        </div>`;

    }
  );

}


/* =========================
   JavaScript用エスケープ
========================= */

function escapeJs(text){

  return String(text)
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/"/g,"&quot;");

}


/* =========================
   起動
========================= */

async function init(){

  await Promise.all([
    loadPrefectures(),
    loadMunicipalities()
  ]);

}

init();

</script>
