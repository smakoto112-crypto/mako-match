<!doctype html>
<html lang="ja">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>まこマッチ 💕</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #fff0f6,
          #f2efff
        );

      color: #333;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: auto;
      background: white;
      box-shadow:
        0 0 30px rgba(0,0,0,.08);
    }

    header {
      padding: 22px 18px;
      color: white;

      background:
        linear-gradient(
          135deg,
          #ff6f9f,
          #9b8cff
        );

      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      font-size: 27px;
      font-weight: 800;
    }

    .sub {
      margin-top: 5px;
      font-size: 13px;
      opacity: .95;
    }

    main {
      padding: 16px;
    }

    .card {
      background: white;
      border: 1px solid #eee;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 14px;

      box-shadow:
        0 6px 20px rgba(0,0,0,.06);
    }

    h2 {
      margin-top: 0;
    }

    h3 {
      margin-bottom: 8px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px 13px;

      border:
        1px solid #ddd;

      border-radius: 12px;

      margin:
        5px 0 10px;

      background: white;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #ff72a2;

      box-shadow:
        0 0 0 3px
        rgba(255,114,162,.12);
    }

    textarea {
      resize: vertical;
    }

    button {
      border: 0;

      border-radius: 13px;

      padding:
        11px 15px;

      font-weight: 700;
    }

    .primary {
      width: 100%;
      color: white;

      background:
        linear-gradient(
          135deg,
          #ff5f96,
          #9a86ff
        );
    }

    .like {
      background: #ff5c91;
      color: white;
    }

    .block {
      background: #eee;
      color: #555;
    }

    .secondary {
      background: #f0ebff;
      color: #654bd1;
    }

    .logout {
      background: #eee;
      color: #555;
    }

    .danger {
      background: #ffe5eb;
      color: #d33;
    }

    .small {
      font-size: 12px;
      color: #888;
    }

    .message {
      padding: 10px;
      border-radius: 12px;
      margin: 7px 0;
    }

    .success {
      background: #edfff2;
      color: #248a48;
    }

    .error {
      background: #fff0f2;
      color: #c52b46;
    }

    .profile {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .avatar {
      width: 58px;
      height: 58px;
      flex-shrink: 0;

      display: grid;
      place-items: center;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #ffe0ec,
          #e5ddff
        );

      font-size: 29px;
    }

    .name {
      font-weight: 800;
    }

    .age {
      color: #777;
      font-weight: 500;
    }

    .tag {
      display: inline-block;

      background: #f1ebff;
      color: #6652c7;

      padding:
        5px 9px;

      border-radius: 20px;

      margin:
        4px 3px 0 0;

      font-size: 12px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .actions button {
      flex: 1;
    }

    .account {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .accountEmail {
      font-size: 13px;
      color: #666;
      overflow-wrap: anywhere;
    }

    .hidden {
      display: none !important;
    }

    .center {
      text-align: center;
    }

    .loading {
      padding: 15px;
      text-align: center;
      color: #888;
    }

    .location {
      margin-top: 8px;
      color: #777;
      font-size: 13px;
    }

    .post {
      background: #fff7fa;
    }

    .postItem {
      background: white;

      border:
        1px solid #eee;

      border-radius: 14px;

      padding: 12px;
      margin-top: 10px;
    }

    .postHeader {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .matchCard {
      background:
        linear-gradient(
          135deg,
          #fff0f7,
          #f3efff
        );

      border:
        1px solid #eadff5;
    }

    .chatMessages {
      height: 330px;
      overflow-y: auto;
      padding: 10px;

      background: #fafafa;

      border-radius: 15px;

      margin-bottom: 10px;
    }

    .chatRow {
      display: flex;
      margin: 7px 0;
    }

    .chatRow.mine {
      justify-content: flex-end;
    }

    .chatBubble {
      max-width: 78%;
      padding: 9px 12px;
      border-radius: 15px;
      background: #eee;
    }

    .mine .chatBubble {
      background: #ffdeea;
    }

    .chatTime {
      font-size: 10px;
      color: #999;
      margin-top: 3px;
    }

    /*
     * 削除ボタン
     */

    .deleteMessageButton {
      margin-top: 6px;

      padding:
        4px 8px;

      border-radius: 8px;

      background: #fff;

      color: #d33;

      border:
        1px solid #f0c5ce;

      font-size: 11px;

      font-weight: 700;
    }

    .deleteMessageButton:hover {
      background: #ffe9ee;
    }

    .chatInputRow {
      display: flex;
      gap: 7px;
    }

    .chatInputRow input {
      margin: 0;
    }

    .chatInputRow button {
      flex-shrink: 0;
    }

    .tabs {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      margin-bottom: 15px;
    }

    .tab {
      white-space: nowrap;
      background: #f2eefb;
      color: #6755b9;
    }

    .tab.active {
      background: #ff6f9f;
      color: white;
    }

    .checkboxRow {
      display: flex;
      align-items: flex-start;
      gap: 8px;

      font-size: 13px;

      margin:
        5px 0 12px;
    }

    .checkboxRow input {
      width: auto;
      margin-top: 3px;
    }

    .empty {
      padding: 20px;
      text-align: center;
      color: #999;
      background: #fafafa;
      border-radius: 15px;
    }

    /*
     * 未読バッジ
     */

    .unreadBadge {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-width: 28px;
      height: 28px;

      padding:
        0 8px;

      margin-left: 7px;

      border-radius: 20px;

      background: #ff4f8b;
      color: white;

      font-size: 13px;
      font-weight: 800;

      box-shadow:
        0 3px 8px
        rgba(255,79,139,.25);
    }

    .unreadText {
      margin-top: 6px;

      color: #ff4f8b;

      font-size: 12px;
      font-weight: 700;
    }

    .matchNameRow {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
    }

  </style>

</head>


<body>

<div class="app">

  <header>

    <div class="brand">
      まこマッチ 💕
    </div>

    <div class="sub">
      18歳以上限定・安心して話せる場所
    </div>

  </header>


  <main>

    <!-- ログイン -->

    <section
      id="authSection"
      class="card"
    >

      <h2>🔐 ログイン</h2>

      <input
        id="email"
        type="email"
        placeholder="メールアドレス"
        autocomplete="email"
      >

      <input
        id="password"
        type="password"
        placeholder="パスワード"
        autocomplete="current-password"
      >

      <div class="checkboxRow">

        <input
          id="ageConfirm"
          type="checkbox"
        >

        <label for="ageConfirm">
          私は18歳以上です
        </label>

      </div>

      <button
        id="loginButton"
        class="primary"
      >
        ログイン
      </button>

      <br><br>

      <button
        id="registerButton"
        class="secondary"
        style="width:100%"
      >
        新規登録
      </button>

      <div
        id="authMessage"
        class="small"
        style="margin-top:12px"
      ></div>

    </section>


    <!-- ログイン後 -->

    <section
      id="appSection"
      class="hidden"
    >

      <!-- アカウント -->

      <div class="card">

        <div class="account">

          <div>

            <div>
              🔐 ログイン中
            </div>

            <div
              id="accountEmail"
              class="accountEmail"
            ></div>

          </div>

          <button
            id="logoutButton"
            class="logout"
          >
            ログアウト
          </button>

        </div>

      </div>


      <!-- タブ -->

      <div class="tabs">

        <button
          class="tab active"
          data-tab="profileTab"
        >
          👤プロフィール
        </button>

        <button
          class="tab"
          data-tab="peopleTab"
        >
          💕おすすめ
        </button>

        <button
          class="tab"
          data-tab="matchTab"
        >
          💖マッチ
        </button>

        <button
          class="tab"
          data-tab="chatTab"
        >
          💬チャット
        </button>

        <button
          class="tab"
          data-tab="talkTab"
        >
          🗣️雑談
        </button>

      </div>


      <!-- プロフィール -->

      <section
        id="profileTab"
        class="tabContent"
      >

        <div class="card">

          <h2>
            👤 プロフィール
          </h2>

          <label>
            ニックネーム
          </label>

          <input
            id="myName"
            placeholder="ニックネーム"
            maxlength="30"
          >

          <label>
            年齢
          </label>

          <input
            id="myAge"
            type="number"
            min="18"
            max="120"
            placeholder="18歳以上"
          >

          <label>
            性別
          </label>
