<script type="module">


  /*

  }
  from

  const firebaseConfig = {

    apiKey:
      "AIzaSyBVtlfUgyyt6eic_chW_ADyz3SCBtCz9GA",

    authDomain:
      "makomatch-7a96b.firebaseapp.com",

    projectId:
      "makomatch-7a96b",

    storageBucket:
      "makomatch-7a96b.firebasestorage.app",

    messagingSenderId:
      "371872457458",

    appId:
      "1:371872457458:web:6c9391508fbba63df2a66b",

    measurementId:
      "G-Y39HTHTKE7ZZ"

  };


  const app =
    initializeApp(firebaseConfig);


  const auth =
    getAuth(app);


  const db =
    getFirestore(app);


  const storage =
    getStorage(app);


  /*
   * ==========================================
   * 市区町村

   */

  const CITY_URL =
    "https://code4fukui.github.io/localgovjp/localgovjp.json";


  const prefecture =
    document.getElementById(

  /*

   */

  let currentUser = null;

  /*

   */

  const authSection =

    );

    );

    );

    );


  const postsBox =
    document.getElementById(
      "posts"
    );


  /*
   * ==========================================
   * HTMLエスケープ
   * ==========================================
   */

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(
        /[&<>"']/g,
        function(char) {

          return {

            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"

          }[char];

        }
      );

  }


  /*
   * ==========================================
   * Firebaseエラー
   * ==========================================
   */

  function firebaseErrorMessage(error) {

    const code =
      error?.code || "";


    if (
      code ===
      "auth/email-already-in-use"
    ) {

      return "このメールアドレスはすでに登録されています。";

    }


    if (
      code ===
      "auth/invalid-email"
    ) {

      return "メールアドレスを確認してください。";

    }


    if (
      code ===
      "auth/weak-password"
    ) {

      return "パスワードは6文字以上にしてください。";

    }


    if (
      code ===
      "auth/invalid-credential" ||
      code ===
      "auth/wrong-password" ||
      code ===
      "auth/user-not-found"
    ) {

      return "メールアドレスまたはパスワードが違います。";

    }


    if (
      code ===
      "permission-denied"
    ) {

      return "Firebaseの権限設定を確認してください。";

    }


    if (
      code ===
      "storage/unauthorized"
    ) {

      return "写真保存の権限がありません。Firebase Storageのルールを確認してください。";

    }


    if (
      code ===
      "storage/canceled"
    ) {

      return "写真の送信をキャンセルしました。";

    }


    return (
      error?.message ||
      "エラーが発生しました。"
    );

  }


  /*
   * ==========================================
   * 都道府県・市区町村
   * ==========================================
   */

  async function loadMunicipalities() {

    try {

      const response =
        await fetch(CITY_URL);


      if (!response.ok) {

        throw new Error(
          "市区町村データ取得失敗"
        );

      }


      municipalities =
        await response.json();


      const prefMap =
        new Map();


      municipalities.forEach(
        city => {

          if (
            city.pid &&
            city.pref
          ) {

            prefMap.set(
              String(city.pid),
              city.pref
            );

          }

        }
      );


      prefecture.innerHTML =
        '<option value="">選択してください</option>';


      Array.from(
        prefMap.entries()
      )
        .sort(
          (a, b) =>
            Number(a[0]) -
            Number(b[0])
        )
        .forEach(
          ([pid, pref]) => {

            const option =
              document.createElement(
                "option"
              );


            option.value =
              pid;


            option.textContent =
              pref;


            prefecture.appendChild(
              option
            );

          }
        );


    } catch (error) {

      console.error(error);


      prefecture.innerHTML =
        '<option value="">読み込み失敗</option>';


      municipality.innerHTML =
        '<option value="">読み込み失敗</option>';

    }

  }


  prefecture.addEventListener(
    "change",
    function() {

      const pid =
        String(
          prefecture.value
        );


      municipality.innerHTML =
        '<option value="">選択してください</option>';


      municipality.disabled =
        true;


      if (!pid) {

        municipality.innerHTML =
          '<option value="">先に都道府県を選択してください</option>';

        return;

      }


      const cities =
        municipalities
          .filter(
            city =>
              String(city.pid) === pid
          )
          .sort(
            (a, b) =>
              String(a.city)
                .localeCompare(
                  String(b.city),
                  "ja"
                )
          );


      cities.forEach(
        city => {

          const option =
            document.createElement(
              "option"
            );


          option.value =
            city.city;


          option.textContent =
            city.city;


          municipality.appendChild(
            option
          );

        }
      );


      municipality.disabled =
        false;

    }
  );


  /*
   * ==========================================
   * 認証
   * ==========================================
   */

  document
    .getElementById("registerButton")
    .addEventListener(
      "click",
      async function() {

        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        const ageConfirm =
          document
            .getElementById("ageConfirm")
            .checked;


        if (!ageConfirm) {

          authMessage.textContent =
            "18歳以上であることを確認してください。";

          authMessage.className =
            "message error";

          return;

        }


        if (!email || !password) {

          authMessage.textContent =
            "メールアドレスとパスワードを入力してください。";

          authMessage.className =
            "message error";

          return;

        }


        try {

          authMessage.textContent =
            "登録中...";


          const result =
            await createUserWithEmailAndPassword(
              auth,
              email,
              password
            );


          await setDoc(
            doc(
              db,
              "users",
              result.user.uid
            ),
            {

              uid:
                result.user.uid,

              email:
                result.user.email,

              createdAt:
                serverTimestamp(),

              updatedAt:
                serverTimestamp()

            },
            {
              merge: true
            }
          );


          authMessage.textContent =
            "登録しました！💕";


          authMessage.className =

        await getDocs(
          collection(
            db,
            "users"

        );


      const users = [];


      snapshot.forEach(
        item => {

          const data =
            item.data();


          if (
            item.id ===
            currentUser.uid

            return;

          if (
            data.blocked === true
          ) {
            return;
          }


          users.push({
            id:
              item.id,

            ...data

          });

        }
      );


      const blockedIds =
        await getMyBlockedIds();


      const filtered =
        users.filter(
          user =>
            !blockedIds.has(
              user.id

        );


      if (!filtered.length) {

        profilesBox.innerHTML =
          '<div class="empty">まだ他のユーザーがいません。<br>新しいユーザーが登録するとここに表示されます💕</div>';

  async function getMyBlockedIds() {

    const result =
      new Set();


    if (!currentUser) {
      return result;
    }


    const snapshot =
      await getDocs(
        collection(
          db,
          "blocks"
        )
      );


    snapshot.forEach(
      item => {

        const data =
          item.data();


        if (
          data.from ===
          currentUser.uid
        ) {

          result.add(
            data.to
          );

        }

      }
    );


    return result;

  }

  function makeMatchId(

    uid2

    return [

      uid2
    ]
      .sort()
      .join("_");

  }


  /*

   * ==========================================

  async function getUnreadCount(
    matchId,
    matchData
  ) {

    if (!currentUser) {
      return 0;
    }


    try {

      const messagesSnapshot =
        await getDocs(
          collection(
            db,
            "matches",
            matchId,
            "messages"
          )
        );


      const readAt =
        matchData?.readAt?.[
          currentUser.uid
        ] || null;


      let count = 0;


      messagesSnapshot.forEach(
        item => {

          const message =
            item.data();


          if (
            message.from ===
            currentUser.uid
          ) {

            return;

          }


          const createdAt =
            message.createdAt;


          const messageTime =
            createdAt &&
            typeof createdAt.toMillis ===
              "function"
              ? createdAt.toMillis()
              : 0;


          const readTime =
            readAt &&
            typeof readAt.toMillis ===
              "function"
              ? readAt.toMillis()
              : 0;


          if (
            messageTime >
            readTime
          ) {

            count++;

          }

        }
      );


      return count;


    } catch (error) {

      console.error(
        "未読数取得エラー",
        error
      );

      return 0;

    }

  }

  async function loadMatches() {

    matchesBox.innerHTML =
      '<div class="loading">読み込み中...</div>';


    try {

      const snapshot =
        await getDocs(
          collection(
            db,
            "matches"
          )
        );


      const matches = [];


      snapshot.forEach(
        item => {

          const data =
            item.data();


          if (
            Array.isArray(
              data.users
            ) &&
            data.users.includes(
              currentUser.uid
            )
          ) {

            matches.push({
              id:
                item.id,

              ...data

            });

          }

        }
      );


      if (!matches.length) {

        matchesBox.innerHTML =
          '<div class="empty">まだマッチしていません💕<br>おすすめの人に「いいね」してみよう！</div>';

        return;

      }


      const cards = [];


      for (
        const match of matches
      ) {

        const otherUid =
          match.users.find(
            uid =>
              uid !==
              currentUser.uid
          );


        if (!otherUid) {
          continue;
        }


        const userSnap =
          await getDoc(
            doc(
              db,
              "users",
              otherUid
            )
          );


        if (!userSnap.exists()) {
          continue;
        }


        const user =
          userSnap.data();


        const unreadCount =
          await getUnreadCount(
            match.id,
            match
          );


        const unreadBadge =
          unreadCount > 0
            ? `
              <span
                class="unreadBadge"
              >
                ${unreadCount}
              </span>
            `
            : "";


        const unreadText =
          unreadCount > 0
            ? `
              <div
                class="unreadText"
              >
                💌 未読メッセージ ${unreadCount}件
              </div>
            `
            : "";


        cards.push(`

          <div class="card matchCard">

            <div class="profile">

              <div class="avatar">
                💖
              </div>

              <div>

                <div
                  class="name matchNameRow"
                >

                  ${escapeHtml(
                    user.name ||
                    "ユーザー"
                  )}

                  ${unreadBadge}

                </div>

                <div class="small">

                  ${
                    user.age
                      ? escapeHtml(
                          user.age
                        ) +
                        "歳"
                      : ""
                  }

                  ${
                    user.prefecture
                      ? " ・ " +
                        escapeHtml(
                          user.prefecture
                        )
                      : ""
                  }

                </div>

              </div>

            </div>


            ${
              user.bio
                ? `
                  <div
                    style="margin-top:10px"
                  >
                    ${escapeHtml(
                      user.bio
                    )}
                  </div>
                `
                : ""
            }


            ${unreadText}


            <div class="actions">

              <button
                class="like"
                onclick="openChat('${match.id}','${otherUid}')"
              >
                💬 チャットする
              </button>

            </div>

          </div>

        `);

      }


      if (!cards.length) {

        matchesBox.innerHTML =
          '<div class="empty">マッチ情報がありません。</div>';

        return;

      }


      matchesBox.innerHTML =
        cards.join("");


    } catch (error) {

      console.error(error);


      matchesBox.innerHTML =
        '<div class="message error">マッチを読み込めませんでした。</div>';

    }

  }

  /*
   * ==========================================
   * チャット監視
   * ==========================================
   */

  function listenChat() {

    if (unsubscribeChat) {

      unsubscribeChat();

      unsubscribeChat =
        null;

    }


    if (!selectedMatchId) {
      return;
    }


    const messagesRef =
      collection(
        db,
        "matches",
        selectedMatchId,
        "messages"
      );


    unsubscribeChat =
      onSnapshot(
        messagesRef,
        async snapshot => {

          const messages = [];


          snapshot.forEach(
            item => {

              messages.push({

                id:
                  item.id,

                ...item.data()

              });

            }
          );


          messages.sort(
            (a, b) => {

              const at =
                a.createdAt?.seconds ||
                0;


              const bt =
                b.createdAt?.seconds ||
                0;


              return at - bt;

            }
          );


          const box =
            document.getElementById(
              "chatMessages"
            );


          if (!box) {
            return;
          }


          if (!messages.length) {

            box.innerHTML =
              '<div class="empty">まだメッセージはありません。<br>最初のメッセージを送ってみよう💕</div>';

          } else {

            box.innerHTML =
              messages
                .map(
                  message => {

                    const mine =
                      message.from ===
                      currentUser.uid;


                    const time =
                      message.createdAt
                        ?.toDate
                        ? message.createdAt
                            .toDate()
                            .toLocaleString(
                              "ja-JP"
                            )
                        : "";


                    const imageHtml =
                      message.imageUrl
                        ? `
                          <a
                            href="${escapeHtml(message.imageUrl)}"
                            target="_blank"
                            rel="noopener noreferrer"
                          >
                            <img
                              class="chatImage"
                              src="${escapeHtml(message.imageUrl)}"
                              alt="送信された写真"
                              loading="lazy"
                            >
                          </a>
                        `
                        : "";


                    const textHtml =
                      message.text
                        ? `
                          <div class="chatText">
                            ${escapeHtml(
                              message.text
                            )}
                          </div>
                        `
                        : "";


                    const deleteButton =
                      mine
                        ? `
                          <div
                            class="messageTools"
                          >

                            <button
                              class="deleteMessageButton"
                              onclick="deleteChatMessage('${message.id}','${escapeHtml(message.storagePath || "")}')"
                            >
                              🗑️ 削除
                            </button>

                          </div>
                        `
                        : "";


                    return `

                      <div
                        class="chatRow ${
                          mine
                            ? "mine"
                            : ""
                        }"
                      >

                        <div
                          class="chatBubble"
                        >

                          ${imageHtml}

                          ${textHtml}

                          <div
                            class="chatTime"
                          >
                            ${escapeHtml(
                              time
                            )}
                          </div>

                          ${deleteButton}

                        </div>

                      </div>

                    `;

                  }
                )
                .join("");

          }


          box.scrollTop =
            box.scrollHeight;


          await markChatAsRead(
            selectedMatchId
          );

        },
        error => {

          console.error(
            error
          );


          const box =
            document.getElementById(
              "chatMessages"
            );


          if (box) {

            box.innerHTML =
              '<div class="message error">チャットを読み込めませんでした。</div>';

          }

        }
      );

  }


  /*
   * ==========================================
   * 写真アップロード
   * ==========================================
   */

  async function uploadChatPhoto(
    file
  ) {

    if (
      !currentUser ||
      !selectedMatchId ||
      !file
    ) {

      return null;

    }


    const safeName =
      file.name
        .replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );


    const uniqueName =
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2) +
      "_" +
      safeName;


    const storagePath =
      "chatImages/" +
      selectedMatchId +
      "/" +
      currentUser.uid +
      "/" +
      uniqueName;


    const storageRef =
      ref(
        storage,
        storagePath
      );


    await uploadBytes(
      storageRef,
      file,
      {
        contentType:
          file.type
      }
    );


    const imageUrl =
      await getDownloadURL(
        storageRef
      );


    return {
      imageUrl,
      storagePath
    };

  }


  /*
   * ==========================================
   * チャット送信
   * ==========================================
   */

  async function sendChatMessage() {

    if (
      !currentUser ||
      !selectedMatchId
    ) {

      return;

    }


    const input =
      document.getElementById(
        "chatInput"
      );


    const text =
      input.value.trim();


    const file =
      selectedPhotoFile;


    if (
      !text &&
      !file
    ) {

      return;

    }


    const sendButton =
      document.getElementById(
        "sendChatButton"
      );


    try {

      sendButton.disabled =
        true;


      sendButton.textContent =
        file
          ? "写真送信中..."
          : "送信中...";


      const matchSnap =
        await getDoc(
          doc(
            db,
            "matches",
            selectedMatchId
          )
        );


      if (!matchSnap.exists()) {

        alert(
          "このチャットは利用できません。"
        );

        return;

      }


      const match =
        matchSnap.data();


      if (
        !Array.isArray(
          match.users
        ) ||
        !match.users.includes(
          currentUser.uid
        )
      ) {

        alert(
          "このチャットを利用する権限がありません。"
        );

        return;

      }


      let photoData =
        null;


      if (file) {

        photoData =
          await uploadChatPhoto(
            file
          );

      }


      const messageData = {

        from:
          currentUser.uid,

        text:
          text,

        createdAt:
          serverTimestamp()

      };


      if (photoData) {

        messageData.imageUrl =
          photoData.imageUrl;

        messageData.storagePath =
          photoData.storagePath;

      }


      await addDoc(
        collection(
          db,
          "matches",
          selectedMatchId,
          "messages"
        ),
        messageData
      );


      await updateDoc(
        doc(
          db,
          "matches",
          selectedMatchId
        ),
        {

          updatedAt:
            serverTimestamp(),

          [`readAt.${currentUser.uid}`]:
            serverTimestamp()

        }
      );


      input.value = "";


      selectedPhotoFile =
        null;


      const photoInput =
        document.getElementById(
          "photoFile"
        );


      if (photoInput) {
        photoInput.value = "";
      }


      const preview =
        document.getElementById(
          "photoPreview"
        );


      if (preview) {

        preview.classList.add(
          "hidden"
        );

        preview.textContent =
          "";

      }


      input.focus();


    } catch (error) {

      console.error(error);


      alert(
        firebaseErrorMessage(
          error
        )
      );

    } finally {

      sendButton.disabled =
        false;


      sendButton.textContent =
        "送信";

    }

  }


  /*
   * ==========================================
   * メッセージ削除
   * ==========================================
   */

  window.deleteChatMessage =
    async function(
      messageId,
      storagePath
    ) {

      if (
        !currentUser ||
        !selectedMatchId ||
        !messageId
      ) {

        return;

      }


      const ok =
        confirm(
          "このメッセージを削除しますか？"
        );


      if (!ok) {
        return;
      }


      try {

        const messageRef =
          doc(
            db,
            "matches",
            selectedMatchId,
            "messages",
            messageId
          );


        const messageSnap =
          await getDoc(
            messageRef
          );


        if (!messageSnap.exists()) {

          alert(
            "メッセージが見つかりません。"
          );

          return;

        }


        const message =
          messageSnap.data();


        /*
         * 自分のメッセージだけ削除可能
         */

        if (
          message.from !==
          currentUser.uid
        ) {

          alert(
            "自分が送ったメッセージだけ削除できます。"
          );

          return;

        }


        /*
         * 写真がある場合は
         * Storageからも削除
         */

        if (
          message.storagePath
        ) {

          try {

            await deleteObject(
              ref(
                storage,
                message.storagePath
              )
            );

          } catch (storageError) {

            console.warn(
              "写真ファイル削除エラー",
              storageError
            );

          }

        }


        await deleteDoc(
          messageRef
        );


      } catch (error) {

        console.error(error);


        alert(
          firebaseErrorMessage(
            error
          )
        );

      }

    };


  /*
   * ==========================================
   * 雑談投稿
   * ==========================================
   */

  document
    .getElementById(
      "postButton"
    )
    .addEventListener(
      "click",
      addPost
    );


  async function addPost() {

    if (!currentUser) {
      return;
    }


    const input =
      document.getElementById(
        "postText"
      );


    const text =
      input.value.trim();


    if (!text) {

      alert(
        "投稿内容を入力してください。"
      );

      return;

    }


    try {

      await addDoc(
        collection(
          db,
          "posts"
        ),
        {

          uid:
            currentUser.uid,

          name:
            currentProfile?.name ||
            "匿名",

          text:
            text,

          createdAt:
            serverTimestamp()

        }
      );


      input.value = "";


      await loadPosts();


    } catch (error) {

      console.error(error);


      alert(
        firebaseErrorMessage(
          error
        )
      );

    }

  }


  async function loadPosts() {

    if (!currentUser) {
      return;
    }


    try {

      const snapshot =
        await getDocs(
          collection(
            db,
            "posts"
          )
        );


      const posts = [];


      snapshot.forEach(
        item => {

          posts.push({

            id:
              item.id,

            ...item.data()

          });

        }
      );


      posts.sort(
        (a, b) => {

          const at =
            a.createdAt?.seconds ||
            0;


          const bt =
            b.createdAt?.seconds ||
            0;


          return bt - at;

        }
      );


      if (!posts.length) {

        postsBox.innerHTML =
          '<div class="empty">まだ投稿はありません。<br>最初の投稿をしてみよう💕</div>';

        return;

      }


      postsBox.innerHTML =
        posts
          .map(
            post => {

              const time =
                post.createdAt
                  ?.toDate
                  ? post.createdAt
                      .toDate()
                      .toLocaleString(
                        "ja-JP"
                      )
                  : "投稿直後";


              return `

                <div
                  class="postItem"
                >

                  <div
                    class="postHeader"
                  >

                    <strong>
                      ${escapeHtml(
                        post.name ||
                        "匿名"
                      )}
                    </strong>

                    <span
                      class="small"
                    >
                      ${escapeHtml(
                        time
                      )}
                    </span>

                  </div>

                  <div
                    style="margin-top:8px"
                  >
                    ${escapeHtml(
                      post.text
                    )}
                  </div>

                </div>

              `;

            }
          )
          .join("");


    } catch (error) {

      console.error(error);


      postsBox.innerHTML =
        '<div class="message error">投稿を読み込めませんでした。</div>';

    }

  }


  /*
   * ==========================================
   * タブ
   * ==========================================
   */

  document
    .querySelectorAll(
      ".tab"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          function() {

            openTab(
              button.dataset.tab
            );

          }
        );

      }
    );


  function openTab(
    tabId
  ) {

    document
      .querySelectorAll(
        ".tabContent"
      )
      .forEach(
        section => {

          section.classList.add(
            "hidden"
          );

        }
      );


    document
      .querySelectorAll(
        ".tab"
      )
      .forEach(
        button => {

          button.classList.remove(
            "active"
          );

        }
      );


    const section =
      document.getElementById(
        tabId
      );


    if (section) {

      section.classList.remove(
        "hidden"
      );

    }


    const button =
      document.querySelector(
        `.tab[data-tab="${tabId}"]`
      );


    if (button) {

      button.classList.add(
        "active"
      );

    }


    if (
      tabId ===
      "matchTab"
    ) {

      loadMatches();

    }


    if (
      tabId ===
      "talkTab"
    ) {

      loadPosts();

    }

  }


  /*
   * ==========================================
   * Firebaseログイン状態
   * ==========================================
   */

  onAuthStateChanged(
    auth,
    async function(user) {

      if (user) {

        currentUser =
          user;


        authSection.classList.add(
          "hidden"
        );


        appSection.classList.remove(
          "hidden"
        );


        accountEmail.textContent =
          user.email || "";


        try {

          await loadMyProfile();

          await loadPeople();

          await loadMatches();

          await loadPosts();

        } catch (error) {

          console.error(
            error
          );

        }

      } else {

        currentUser =
          null;


        currentProfile =
          null;


        selectedMatchId =
          null;


        selectedMatchUser =
          null;


        selectedPhotoFile =
          null;


        authSection.classList.remove(
          "hidden"
        );


        appSection.classList.add(
          "hidden"
        );


        if (unsubscribeChat) {

          unsubscribeChat();

          unsubscribeChat =
            null;

        }

      }

    }
  );


  /*
   * ==========================================
   * 初期化
   * ==========================================
   */

  async function init() {

    await loadMunicipalities();

  }


  init();

</script>
