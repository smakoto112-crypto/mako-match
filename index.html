<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1"
  >

  <title>ゼロ円マッチ 💕</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
      background:
        linear-gradient(135deg, #fff0f6, #f2efff);
      color: #333;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: auto;
      background: #fff;
      box-shadow: 0 0 30px rgba(0,0,0,.08);
      position: relative;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      background:
        linear-gradient(135deg, #ff6f9f, #9b8cff);
      color: white;
      padding: 18px 16px;
      text-align: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
    }

    .subtitle {
      font-size: 12px;
      margin-top: 4px;
      opacity: .95;
    }

    /* =========================
       AUTH
    ========================= */

    .auth {
      padding: 30px 20px;
    }

    .auth h2 {
      text-align: center;
      margin-top: 10px;
      margin-bottom: 25px;
    }

    /* =========================
       COMMON
    ========================= */

    .page {
      padding: 18px;
      padding-bottom: 95px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
      color: #555;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 12px;
      background: #fff;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #ff6f9f;
      box-shadow: 0 0 0 3px rgba(255,111,159,.12);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .field {
      margin-bottom: 15px;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 13px 15px;
      font-weight: 700;
      margin-top: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg,#ff6f9f,#9b8cff);
      color: white;
    }

    .btn-secondary {
      background: #f2f2f2;
      color: #444;
    }

    .btn-danger {
      background: #ffe7ec;
      color: #d6335c;
    }

    .btn-small {
      width: auto;
      padding: 8px 12px;
      font-size: 12px;
      margin: 0;
    }

    .hidden {
      display: none !important;
    }

    .message {
      padding: 12px;
      border-radius: 12px;
      margin: 10px 0;
      font-size: 14px;
    }

    .success {
      background: #eafff1;
      color: #198754;
    }

    .error {
      background: #ffe9ed;
      color: #c6284a;
    }

    .info {
      background: #eef4ff;
      color: #3867c8;
    }

    .loading {
      text-align: center;
      padding: 40px 15px;
      color: #777;
    }

    /* =========================
       AUTH AGE
    ========================= */

    .age-check {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      margin: 12px 0;
    }

    .age-check input {
      width: auto;
    }

    /* =========================
       NAV
    ========================= */

    .nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 520px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: rgba(255,255,255,.96);
      border-top: 1px solid #eee;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .nav button {
      position: relative;
      border: 0;
      background: transparent;
      padding: 9px 2px;
      font-size: 11px;
      color: #777;
    }

    .nav button.active {
      color: #ff4f8a;
      font-weight: 700;
    }

    .nav-icon {
      font-size: 20px;
      display: block;
      margin-bottom: 2px;
    }

    .unreadBadge {
      position: absolute;
      top: 3px;
      right: 15px;
      background: #ff315d;
      color: white;
      min-width: 19px;
      height: 19px;
      border-radius: 999px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 10px;
      font-weight: 800;
      padding: 0 5px;
    }

    /* =========================
       PROFILE
    ========================= */

    .profile-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .logout {
      margin-top: 20px;
    }

    /* =========================
       USER CARD
    ========================= */

    .user-card {
      border: 1px solid #eee;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      background:
        linear-gradient(135deg,#fff,#fff7fb);
    }

    .user-name {
      font-size: 19px;
      font-weight: 800;
    }

    .user-info {
      font-size: 13px;
      color: #666;
      margin-top: 5px;
    }

    .user-bio {
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .like-button {
      margin-top: 13px;
      background: linear-gradient(135deg,#ff6f9f,#ff4f8a);
      color: white;
      border: 0;
      border-radius: 999px;
      padding: 10px 20px;
      font-weight: 700;
    }

    .liked {
      background: #eee;
      color: #777;
    }

    /* =========================
       MATCH
    ========================= */

    .match-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border: 1px solid #eee;
      border-radius: 15px;
      margin-bottom: 10px;
      background: white;
    }

    .match-icon {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: linear-gradient(135deg,#ff6f9f,#9b8cff);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .match-main {
      flex: 1;
      min-width: 0;
    }

    .matchNameRow {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 800;
    }

    .unreadText {
      color: #ff315d;
      font-size: 11px;
    }

    .last-message {
      color: #777;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 3px;
    }

    /* =========================
       CHAT
    ========================= */

    .chat-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .back-button {
      border: 0;
      background: #f2f2f2;
      border-radius: 50%;
      width: 38px;
      height: 38px;
    }

    .chat-name {
      font-weight: 800;
      font-size: 18px;
    }

    .chat-box {
      height: 55vh;
      min-height: 350px;
      overflow-y: auto;
      background: #f8f8fb;
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .bubble-row {
      display: flex;
      margin-bottom: 9px;
    }

    .bubble-row.mine {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 78%;
      border-radius: 18px;
      padding: 9px 12px;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
      position: relative;
    }

    .mine .bubble {
      background: #ffdfeb;
    }

    .bubble-time {
      font-size: 9px;
      color: #999;
      margin-top: 4px;
      text-align: right;
    }

    .delete-message {
      border: 0;
      background: transparent;
      color: #999;
      font-size: 10px;
      padding: 2px 0 0 8px;
    }

    .chat-image {
      display: block;
      max-width: 230px;
      max-height: 300px;
      width: auto;
      height: auto;
      border-radius: 13px;
      object-fit: cover;
      cursor: pointer;
    }

    .image-message-label {
      font-size: 11px;
      color: #777;
      margin-top: 5px;
    }

    .chat-input-area {
      display: flex;
      gap: 7px;
      align-items: flex-end;
    }

    .chat-text {
      flex: 1;
      min-height: 46px;
      max-height: 120px;
      resize: none;
    }

    .photo-button {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 0;
      background: #f1eaff;
      font-size: 21px;
      flex-shrink: 0;
    }

    .send-button {
      width: 70px;
      height: 46px;
      border: 0;
      border-radius: 15px;
      background: linear-gradient(135deg,#ff6f9f,#9b8cff);
      color: white;
      font-weight: 700;
      flex-shrink: 0;
    }

    .upload-progress {
      margin-top: 7px;
      font-size: 11px;
      color: #777;
    }

    /* =========================
       POSTS
    ========================= */

    .post {
      border-bottom: 1px solid #eee;
      padding: 13px 0;
    }

    .post:last-child {
      border-bottom: 0;
    }

    .post-name {
      font-weight: 800;
      font-size: 13px;
    }

    .post-text {
      margin-top: 5px;
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.5;
    }

    .post-time {
      font-size: 10px;
      color: #999;
      margin-top: 5px;
    }

    /* =========================
       SPINNER
    ========================= */

    .spinner {
      width: 28px;
      height: 28px;
      border: 4px solid #eee;
      border-top-color: #ff6f9f;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .small {
      font-size: 12px;
      color: #777;
    }

    .center {
      text-align: center;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">ゼロ円マッチ 💕</div>
    <div class="subtitle">
      18歳以上限定・安心して話せる場所
    </div>
  </header>

  <!-- =========================
       AUTH
  ========================= -->

  <section id="authScreen" class="auth">

    <h2>ゼロ円マッチ 💕</h2>

    <div id="authMessage"></div>

    <div class="field">
      <label>メールアドレス</label>
      <input
        id="emailInput"
        type="email"
        placeholder="example@example.com"
        autocomplete="email"
      >
    </div>

    <div class="field">
      <label>パスワード</label>
      <input
        id="passwordInput"
        type="password"
        placeholder="6文字以上"
        autocomplete="current-password"
      >
    </div>

    <label class="age-check">
      <input id="ageCheck" type="checkbox">
      私は18歳以上です
    </label>

    <button
      id="loginBtn"
      class="btn btn-primary"
    >
      ログイン
    </button>

    <button
      id="registerBtn"
      class="btn btn-secondary"
    >
      新規登録
    </button>

  </section>

  <!-- =========================
       MAIN
  ========================= -->

  <main id="mainScreen" class="hidden">

    <!-- PROFILE -->

    <section
      id="profilePage"
      class="page"
    >

      <div class="profile-title">
        👤 プロフィール
      </div>

      <div id="profileMessage"></div>

      <div class="card">

        <div class="field">
          <label>ニックネーム</label>

          <input
            id="nameInput"
            maxlength="30"
            placeholder="ニックネーム"
          >
        </div>

        <div class="field">
          <label>年齢</label>

          <input
            id="ageInput"
            type="number"
            min="18"
            max="120"
            placeholder="18"
          >
        </div>

        <div class="field">
          <label>性別</label>

          <select id="genderInput">
            <option value="">選択してください</option>
            <option value="男性">男性</option>
            <option value="女性">女性</option>
            <option value="その他">その他</option>
          </select>
        </div>

        <div class="field">
          <label>都道府県</label>

          <select id="prefectureInput">
            <option value="">読み込み中...</option>
          </select>
        </div>

        <div class="field">
          <label>市区町村</label>

          <select id="municipalityInput">
            <option value="">都道府県を選択してください</option>
          </select>
        </div>

        <div class="field">
          <label>自己紹介</label>

          <textarea
            id="bioInput"
            maxlength="500"
            placeholder="気軽に自己紹介を書いてください"
          ></textarea>
        </div>

        <button
          id="saveProfileBtn"
          class="btn btn-primary"
        >
          プロフィールを保存 💕
        </button>

      </div>

      <button
        id="logoutBtn"
        class="btn btn-danger logout"
      >
        ログアウト
      </button>

    </section>


    <!-- RECOMMEND -->

    <section
      id="recommendPage"
      class="page hidden"
    >

      <div class="profile-title">
        💕 おすすめ
      </div>

      <div id="recommendList">
        <div class="loading">
          <div class="spinner"></div>
          <p>読み込み中...</p>
        </div>
      </div>

    </section>


    <!-- MATCH -->

    <section
      id="matchPage"
      class="page hidden"
    >

      <div id="matchListPage">

        <div class="profile-title">
          💖 マッチ
        </div>

        <div id="matchList">
          <div class="loading">
            <div class="spinner"></div>
            <p>読み込み中...</p>
          </div>
        </div>

      </div>

      <!-- CHAT -->

      <div
        id="chatPage"
        class="hidden"
      >

        <div class="chat-header">

          <button
            id="backChatBtn"
            class="back-button"
          >
            ←
          </button>

          <div>
            <div
              id="chatPartnerName"
              class="chat-name"
            ></div>

            <div class="small">
              二人だけのチャット 💕
            </div>
          </div>

        </div>

        <div
          id="chatMessages"
          class="chat-box"
        ></div>

        <div
          id="uploadProgress"
          class="upload-progress"
        ></div>

        <div class="chat-input-area">

          <button
            id="photoBtn"
            class="photo-button"
            title="写真を送る"
          >
            📷
          </button>

          <textarea
            id="chatText"
            class="chat-text"
            placeholder="メッセージを入力..."
          ></textarea>

          <button
            id="sendMessageBtn"
            class="send-button"
          >
            送信
          </button>

        </div>

        <input
          id="photoInput"
          type="file"
          accept="image/*"
          class="hidden"
        >

        <p class="small">
          ※写真は自動的にサイズを小さくして送信します。
        </p>

      </div>

    </section>


    <!-- POSTS -->

    <section
      id="postPage"
      class="page hidden"
    >

      <div class="profile-title">
        🗣️ 雑談コーナー
      </div>

      <div class="card">

        <textarea
          id="postText"
          maxlength="500"
          placeholder="気軽にひとこと投稿しよう"
        ></textarea>

        <button
          id="postBtn"
          class="btn btn-primary"
        >
          投稿する
        </button>

      </div>

      <div class="card">

        <div id="postList">
          <div class="loading">
            読み込み中...
          </div>
        </div>

      </div>

    </section>

  </main>


  <!-- =========================
       NAV
  ========================= -->

  <nav
    id="nav"
    class="nav hidden"
  >

    <button
      data-page="profilePage"
      class="active"
    >
      <span class="nav-icon">👤</span>
      プロフィール
    </button>

    <button
      data-page="recommendPage"
    >
      <span class="nav-icon">💕</span>
      おすすめ
    </button>

    <button
      data-page="matchPage"
    >
      <span class="nav-icon">💖</span>
      マッチ

      <span
        id="navUnread"
        class="unreadBadge hidden"
      >
        0
      </span>
    </button>

    <button
      data-page="chatDummy"
      id="chatNavBtn"
    >
      <span class="nav-icon">💬</span>
      チャット

      <span
        id="navChatUnread"
        class="unreadBadge hidden"
      >
        0
      </span>
    </button>

    <button
      data-page="postPage"
    >
      <span class="nav-icon">🗣️</span>
      雑談
    </button>

  </nav>

</div>


<script type="module">

  /* =====================================================
     Firebase
  ===================================================== */

  import {
    initializeApp
  } from
  "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

  import {
    getAuth,
    createUserWithEmailAndPassword,

  } from

  import {

  } from

    ref,
    uploadBytesResumable,

  } from
  "https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js";


  /* =====================================================
     Firebase Config
  ===================================================== */

  const firebaseConfig = {

    apiKey:
      "AIzaSyBVtlfUgyyt6eic_chW_ADyz3SCBtCz9GA",

    authDomain:
      "makomatch-7a96b.firebaseapp.com",

    projectId:
      "makomatch-7a96b",

    storageBucket:
      "makomatch-7a96b.firebasestorage.app",

    messagingSenderId:
      "371872457458",

    appId:
      "1:371872457458:web:6c9391508fbba63df2a66b",

    measurementId:
      "G-Y39HTKE7ZZ"
  };


  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);

  const storage =
    getStorage(app);


  /* =====================================================
     STATE
  ===================================================== */

  let currentUser = null;

  let currentProfile = null;

  let currentMatchId = null;

  let currentChatPartner = null;

  let unsubscribeMessages = null;

  let unsubscribeMatches = null;

  let unsubscribePosts = null;

  let allLocations = [];

  let allUsers = [];

  let likedUsers = new Set();


  /* =====================================================
     DOM
  ===================================================== */

  const authScreen =
    document.getElementById("authScreen");

  const mainScreen =
    document.getElementById("mainScreen");

  const nav =
    document.getElementById("nav");

  const authMessage =
    document.getElementById("authMessage");

  const profileMessage =
    document.getElementById("profileMessage");


  /* =====================================================
     HELPERS
  ===================================================== */

  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  function showMessage(element, text, type = "info") {

    element.innerHTML =
      `<div class="message ${type}">
        ${escapeHtml(text)}
      </div>`;
  }


  function formatTime(timestamp) {

    if (!timestamp) return "";

    let date;

    try {
      date =
        timestamp.toDate
          ? timestamp.toDate()
          : new Date(timestamp);
    } catch {
      return "";
    }

    return date.toLocaleString(
      "ja-JP",
      {
        month: "numeric",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      }
    );
  }


  function timestampMillis(timestamp) {

    if (!timestamp) return 0;

    if (typeof timestamp.toMillis === "function") {
      return timestamp.toMillis();
    }

    if (timestamp instanceof Date) {
      return timestamp.getTime();
    }

    return 0;
  }


  function matchIdFor(uid1, uid2) {

    return [uid1, uid2]
      .sort()
      .join("_");
  }


  /* =====================================================
     PAGE NAVIGATION
  ===================================================== */

  function showPage(pageId) {

    document
      .querySelectorAll(
        "#mainScreen > section"
      )
      .forEach(section => {
        section.classList.add("hidden");
      });

    const page =
      document.getElementById(pageId);

    if (page) {
      page.classList.remove("hidden");
    }

    document
      .querySelectorAll(".nav button")
      .forEach(button => {
        button.classList.remove("active");
      });

    const active =
      document.querySelector(
        `.nav button[data-page="${pageId}"]`
      );

    if (active) {
      active.classList.add("active");
    }

    if (pageId === "recommendPage") {
      loadRecommendations();
    }

    if (pageId === "postPage") {
      loadPosts();
    }

    if (pageId === "matchPage") {
      showMatchList();
    }
  }


  document
    .querySelectorAll(".nav button")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          const page =
            button.dataset.page;

          if (page === "chatDummy") {

            showPage("matchPage");

            return;
          }

          showPage(page);
        }
      );
    });


  /* =====================================================
     AUTH
  ===================================================== */

  document
    .getElementById("registerBtn")
    .addEventListener(
      "click",
      async () => {

        const email =
          document
            .getElementById("emailInput")
            .value
            .trim();

        const password =
          document
            .getElementById("passwordInput")
            .value;

        const ageOK =
          document

  function firebaseErrorMessage(error) {

    const code =
      error?.code || "";

    if (code.includes("invalid-credential")) {
      return "メールアドレスまたはパスワードが違います。";
    }

    if (code.includes("invalid-email")) {
      return "メールアドレスの形式が正しくありません。";
    }

    if (code.includes("email-already-in-use")) {
      return "このメールアドレスはすでに登録されています。";
    }

    if (code.includes("weak-password")) {
      return "パスワードが弱すぎます。6文字以上にしてください。";
    }

    if (code.includes("network-request-failed")) {
      return "通信エラーです。インターネット接続を確認してください。";
    }

    if (code.includes("permission-denied")) {
      return "Firebaseの権限設定を確認してください。";
    }

    return "エラーが発生しました。もう一度試してください。";
  }

  async function saveProfile() {

    if (!currentUser) return;

    const name =
      document
        .getElementById("nameInput")
        .value
        .trim();

    const age =
      Number(
        document
          .getElementById("ageInput")
          .value
      );

    const gender =

        .getElementById("genderInput")
        .value;

    const prefecture =
      document
        .getElementById("prefectureInput");

    const municipality =
      document
        .getElementById("municipalityInput");

    const bio =
      document
        .getElementById("bioInput")
        .value
        .trim();

    if (!name) {

      showMessage(
        profileMessage,
        "ニックネームを入力してください。",
        "error"
      );

      return;
    }

    if (age < 18 || age > 120) {

      showMessage(
        profileMessage,
        "年齢は18歳以上で入力してください。",
        "error"
      );

      return;
    }

    if (!gender) {

      showMessage(
        profileMessage,
        "性別を選択してください。",
        "error"
      );

      return;
    }

    if (!prefecture.value) {

      showMessage(
        profileMessage,
        "都道府県を選択してください。",
        "error"
      );

      return;
    }

    if (!municipality.value) {

      showMessage(
        profileMessage,
        "市区町村を選択してください。",
        "error"
      );

      return;
    }

    try {

      const data = {

        uid: currentUser.uid,

        email:
          currentUser.email || "",

        name,

        age,

        gender,

        prefecturePid:
          prefecture.selectedOptions[0]
            ?.dataset.pid || "",

        prefecture:
          prefecture.value,

        municipality:
          municipality.value,

        bio,

        updatedAt:
          serverTimestamp()
      };

      await setDoc(
        doc(db, "users", currentUser.uid),
        data,
        { merge: true }
      );

      currentProfile = {
        ...currentProfile,
        ...data
      };

      showMessage(
        profileMessage,
        "プロフィールを保存しました 💕",
        "success"
      );

    } catch (error) {

  /* =====================================================
     LOCATION
  ===================================================== */

  async function loadLocations() {

    const pref =
      document.getElementById(
        "prefectureInput"
      );

    try {

      const response =
        await fetch(
          "https://code4fukui.github.io/localgovjp/localgovjp.json"
        );

      if (!response.ok) {
        throw new Error("location fetch failed");
      }

      allLocations =
        await response.json();

      const prefectures = [];

      const seen =
        new Set();

      for (const item of allLocations) {

        if (
          !item.pref ||
          !item.pid
        ) continue;

        const key =
          `${item.pid}_${item.pref}`;

        if (seen.has(key)) continue;

        seen.add(key);

        prefectures.push({
          pid: item.pid,
          pref: item.pref
        });
      }

      pref.innerHTML =
        `<option value="">選択してください</option>`;

      prefectures.forEach(item => {

        const option =
          document.createElement("option");

        option.value =
          item.pref;

        option.textContent =
          item.pref;

        option.dataset.pid =
          item.pid;

        pref.appendChild(option);
      });

      if (
        currentProfile &&
        currentProfile.prefecture
      ) {

        pref.value =
          currentProfile.prefecture;

        populateMunicipalities(
          currentProfile.prefecture
        );
      }

    } catch (error) {

      console.error(error);

      pref.innerHTML =
        `<option value="">読み込み失敗</option>`;

      showMessage(
        profileMessage,
        "市区町村データを読み込めませんでした。通信状態を確認してください。",
        "error"
      );
    }
  }


  document
    .getElementById("prefectureInput")

  function populateMunicipalities(
    prefecture
  ) {

    const select =
      document.getElementById(
        "municipalityInput"
      );

    select.innerHTML =
      `<option value="">選択してください</option>`;

    if (!prefecture) return;

    const cities =
      allLocations.filter(
        item =>
          item.pref === prefecture &&
          item.city
      );

    cities.forEach(item => {

      const option =
        document.createElement("option");

      option.value =
        item.city;

      option.textContent =
        item.city;

      option.dataset.cid =
        item.cid || "";

      select.appendChild(option);
    });

    if (
      currentProfile &&
      currentProfile.prefecture === prefecture &&
      currentProfile.municipality
    ) {

      const exists =
        [...select.options]
          .some(
            option =>
              option.value ===
              currentProfile.municipality
          );

      if (!exists) {

        const option =
          document.createElement("option");

        option.value =
          currentProfile.municipality;

        option.textContent =
          currentProfile.municipality;

        select.appendChild(option);
      }

      select.value =
        currentProfile.municipality;
    }
  }

          .map(docSnap => ({
            id: docSnap.id,

  async function likeUser(targetUid) {

    if (!currentUser) return;

    try {

      await setDoc(
        doc(
          db,

          "users",
          targetUid

        await getDoc(

  async function createMatch(
    uid1,
    uid2
  ) {

    const id =
      matchIdFor(
        uid1,
        uid2
      );

    const user1Snap =
      await getDoc(
        doc(db, "users", uid1)
      );

    const user2Snap =
      await getDoc(
        doc(db, "users", uid2)
      );

    const user1 =
      user1Snap.exists()
        ? user1Snap.data()
        : {};

    const user2 =
      user2Snap.exists()
        ? user2Snap.data()
        : {};

    await setDoc(
      doc(db, "matches", id),
      {
        users: [uid1, uid2],

        user1: uid1,

        user2: uid2,

        user1Name:
          user1.name || "ユーザー",

        user2Name:
          user2.name || "ユーザー",

        updatedAt:
          serverTimestamp(),

        readAt: {}
      },
      { merge: true }
    );
  }


  function startMatchesListener() {

    if (!currentUser) return;

    if (unsubscribeMatches) {
      unsubscribeMatches();
    }

    const q =
      query(
        collection(db, "matches"),
        where(
          "users",
          "array-contains",
          currentUser.uid
        )
      );

    unsubscribeMatches =
      onSnapshot(
        q,
        snapshot => {

          const matches =
            snapshot.docs
              .map(d => ({
                id: d.id,
                ...d.data()
              }))
              .sort(
                (a,b) =>
                  timestampMillis(b.updatedAt)
                  -
                  timestampMillis(a.updatedAt)
              );

          renderMatchList(
            matches
          );

          updateUnreadBadge(
            matches
          );
        },
        error => {

          console.error(
            "match listener",
            error
          );
        }
      );
  }


  function renderMatchList(
    matches
  ) {

    const container =
      document.getElementById(
        "matchList"
      );

    if (!matches.length) {

      container.innerHTML =
        `<div class="card center">
          <div style="font-size:35px;">💕</div>
          <p>まだマッチしていません。</p>
          <p class="small">
            おすすめから「いいね」してみましょう。
          </p>
        </div>`;

      return;
    }

    container.innerHTML =
      matches
        .map(match => {

          const partnerUid =
            match.users.find(
              uid =>
                uid !== currentUser.uid
            );

          const partnerName =
            partnerUid === match.user1
              ? match.user1Name
              : match.user2Name;

          const readAt =
            match.readAt?.[
              currentUser.uid
            ];

          const unread =
            match.lastMessageFrom &&
            match.lastMessageFrom !==
              currentUser.uid &&
            timestampMillis(
              match.updatedAt
            ) >
            timestampMillis(
              readAt
            );

          let preview =
            match.lastMessageText ||
            "チャットできます 💕";

          return `
            <div
              class="match-item"
              data-match="${escapeHtml(match.id)}"
            >

              <div class="match-icon">
                💕
              </div>

              <div class="match-main">

                <div class="matchNameRow">

                  <span>
                    ${escapeHtml(partnerName || "ユーザー")}
                  </span>

                  ${
                    unread
                      ? `<span class="unreadText">
                          未読
                         </span>`
                      : ""
                  }

                </div>

                <div class="last-message">
                  ${escapeHtml(preview)}
                </div>

              </div>

              ${
                unread
                  ? `<span class="unreadBadge">
                      ●
                     </span>`
                  : ""
              }

            </div>
          `;
        })
        .join("");

    container
      .querySelectorAll(
        "[data-match]"
      )
      .forEach(item => {

        item.addEventListener(
          "click",
          () => {

            openChat(
              item.dataset.match
            );
          }
        );
      });
  }


  function updateUnreadBadge(
    matches
  ) {

    let count = 0;

    for (const match of matches) {

      const readAt =
        match.readAt?.[
          currentUser.uid
        ];

      const unread =
        match.lastMessageFrom &&
        match.lastMessageFrom !==
          currentUser.uid &&
        timestampMillis(
          match.updatedAt
        ) >
        timestampMillis(
          readAt
        );

      if (unread) {
        count++;
      }
    }

    const badges =
      [
        document.getElementById(
          "navUnread"
        ),
        document.getElementById(
          "navChatUnread"
        )
      ];

    badges.forEach(badge => {

      if (count > 0) {

        badge.textContent =
          count > 99
            ? "99+"
            : String(count);

        badge.classList.remove(
          "hidden"
        );

      } else {

        badge.classList.add(
          "hidden"
        );
      }
    });
  }

  async function openChat(matchId) {

    currentMatchId =
      matchId;

    const matchSnap =
      await getDoc(
        doc(
          db,
          "matches",
          matchId
        )
      );

    if (!matchSnap.exists()) {

      alert(
        "マッチ情報が見つかりません。"
      );

      return;
    }

    const match =
      matchSnap.data();

    const partnerUid =
      match.users.find(
        uid =>
          uid !== currentUser.uid
      );

    const partnerName =
      partnerUid === match.user1
        ? match.user1Name
        : match.user2Name;

    currentChatPartner = {
      uid: partnerUid,
      name: partnerName || "ユーザー"
    };

    document
      .getElementById(
        "chatPartnerName"
      )
      .textContent =
      currentChatPartner.name;

    document
      .getElementById(
        "matchListPage"
      )
      .classList.add(
        "hidden"
      );

    document
      .getElementById(
        "chatPage"
      )
      .classList.remove(
        "hidden"
      );

    document
      .getElementById(
        "chatText"
      )
      .focus();

    await markChatAsRead();

    listenMessages();
  }


  async function markChatAsRead() {

    if (!currentUser || !currentMatchId) {
      return;
    }

    try {

      await updateDoc(
        doc(
          db,
          "matches",
          currentMatchId
        ),
        {
          [`readAt.${currentUser.uid}`]:
            serverTimestamp()
        }
      );

    } catch (error) {

      console.error(
        "mark read",
        error
      );
    }
  }


  function listenMessages() {

    if (!currentMatchId) return;

    if (unsubscribeMessages) {
      unsubscribeMessages();
    }

    const messagesRef =
      collection(
        db,
        "matches",
        currentMatchId,
        "messages"
      );

    unsubscribeMessages =
      onSnapshot(
        messagesRef,
        snapshot => {

          const messages =
            snapshot.docs
              .map(d => ({
                id: d.id,
                ...d.data()
              }))
              .sort(
                (a,b) =>
                  timestampMillis(a.createdAt)
                  -
                  timestampMillis(b.createdAt)
              );

          renderMessages(
            messages
          );

          setTimeout(
            scrollChatToBottom,
            50
          );
        },
        error => {

          console.error(
            "message listener",
            error
          );
        }
      );
  }


  function renderMessages(
    messages
  ) {

    const container =
      document.getElementById(
        "chatMessages"
      );

    if (!messages.length) {

      container.innerHTML =
        `<div class="center small" style="padding:30px;">
          まだメッセージはありません。<br>
          最初のメッセージを送ってみよう 💕
        </div>`;

      return;
    }

    container.innerHTML =
      messages
        .map(message => {

          const mine =
            message.from ===
            currentUser.uid;

          let content = "";

          if (
            message.type ===
            "image"
          ) {

            content = `
              <img
                src="${escapeHtml(message.imageUrl || "")}"
                class="chat-image"
                alt="送信された写真"
                onclick="window.open(this.src,'_blank')"
              >

              <div class="image-message-label">
                📷 写真
              </div>
            `;

          } else {

            content =
              `<div>
                ${escapeHtml(message.text || "")}
              </div>`;
          }

          return `
            <div class="bubble-row ${mine ? "mine" : ""}">

              <div class="bubble">

                ${content}

                <div class="bubble-time">
                  ${escapeHtml(
                    formatTime(
                      message.createdAt
                    )
                  )}
                </div>

                ${
                  mine
                    ? `
                      <button
                        class="delete-message"
                        data-delete-message="${escapeHtml(message.id)}"
                      >
                        🗑️ 削除
                      </button>
                    `
                    : ""
                }

              </div>

            </div>
          `;
        })
        .join("");

    container
      .querySelectorAll(
        "[data-delete-message]"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            deleteMessage(
              button.dataset.deleteMessage
            );
          }
        );
      });
  }


  function scrollChatToBottom() {

    const box =
      document.getElementById(
        "chatMessages"
      );

    box.scrollTop =
      box.scrollHeight;
  }

  async function sendTextMessage() {

    if (
      !currentUser ||
      !currentMatchId
    ) return;

    const textarea =
      document.getElementById(
        "chatText"
      );

    const text =
      textarea.value.trim();

    if (!text) return;

    try {

      textarea.value = "";

      await addDoc(
        collection(
          db,
          "matches",
          currentMatchId,
          "messages"
        ),
        {
          from:
            currentUser.uid,

          type:
            "text",

          text,

          createdAt:
            serverTimestamp()
        }
      );

      await updateDoc(
        doc(
          db,
          "matches",
          currentMatchId
        ),
        {
          lastMessageFrom:
            currentUser.uid,

          lastMessageText:
            text.substring(0, 100),

          lastMessageType:
            "text",

          updatedAt:
            serverTimestamp()
        }
      );

      await markChatAsRead();

    } catch (error) {

      console.error(error);

      alert(
        "メッセージを送信できませんでした。"
      );
    }
  }


  /* =====================================================
     PHOTO
  ===================================================== */

  document
    .getElementById(
      "photoBtn"
    )
    .addEventListener(
      "click",
      () => {

        document
          .getElementById(
            "photoInput"
          )
          .click();
      }
    );


  document
    .getElementById(
      "photoInput"
    )
    .addEventListener(
      "change",
      async event => {

        const file =
          event.target.files?.[0];

        event.target.value = "";

        if (!file) return;

        await sendPhoto(file);
      }
    );


  async function sendPhoto(file) {

    if (
      !currentUser ||
      !currentMatchId
    ) return;

    if (
      !file.type.startsWith("image/")
    ) {

      alert(
        "画像ファイルを選択してください。"
      );

      return;
    }

    /*
      大きすぎる元画像を制限
    */

    if (
      file.size >
      10 * 1024 * 1024
    ) {

      alert(
        "写真は10MB以下にしてください。"
      );

      return;
    }

    try {

      const progress =
        document.getElementById(
          "uploadProgress"
        );

      progress.textContent =
        "📷 写真を準備しています...";

      /*
        画像を最大1280pxに縮小
      */

      const resizedBlob =
        await resizeImage(
          file,
          1280,
          0.82
        );

      const fileName =
        `${Date.now()}_${Math.random()
          .toString(36)
          .substring(2)}.jpg`;

      const storagePath =
        `chatPhotos/${currentMatchId}/${currentUser.uid}/${fileName}`;

      const storageRef =
        ref(
          storage,
          storagePath
        );

      const uploadTask =
        uploadBytesResumable(
          storageRef,
          resizedBlob,
          {
            contentType:
              "image/jpeg"
          }
        );

      await new Promise(
        (resolve, reject) => {

          uploadTask.on(
            "state_changed",

            snapshot => {

              const percent =
                Math.round(
                  (
                    snapshot.bytesTransferred /
                    snapshot.totalBytes
                  ) * 100
                );

              progress.textContent =
                `📷 写真を送信中... ${percent}%`;
            },

            error => {
              reject(error);
            },

            () => {
              resolve();
            }
          );
        }
      );

      const imageUrl =
        await getDownloadURL(
          uploadTask.snapshot.ref
        );

      await addDoc(
        collection(
          db,
          "matches",
          currentMatchId,
          "messages"
        ),
        {
          from:
            currentUser.uid,

          type:
            "image",

          imageUrl,

          imagePath:
            storagePath,

          storagePath,

          createdAt:
            serverTimestamp()
        }
      );

      await updateDoc(
        doc(
          db,
          "matches",
          currentMatchId
        ),
        {
          lastMessageFrom:
            currentUser.uid,

          lastMessageText:
            "📷 写真",

          lastMessageType:
            "image",

          updatedAt:
            serverTimestamp()
        }
      );

      await markChatAsRead();

      progress.textContent =
        "📷 写真を送信しました 💕";

      setTimeout(
        () => {
          progress.textContent = "";
        },
        2000
      );

    } catch (error) {

      console.error(
        "PHOTO ERROR:",
        error
      );

      document
        .getElementById(
          "uploadProgress"
        )
        .textContent = "";

      if (
        error?.code ===
        "storage/unauthorized"
      ) {

        alert(
          "Storageの権限設定が必要です。"
        );

      } else if (
        error?.code ===
        "storage/quota-exceeded"
      ) {

        alert(
          "Storageの容量上限を確認してください。"
        );

      } else {

        alert(
          "写真を送信できませんでした。"
        );
      }
    }
  }


  function resizeImage(
    file,
    maxSize,
    quality
  ) {

    return new Promise(
      (resolve, reject) => {

        const reader =
          new FileReader();

        reader.onload =
          event => {

            const img =
              new Image();

            img.onload =
              () => {

                let width =
                  img.width;

                let height =
                  img.height;

                if (
                  width > maxSize ||
                  height > maxSize
                ) {

                  if (
                    width > height
                  ) {

                    height =
                      Math.round(
                        height *
                        maxSize /
                        width
                      );

                    width =
                      maxSize;

                  } else {

                    width =
                      Math.round(
                        width *
                        maxSize /
                        height
                      );

                    height =
                      maxSize;
                  }
                }

                const canvas =
                  document.createElement(
                    "canvas"
                  );

                canvas.width =
                  width;

                canvas.height =
                  height;

                const ctx =
                  canvas.getContext(
                    "2d"
                  );

                ctx.drawImage(
                  img,
                  0,
                  0,
                  width,
                  height
                );

                canvas.toBlob(
                  blob => {

                    if (!blob) {

                      reject(
                        new Error(
                          "画像変換失敗"
                        )
                      );

                      return;
                    }

                    resolve(blob);
                  },

                  "image/jpeg",

                  quality
                );
              };

            img.onerror =
              () => {

                reject(
                  new Error(
                    "画像を読み込めません"
                  )
                );
              };

            img.src =
              event.target.result;
          };

        reader.onerror =
          () => {

            reject(
              new Error(
                "ファイル読み込み失敗"
              )
            );
          };

        reader.readAsDataURL(file);
      }
    );
  }


  /* =====================================================
     DELETE MESSAGE
  ===================================================== */

  async function deleteMessage(
    messageId
  ) {

    if (
      !currentUser ||
      !currentMatchId
    ) return;

    const ok =
      confirm(
        "このメッセージを削除しますか？"
      );

    if (!ok) return;

    try {

      const messageRef =
        doc(
          db,
          "matches",
          currentMatchId,
          "messages",
          messageId
        );

      const snap =
        await getDoc(messageRef);

      if (!snap.exists()) return;

      const data =
        snap.data();

      if (
        data.from !==
        currentUser.uid
      ) {

        alert(
          "自分のメッセージだけ削除できます。"
        );

        return;
      }

      /*
        写真ならStorageからも削除
      */

      if (
        data.storagePath
      ) {

        try {

          await deleteObject(
            ref(
              storage,
              data.storagePath
            )
          );

        } catch (storageError) {

          console.warn(
            "Storage delete error",
            storageError
          );
        }
      }

      await deleteDoc(
        messageRef
      );

    } catch (error) {

      console.error(error);

      alert(
        "メッセージの削除に失敗しました。"
      );
    }
  }

  async function createPost() {

    if (!currentUser) return;

    const textarea =
      document.getElementById(
        "postText"
      );

    const text =
      textarea.value.trim();

    if (!text) {

      alert(
        "投稿内容を入力してください。"
      );

      return;
    }

    try {

      await addDoc(
        collection(
          db,
          "posts"
        ),
        {
          uid:
            currentUser.uid,

          name:
            currentProfile?.name ||
            "ユーザー",

          text,

          createdAt:
            serverTimestamp()
        }
      );

      textarea.value = "";

      alert(
        "投稿しました 💕"
      );

    } catch (error) {

      console.error(error);

      alert(
        "投稿できませんでした。"
      );
    }
  }


  function loadPosts() {

    if (!currentUser) return;

    if (unsubscribePosts) {
      unsubscribePosts();
    }

    unsubscribePosts =
      onSnapshot(
        collection(
          db,
          "posts"
        ),
        snapshot => {

          const posts =
            snapshot.docs
              .map(d => ({
                id: d.id,
                ...d.data()
              }))
              .sort(
                (a,b) =>
                  timestampMillis(b.createdAt)
                  -
                  timestampMillis(a.createdAt)
              );

          renderPosts(posts);
        },
        error => {

          console.error(
            "posts",
            error
          );
        }
      );
  }


  function renderPosts(
    posts
  ) {

    const container =
      document.getElementById(
        "postList"
      );

    if (!posts.length) {

      container.innerHTML =
        `<div class="center small">
          まだ投稿がありません。
        </div>`;

      return;
    }

    container.innerHTML =
      posts
        .map(post => {

          return `
            <div class="post">

              <div class="post-name">
                ${escapeHtml(
                  post.name || "ユーザー"
                )}
              </div>

              <div class="post-text">
                ${escapeHtml(
                  post.text || ""
                )}
              </div>

              <div class="post-time">
                ${escapeHtml(
                  formatTime(
                    post.createdAt
                  )
                )}
              </div>

            </div>
          `;
        })
        .join("");
  }
