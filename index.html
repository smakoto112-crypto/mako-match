<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>まこマッチ 💕</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<header><div class="brand">まこマッチ <span>💕</span></div><button id="logout" class="ghost hidden">ログアウト</button></header>

<main>
  <section id="auth" class="card">
    <h1>18歳以上のための出会い</h1>
    <p class="muted">安心して使えることを大切にしたマッチングサイト。</p>
    <div class="tabs"><button class="tab active" data-mode="login">ログイン</button><button class="tab" data-mode="register">新規登録</button></div>

    <form id="authForm">
      <label>メールアドレス<input id="email" type="email" required autocomplete="email"></label>
      <label>パスワード<input id="password" type="password" minlength="8" required autocomplete="current-password"></label>
      <div id="registerFields" class="hidden">
        <label>ニックネーム<input id="nickname" maxlength="30"></label>
        <label>生年月日<input id="birthDate" type="date"></label>
        <label>自己紹介<textarea id="bio" maxlength="500" placeholder="趣味や好きなことなど"></textarea></label>
        <p class="notice">18歳未満の方は登録できません。年齢確認が必要なサービスとして公開する場合は、別途正式な本人・年齢確認を実装してください。</p>
      </div>
      <button class="primary" id="authSubmit">ログイン</button>
      <p id="authError" class="error"></p>
    </form>
  </section>

  <section id="app" class="hidden">
    <div class="welcome card"><div><strong id="hello"></strong><p class="muted">気になる人に「いいね」してみよう。</p></div></div>

    <nav class="nav">
      <button class="navbtn active" data-page="discover">探す</button>
      <button class="navbtn" data-page="matches">マッチ</button>
      <button class="navbtn" data-page="profile">プロフィール</button>
    </nav>

    <section id="discover" class="page">
      <div class="toolbar"><input id="search" placeholder="名前や自己紹介で検索"><button id="searchBtn">検索</button></div>
      <div id="users" class="grid"></div>
    </section>

    <section id="matches" class="page hidden">
      <div id="matchList" class="list"></div>
      <div id="chat" class="card hidden">
        <div class="chatHead"><button id="backMatches">←</button><strong id="chatTitle"></strong></div>
        <div id="messages" class="messages"></div>
        <form id="messageForm" class="messageForm"><input id="messageInput" maxlength="1000" placeholder="メッセージを書く…" required><button>送信</button></form>
      </div>
    </section>

    <section id="profile" class="page hidden">
      <form id="profileForm" class="card">
        <h2>プロフィール</h2>
        <label>ニックネーム<input id="pNickname" maxlength="30" required></label>
        <label>自己紹介<textarea id="pBio" maxlength="500"></textarea></label>
        <p class="muted">生年月日は登録後に変更できません。</p>
        <button class="primary">保存</button>
        <p id="profileMsg"></p>
      </form>
    </section>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
