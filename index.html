<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>まこマッチ 💕</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        sans-serif;
      background: #f7f3f8;
      color: #333;
    }

    .app {
      max-width: 480px;
      margin: auto;
      min-height: 100vh;
      background: white;
    }

    header {
      padding: 22px 18px;
      background: linear-gradient(
        135deg,
        #ff7aa8,
        #9b8cff
      );
      color: white;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .sub {
      opacity: .9;
      margin-top: 5px;
    }

    main {
      padding: 16px;
    }

    .card {
      border: 1px solid #eee;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 5px 18px #0000000d;
    }

    .form-title {
      font-weight: bold;
      margin-top: 14px;
      margin-bottom: 5px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 12px;
      margin: 6px 0 10px;
      font: inherit;
      background: white;
    }

    select {
      appearance: auto;
    }

    textarea {
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
    }

    .like {
      background: #ff5c91;
      color: white;
    }

    .block {
      background: #eee;
      color: #555;
      margin-left: 6px;
    }

    .profile {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .avatar {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #eee;
      font-size: 30px;
      flex-shrink: 0;
    }

    .name {
      font-weight: 700;
    }

    .age {
      color: #777;
    }

    .tag {
      display: inline-block;
      background: #f2eaff;
      padding: 5px 9px;
      border-radius: 20px;
      margin: 4px 3px 0 0;
      font-size: 12px;
    }

    .small {
      font-size: 12px;
      color: #888;
    }

    .saved-location {
      margin-top: 10px;
      padding: 10px;
      background: #f7f3ff;
      border-radius: 12px;
      font-size: 13px;
    }

    .post {
      background: #fff4f7;
    }

    #posts {
      margin-top: 10px;
    }

    .loading {
      color: #888;
      text-align: center;
      padding: 10px;
    }

    .error {
      color: #e44;
      background: #fff0f0;
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>まこマッチ 💕</h1>
    <div class="sub">
      18歳以上限定・安心して話せる場所
    </div>
  </header>

  <main>

    <!-- プロフィール -->
    <div class="card">

      <h2>プロフィール</h2>

      <div class="form-title">
        ニックネーム
      </div>

      <input
        id="myName"
        placeholder="ニックネーム"
      >

      <div class="form-title">
        年齢
      </div>

      <input
        id="myAge"
        type="number"
        min="18"
        placeholder="年齢（18歳以上）"
      >

      <div class="form-title">
        性別
      </div>

      <select id="myGender">
        <option value="">
          選択してください
        </option>

        <option value="男性">
          男性
        </option>

        <option value="女性">
          女性
        </option>

        <option value="その他">
          その他
        </option>

        <option value="回答しない">
          回答しない
        </option>
      </select>


      <div class="form-title">
        都道府県
      </div>

      <select id="prefecture">
        <option value="">
          読み込み中...
        </option>
      </select>


      <div class="form-title">
        市区町村
      </div>

      <select
        id="municipality"
        disabled
      >
        <option value="">
          先に都道府県を選択してください
        </option>
      </select>


      <div class="form-title">
        自己紹介
      </div>

      <textarea
        id="myBio"
        rows="3"
        placeholder="自己紹介"
      ></textarea>


      <button
        class="like"
        onclick="saveProfile()"
      >
        プロフィールを保存
      </button>

      <div
        id="saved"
        class="small"
      ></div>

      <div
        id="savedLocation"
        class="saved-location"
        style="display:none;"
      ></div>

    </div>


    <!-- おすすめ -->
    <h2>
      おすすめの人
    </h2>

    <div id="profiles"></div>


    <!-- 雑談 -->
    <div class="card post">

      <h2>
        雑談コーナー 💬
      </h2>

      <input
        id="postName"
        placeholder="名前（任意）"
      >

      <textarea
        id="postText"
        rows="3"
        placeholder="気軽にひとこと投稿しよう"
      ></textarea>

      <button
        class="like"
        onclick="addPost()"
      >
        投稿する
      </button>

      <div id="posts"></div>

    </div>

  </main>

</div>


<script>

  /*
   * 全国の都道府県データ
   */
  const PREF_URL =
    "https://code4fukui.github.io/localgovjp/prefjp.json";


  /*
   * 全国の市区町村データ
   *
   * 市・区・町・村まで入っています。
   */
  const CITY_URL =
    "https://code4fukui.github.io/localgovjp/localgovjp.json";


  const prefecture =
    document.getElementById("prefecture");

  const municipality =
    document.getElementById("municipality");

  const myName =
    document.getElementById("myName");

  const myAge =
    document.getElementById("myAge");

  const myGender =
    document.getElementById("myGender");

  const myBio =
    document.getElementById("myBio");

  const saved =
    document.getElementById("saved");

  const savedLocation =
    document.getElementById("savedLocation");


  let municipalities = [];



  /*
   * 都道府県を読み込む
   */
  async function loadPrefectures() {

    try {

      const response =
        await fetch(PREF_URL);

      if (!response.ok) {
        throw new Error(
          "都道府県データ取得失敗"
        );
      }

      const prefectures =
        await response.json();


      prefecture.innerHTML =
        '<option value="">選択してください</option>';


      prefectures.forEach(pref => {

        const option =
          document.createElement("option");

        option.value =
          pref.pid;

        option.textContent =
          pref.pref;

        prefecture.appendChild(option);

      });


    } catch (error) {

      console.error(error);

      prefecture.innerHTML =
        '<option value="">読み込み失敗</option>';

    }

  }



  /*
   * 市区町村を読み込む
   */
  async function loadMunicipalities() {

    try {

      const response =
        await fetch(CITY_URL);

      if (!response.ok) {
        throw new Error(
          "市区町村データ取得失敗"
        );
      }

      municipalities =
        await response.json();


    } catch (error) {

      console.error(error);

      municipality.innerHTML =
        '<option value="">読み込み失敗</option>';

    }

  }



  /*
   * 都道府県を選択したとき
   */
  prefecture.addEventListener(
    "change",
    function () {

      const selectedPid =
        this.value;


      municipality.innerHTML =
        '<option value="">市区町村を選択してください</option>';


      municipality.disabled =
        true;


      if (!selectedPid) {
        return;
      }


      /*
       * 選択した都道府県だけに絞る
       */
      const cities =
        municipalities.filter(
          city =>
            String(city.pid) ===
            String(selectedPid)
        );


      cities.forEach(city => {

        const option =
          document.createElement("option");

        option.value =
          city.city;

        option.textContent =
          city.city;

        municipality.appendChild(
          option
        );

      });


      municipality.disabled =
        false;

    }
  );



  /*
   * プロフィール保存
   */
  function saveProfile() {

    const name =
      myName.value.trim();

    const age =
      Number(myAge.value);

    const gender =
      myGender.value;

    const pref =
      prefecture.options[
        prefecture.selectedIndex
      ]?.textContent || "";

    const city =
      municipality.value;

    const bio =
      myBio.value.trim();


    /*
     * 名前チェック
     */
    if (!name) {

      alert(
        "ニックネームを入力してください。"
      );

      return;

    }


    /*
     * 年齢チェック
     */
    if (!age || age < 18) {

      alert(
        "18歳以上のみ登録できます。"
      );

      return;

    }


    /*
     * 性別チェック
     */
    if (!gender) {

      alert(
        "性別を選択してください。"
      );

      return;

    }


    /*
     * 都道府県チェック
     */
    if (!prefecture.value) {

      alert(
        "都道府県を選択してください。"
      );

      return;

    }


    /*
     * 市区町村チェック
     */
    if (!city) {

      alert(
        "市区町村を選択してください。"
      );

      return;

    }


    /*
     * 保存
     */
    const profile = {

      name: name,

      age: age,

      gender: gender,

      prefecture: pref,

      municipality: city,

      bio: bio

    };


    localStorage.setItem(
      "makoProfile",
      JSON.stringify(profile)
    );


    saved.textContent =
      "プロフィールを保存しました！💕";


    savedLocation.style.display =
      "block";


    savedLocation.innerHTML =
      "📍 " +
      escapeHtml(pref) +
      " " +
      escapeHtml(city);


  }



  /*
   * 保存したプロフィールを表示
   */
  function loadProfile() {

    const data =
      localStorage.getItem(
        "makoProfile"
      );


    if (!data) {
      return;
    }


    try {

      const profile =
        JSON.parse(data);


      myName.value =
        profile.name || "";

      myAge.value =
        profile.age || "";

      myGender.value =
        profile.gender || "";

      myBio.value =
        profile.bio || "";


      /*
       * 都道府県を探して選択
       */
      if (profile.prefecture) {

        const options =
          Array.from(
            prefecture.options
          );


        const option =
          options.find(
            o =>
              o.textContent ===
              profile.prefecture
          );


        if (option) {

          prefecture.value =
            option.value;

          prefecture.dispatchEvent(
            new Event("change")
          );


          /*
           * 市区町村を選択
           */
          setTimeout(() => {

            municipality.value =
              profile.municipality || "";

          }, 100);

        }

      }


      if (
        profile.prefecture &&
        profile.municipality
      ) {

        savedLocation.style.display =
          "block";

        savedLocation.innerHTML =
          "📍 " +
          escapeHtml(
            profile.prefecture
          ) +
          " " +
          escapeHtml(
            profile.municipality
          );

      }


    } catch (error) {

      console.error(error);

    }

  }



  /*
   * おすすめユーザー
   */
  const people = [

    {
      name: "あおい",
      age: 22,
      icon: "🌸",
      bio: "映画とカフェが好きです！",
      tags: [
        "映画",
        "カフェ"
      ]
    },

    {
      name: "ゆう",
      age: 25,
      icon: "🎮",
      bio: "ゲーム好き。のんびり話せる人募集中！",
      tags: [
        "ゲーム",
        "雑談"
      ]
    },

    {
      name: "みさき",
      age: 21,
      icon: "🐰",
      bio: "音楽を聴くのが好きです♪",
      tags: [
        "音楽",
        "旅行"
      ]
    }

  ];



  function renderProfiles() {

    const box =
      document.getElementById(
        "profiles"
      );


    box.innerHTML =
      people.map(
        p => `

        <div class="card">

          <div class="profile">

            <div class="avatar">
              ${p.icon}
            </div>

            <div>

              <div class="name">
                ${escapeHtml(p.name)}

                <span class="age">
                  ${p.age}歳
                </span>
              </div>

              <div>
                ${escapeHtml(p.bio)}
              </div>

            </div>

          </div>

          <div>

            ${p.tags.map(
              t =>
                `<span class="tag">
                  #${escapeHtml(t)}
                </span>`
            ).join("")}

          </div>

          <br>

          <button
            class="like"
            onclick="like('${escapeJs(p.name)}')"
          >
            ❤️ いいね
          </button>

          <button
            class="block"
            onclick="block('${escapeJs(p.name)}')"
          >
            🚫 ブロック
          </button>

        </div>

      `
      ).join("");

  }



  /*
   * いいね
   */
  function like(name) {

    alert(
      name +
      "さんに「いいね！」しました 💕"
    );

  }



  /*
   * ブロック
   */
  function block(name) {

    alert(
      name +
      "さんをブロックしました。"
    );

  }



  /*
   * 雑談投稿
   */
  function addPost() {

    const name =
      document
        .getElementById("postName")
        .value
        .trim() || "匿名";


    const text =
      document
        .getElementById("postText")
        .value
        .trim();


    if (!text) {

      alert(
        "投稿内容を入力してください。"
      );

      return;

    }


    const posts =
      JSON.parse(
        localStorage.getItem(
          "makoPosts"
        ) || "[]"
      );


    posts.unshift({

      name: name,

      text: text,

      time:
        new Date()
          .toLocaleString("ja-JP")

    });


    localStorage.setItem(
      "makoPosts",
      JSON.stringify(posts)
    );


    document
      .getElementById("postText")
      .value = "";


    renderPosts();

  }



  /*
   * 雑談表示
   */
  function renderPosts() {

    const posts =
      JSON.parse(
        localStorage.getItem(
          "makoPosts"
        ) || "[]"
      );


    document.getElementById(
      "posts"
    ).innerHTML =

      posts.map(
        p => `

          <div class="card">

            <b>
              ${escapeHtml(p.name)}
            </b>

            <div>
              ${escapeHtml(p.text)}
            </div>

            <div class="small">
              ${escapeHtml(p.time)}
            </div>

          </div>

        `
      ).join("");

  }



  /*
   * HTMLエスケープ
   */
  function escapeHtml(text) {

    return String(text).replace(
      /[&<>"']/g,
      function (char) {

        return {

          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"

        }[char];

      }
    );

  }



  /*
   * JavaScript文字列用
   */
  function escapeJs(text) {

    return String(text)
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'");

  }



  /*
   * 起動
   */
  async function init() {

    const loading =
      document.createElement("div");

    loading.className =
      "loading";

    loading.textContent =
      "地域データを読み込んでいます…";

    document
      .querySelector("main")
      .prepend(loading);


    await Promise.all([
      loadPrefectures(),
      loadMunicipalities()
    ]);


    loading.remove();


    loadProfile();

    renderProfiles();

    renderPosts();

  }


  init();

</script>

</body>
</html>
