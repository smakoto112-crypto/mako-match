<!doctype html>
<html lang="ja">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>ゼロ円マッチ 💕</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        "Yu Gothic",
        sans-serif;
      background:
        linear-gradient(
          135deg,
          #fff0f6,
          #f2efff
        );
      color: #333;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      background: #fff;
      box-shadow:
        0 0 30px rgba(100, 60, 120, 0.12);
    }

    /* =========================
       HEADER
    ========================= */

    header {
      padding: 22px 18px;
      color: white;
      background:
        linear-gradient(
          135deg,
          #ff6f9f,
          #9b8cff
        );
    }

    .brand {
      font-size: 24px;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 5px;
      font-size: 13px;
      opacity: 0.95;
    }

    /* =========================
       COMMON
    ========================= */

    .hidden {
      display: none !important;
    }

    .screen {
      padding: 18px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow:
        0 6px 20px rgba(80, 50, 100, 0.08);
    }

    h2 {
      margin: 0 0 14px;
      font-size: 21px;
    }

    h3 {
      margin: 0 0 10px;
      font-size: 17px;
    }

    .muted {
      color: #888;
      font-size: 13px;
    }

    .error {
      color: #d63031;
      background: #fff0f0;
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 13px;
    }

    .success {
      color: #087f5b;
      background: #e9fff7;
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 13px;
    }

    /* =========================
       FORM
    ========================= */

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
      font-size: 14px;
    }

    .field {
      margin-bottom: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #ddd;
      border-radius: 12px;
      outline: none;
      background: #fff;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #ff78a5;
      box-shadow:
        0 0 0 3px rgba(255, 120, 165, 0.12);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    /* =========================
       BUTTON
    ========================= */

    .btn {
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 13px 16px;
      font-weight: 800;
      margin-top: 7px;
    }

    .btn-primary {
      color: #fff;
      background:
        linear-gradient(
          135deg,
          #ff6f9f,
          #9b8cff
        );
    }

    .btn-secondary {
      color: #555;
      background: #f3f3f6;
    }

    .btn-danger {
      color: #fff;
      background: #e74c3c;
    }

    .btn-like {
      color: #fff;
      background:
        linear-gradient(
          135deg,
          #ff5c8a,
          #ff9bba
        );
    }

    .btn-small {
      width: auto;
      display: inline-block;
      padding: 9px 13px;
      margin: 0;
      font-size: 13px;
    }

    /* =========================
       AUTH
    ========================= */

    .logo-big {
      text-align: center;
      font-size: 42px;
      margin: 15px 0 8px;
    }

    .auth-title {
      text-align: center;
      font-size: 26px;
      font-weight: 900;
      margin-bottom: 5px;
    }

    .auth-description {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-bottom: 22px;
    }

    .age-check {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 13px;
      margin: 12px 0;
    }

    .age-check input {
      width: auto;
    }

    /* =========================
       NAV
    ========================= */

    .nav {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      padding: 8px;
      background: #fff;
      border-top: 1px solid #eee;
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .nav button {
      border: none;
      background: transparent;
      padding: 8px 3px;
      border-radius: 10px;
      font-size: 11px;
      color: #777;
    }

    .nav button.active {
      background: #fff0f6;
      color: #ff5790;
      font-weight: 800;
    }

    /* =========================
       USER CARD
    ========================= */

    .user-card {
      border: 1px solid #eee;
      border-radius: 17px;
      padding: 15px;
      margin-bottom: 12px;
      background: #fff;
    }

    .user-top {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(
          135deg,
          #ffd3e2,
          #dcd5ff
        );
      font-size: 27px;
      flex-shrink: 0;
    }

    .user-name {
      font-weight: 900;
      font-size: 17px;
    }

    .user-info {
      color: #777;
      font-size: 13px;
      margin-top: 3px;
    }

    .user-bio {
      margin: 12px 0;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .user-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    /* =========================
       MATCH
    ========================= */

    .match-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 13px;
      border: 1px solid #eee;
      border-radius: 14px;
      margin-bottom: 9px;
    }

    .match-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .match-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #f7dce7;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .match-name {
      font-weight: 800;
    }

    .match-location {
      color: #888;
      font-size: 12px;
      margin-top: 2px;
    }

    /* =========================
       CHAT
    ========================= */

    .chat-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .chat-header button {
      border: none;
      background: #f4f4f6;
      border-radius: 10px;
      padding: 8px 10px;
    }

    .chat-messages {
      height: 430px;
      overflow-y: auto;
      padding: 10px 4px;
      background: #faf9fc;
      border-radius: 15px;
      margin-bottom: 10px;
    }

    .message-row {
      display: flex;
      margin: 7px 0;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .message-bubble {
      max-width: 78%;
      padding: 10px 13px;
      border-radius: 16px;
      background: #eeeef3;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
      line-height: 1.5;
    }

    .message-row.mine .message-bubble {
      background:
        linear-gradient(
          135deg,
          #ff79a6,
          #a28dff
        );
      color: white;
    }

    .message-time {
      font-size: 10px;
      color: #999;
      margin-top: 3px;
      text-align: right;
    }

    .message-row.mine .message-time {
      color: #aaa;
    }

    /* =========================
       PHOTO MESSAGE
    ========================= */

    .chat-image {
      display: block;
      width: auto;
      max-width: 250px;
      max-height: 330px;
      border-radius: 14px;
      object-fit: cover;
      cursor: pointer;
      background: #eee;
    }

    .photo-message {
      padding: 4px !important;
      background: transparent !important;
    }

    .message-row.mine .photo-message {
      background: transparent !important;
    }

    .chat-image-link {
      display: block;
      text-decoration: none;
    }

    .chat-input-area {
      display: grid;
      grid-template-columns: 45px 1fr 65px;
      gap: 7px;
      align-items: end;
    }

    .photo-button {
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 13px;
      background: #f3efff;
      font-size: 21px;
    }

    .chat-input {
      min-height: 45px;
      max-height: 110px;
      resize: vertical;
      margin: 0;
    }

    .send-button {
      height: 45px;
      border: none;
      border-radius: 13px;
      color: white;
      background:
        linear-gradient(
          135deg,
          #ff6f9f,
          #9b8cff
        );
      font-weight: 800;
    }

    .upload-status {
      margin-top: 8px;
      font-size: 12px;
      color: #888;
      text-align: center;
    }

    /* =========================
       POSTS
    ========================= */

    .post {
      padding: 13px;
      border: 1px solid #eee;
      border-radius: 14px;
      margin-bottom: 10px;
    }

    .post-name {
      font-weight: 800;
      font-size: 14px;
    }

    .post-time {
      font-size: 10px;
      color: #aaa;
      margin-left: 5px;
    }

    .post-text {
      margin-top: 7px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* =========================
       LOADING
    ========================= */

    .loading {
      text-align: center;
      padding: 30px 15px;
      color: #888;
    }

    .spinner {
      width: 35px;
      height: 35px;
      border: 4px solid #eee;
      border-top-color: #ff6f9f;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       EMPTY
    ========================= */

    .empty {
      text-align: center;
      color: #888;
      padding: 35px 15px;
      font-size: 14px;
    }

    /* =========================
       PHOTO MODAL
    ========================= */

    .photo-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 15px;
    }

    .photo-modal img {
      max-width: 100%;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 10px;
    }

    .photo-modal-close {
      position: fixed;
      top: 15px;
      right: 15px;
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      color: white;
      font-size: 24px;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 420px) {

      .screen {
        padding: 14px;
      }

      .chat-messages {
        height: 390px;
      }

      .chat-image {
        max-width: 220px;
      }

    }

  </style>

</head>


<body>

<div class="app">

  <header>

    <div class="brand">
      ゼロ円マッチ 💕
    </div>

    <div class="subtitle">
      18歳以上限定・安心して話せる場所
    </div>

  </header>


  <!-- =========================
       AUTH SCREEN
  ========================== -->

  <section id="authScreen" class="screen">

    <div class="card">

      <div class="logo-big">
        💕
      </div>

      <div class="auth-title">
        ゼロ円マッチ
      </div>

      <div class="auth-description">
        気になる人とつながって<br>
        二人だけのチャットを楽しもう
      </div>


      <div id="authError" class="error hidden"></div>


      <div class="field">

        <label for="email">
          メールアドレス
        </label>

        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="example@example.com"
        >

      </div>


      <div class="field">

        <label for="password">
          パスワード
        </label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="6文字以上"
        >

      </div>


      <label class="age-check">

        <input
          id="ageCheck"
          type="checkbox"
        >

        私は18歳以上です

      </label>


      <button
        id="loginBtn"
        class="btn btn-primary"
      >
        ログイン
      </button>


      <button
        id="registerBtn"
        class="btn btn-secondary"
      >
        新規登録
      </button>

    </div>

  </section>


  <!-- =========================
       MAIN APP
  ========================== -->

  <div id="mainScreen" class="hidden">


    <!-- NAV -->

    <nav class="nav">

      <button
        data-tab="profile"
        class="active"
      >
        👤<br>プロフィール
      </button>

      <button data-tab="recommend">
        💕<br>おすすめ
      </button>

      <button data-tab="matches">
        💖<br>マッチ
      </button>

      <button data-tab="chat">
        💬<br>チャット
      </button>

      <button data-tab="talk">
        🗣️<br>雑談
      </button>

    </nav>


    <!-- =========================
         PROFILE
    ========================== -->

    <section
      id="profileTab"
      class="screen tab"
    >

      <div class="card">

        <h2>
          👤プロフィール
        </h2>

        <div id="profileMessage"></div>


        <div class="field">

          <label for="nickname">
            ニックネーム
          </label>

          <input
            id="nickname"
            maxlength="30"
            placeholder="ニックネーム"
          >

        </div>


        <div class="field">

          <label for="age">
            年齢
          </label>

          <input
            id="age"
            type="number"
            min="18"
            max="120"
            placeholder="18"
          >

        </div>


        <div class="field">

          <label for="gender">
            性別
          </label>

          <select id="gender">

            <option value="">
              選択してください
            </option>

            <option value="男性">
              男性
            </option>

            <option value="女性">
              女性
            </option>

            <option value="その他">
              その他
            </option>

          </select>

        </div>


        <div class="field">

          <label for="prefecture">
            都道府県
          </label>

          <select id="prefecture">

            <option value="">
              読み込み中...
            </option>

          </select>

        </div>


        <div class="field">

          <label for="city">
            市区町村
          </label>

          <select id="city">

            <option value="">
              都道府県を選択してください
            </option>

          </select>

        </div>


        <div class="field">

          <label for="bio">
            自己紹介
          </label>

          <textarea
            id="bio"
            maxlength="500"
            placeholder="気軽に自己紹介を書いてみよう"
          ></textarea>

        </div>


        <button
          id="saveProfileBtn"
          class="btn btn-primary"
        >
          プロフィールを保存 💕
        </button>


        <button
          id="logoutBtn"
          class="btn btn-secondary"
        >
          ログアウト
        </button>

      </div>

    </section>


    <!-- =========================
         RECOMMEND
    ========================== -->

    <section
      id="recommendTab"
      class="screen tab hidden"
    >

      <div class="card">

        <h2>
          💕おすすめ
        </h2>

        <div class="muted">
          気になる人に「いいね」してみよう
        </div>

      </div>


      <div id="recommendList">

        <div class="loading">

          <div class="spinner"></div>

          読み込み中...

        </div>

      </div>

    </section>


    <!-- =========================
         MATCHES
    ========================== -->

    <section
      id="matchesTab"
      class="screen tab hidden"
    >

      <div class="card">

        <h2>
          💖マッチ
        </h2>

        <div class="muted">
          マッチした人と二人だけで話せます
        </div>

      </div>


      <div id="matchList">

        <div class="empty">
          マッチした人はいません 💕
        </div>

      </div>

    </section>


    <!-- =========================
         CHAT
    ========================== -->

    <section
      id="chatTab"
      class="screen tab hidden"
    >

      <div id="chatSelectArea" class="card">

        <h2>
          💬チャット
        </h2>

        <div class="muted">
          マッチした人を選ぶと<br>
          二人だけのチャットができます 💕
        </div>

      </div>


      <div
        id="chatArea"
        class="card hidden"
      >

        <div class="chat-header">

          <button id="backChatBtn">
            ←
          </button>

          <div>

            <div
              id="chatPartnerName"
              class="user-name"
            >
              チャット
            </div>

            <div
              id="chatPartnerLocation"
              class="muted"
            ></div>

          </div>

        </div>


        <div
          id="chatMessages"
          class="chat-messages"
        ></div>


        <div
          id="uploadStatus"
          class="upload-status"
        ></div>


        <div class="chat-input-area">

          <button
            id="photoButton"
            class="photo-button"
            type="button"
            title="写真を送る"
          >
            📷
          </button>


          <textarea
            id="chatInput"
            class="chat-input"
            maxlength="1000"
            placeholder="メッセージを入力..."
          ></textarea>


          <button
            id="sendMessageBtn"
            class="send-button"
            type="button"
          >
            送信
          </button>

        </div>


        <input
          id="chatImageInput"
          type="file"
          accept="image/jpeg,image/png,image/webp"
          hidden
        >

        <div class="muted" style="margin-top:8px;">
          📷 JPG・PNG・WebP / 最大10MB<br>
          写真は自動的に圧縮して送信します
        </div>

      </div>

    </section>


    <!-- =========================
         TALK
    ========================== -->

    <section
      id="talkTab"
      class="screen tab hidden"
    >

      <div class="card">

        <h2>
          🗣️雑談コーナー
        </h2>

        <textarea
          id="postText"
          maxlength="500"
          placeholder="気軽にひとこと投稿しよう"
        ></textarea>

        <button
          id="postBtn"
          class="btn btn-primary"
        >
          投稿する
        </button>

      </div>


      <div id="postList">

        <div class="loading">

          <div class="spinner"></div>

          読み込み中...

        </div>

      </div>

    </section>

  </div>


  <!-- =========================
       PHOTO MODAL
  ========================== -->

  <div
    id="photoModal"
    class="photo-modal hidden"
  >

    <button
      id="photoModalClose"
      class="photo-modal-close"
    >
      ×
    </button>

    <img
      id="photoModalImage"
      src=""
      alt="写真"
    >

  </div>

</div>


<script type="module">

  /* =====================================================
     FIREBASE
  ===================================================== */

  import {

  } from
  "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


  import {

  } from

  /* =====================================================
     FIREBASE CONFIG

  const firebaseConfig = {

    storageBucket:
      "makomatch-7a96b.firebasestorage.app",

    messagingSenderId:
      "371872457458",

    appId:
      "1:371872457458:web:6c9391508fbba63df2a66b",

    measurementId:
      "G-Y39HTKE7ZZ"

  };


  const app =
    initializeApp(firebaseConfig);


  const auth =
    getAuth(app);


  const db =
    getFirestore(app);


  const storage =
    getStorage(app);


  /* =====================================================
     GLOBAL
  ===================================================== */

  let currentUser = null;

  let currentProfile = null;

  let currentMatches = [];

  let selectedMatchId = null;

  let selectedPartner = null;

  let unsubscribeMessages = null;

  let municipalityData = [];


  /* =====================================================
     ELEMENTS
  ===================================================== */

  const authScreen =
    document.getElementById("authScreen");

  const mainScreen =
    document.getElementById("mainScreen");

  const authError =
    document.getElementById("authError");

  const emailInput =
    document.getElementById("email");

  const passwordInput =
    document.getElementById("password");

  const ageCheck =
    document.getElementById("ageCheck");


  /* =====================================================
     ESCAPE HTML
  ===================================================== */

  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  /* =====================================================
     DATE
  ===================================================== */

  function formatDate(timestamp) {

    if (!timestamp) {
      return "";
    }

    let date;

    if (timestamp.toDate) {
      date = timestamp.toDate();
    } else {
      date = new Date(timestamp);
    }

    if (Number.isNaN(date.getTime())) {
      return "";
    }

    return date.toLocaleString(
      "ja-JP",
      {
        month: "numeric",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      }
    );

  }

  async function loadMunicipalities() {

    try {

      const response =
        await fetch(
          "https://code4fukui.github.io/localgovjp/localgovjp.json"
        );

      municipalityData =
        await response.json();

      const prefectureSelect =
        document.getElementById("prefecture");

      prefectureSelect.innerHTML =
        `<option value="">選択してください</option>`;

      const prefectures =
        [
          ...new Set(
            municipalityData.map(
              item =>
                item.pref
                || item.prefecture
                || item.name
            )
          )
        ]
        .filter(Boolean)
        .sort(
          (a, b) =>
            a.localeCompare(b, "ja")
        );


      prefectures.forEach(pref => {

        const option =
          document.createElement("option");

        option.value = pref;

        option.textContent = pref;

        prefectureSelect.appendChild(
          option
        );

      });


    } catch (error) {

      console.error(
        "自治体データ読み込みエラー",
        error
      );

      const select =
        document.getElementById("prefecture");

      select.innerHTML =
        `<option value="">読み込み失敗</option>`;

    }

  }


  document
    .getElementById("prefecture")
    .addEventListener(
      "change",
      () => {

        const pref =
          document.getElementById(
            "prefecture"
          ).value;

        const citySelect =
          document.getElementById("city");

        citySelect.innerHTML =
          `<option value="">選択してください</option>`;


        if (!pref) {
          return;
        }


        const cities =
          municipalityData
            .filter(item => {

              const itemPref =
                item.pref
                || item.prefecture
                || "";

              return itemPref === pref;

            })
            .map(item => {

              return item.city
                || item.city_name
                || item.name
                || "";

            })
            .filter(Boolean);


        [
          ...new Set(cities)
        ]
        .sort(
          (a, b) =>
            a.localeCompare(b, "ja")
        )
        .forEach(city => {

          const option =
            document.createElement("option");

          option.value = city;

          option.textContent = city;

          citySelect.appendChild(
            option
          );

        });

      }
    );

  async function loadRecommendations() {

    const list =
      document.getElementById(
        "recommendList"
      );


    if (!currentUser) {
      return;
    }


    list.innerHTML =
      `<div class="loading">
        <div class="spinner"></div>
        読み込み中...
      </div>`;


    try {

      const usersSnapshot =
        await getDocs(
          collection(
            db,
            "users"
          )
        );


      const likesSnapshot =
        await getDocs(
          collection(
            db,
            "likes"
          )
        );


      const likedIds =
        new Set();


      likesSnapshot.forEach(
        snap => {

          const data =
            snap.data();

          if (
            data.from ===
              currentUser.uid
          ) {

            likedIds.add(
              data.to
            );

          }

        }
      );


      const blocksSnapshot =
        await getDocs(
          collection(
            db,
            "blocks"
          )
        );


      const blockedIds =
        new Set();


      blocksSnapshot.forEach(
        snap => {

          const data =
            snap.data();

          if (
            data.from ===
              currentUser.uid
          ) {

            blockedIds.add(
              data.to
            );

          }

          if (
            data.to ===
              currentUser.uid
          ) {

            blockedIds.add(
              data.from
            );

          }

        }
      );


      const users = [];


      usersSnapshot.forEach(
        snap => {

          if (
            snap.id ===
            currentUser.uid
          ) {
            return;
          }


          if (
            blockedIds.has(
              snap.id
            )
          ) {
            return;
          }


          const data =
            snap.data();


          users.push({
            id: snap.id,
            ...data
          });

        }
      );


      if (users.length === 0) {

        list.innerHTML =
          `<div class="empty">
            まだおすすめできる人がいません 💕
          </div>`;

        return;

      }


      list.innerHTML =
        users
          .map(
            user =>
              createUserCard(
                user,
                likedIds.has(user.id)
              )
          )
          .join("");


      list
        .querySelectorAll(
          "[data-like]"
        )
        .forEach(button => {

          button.addEventListener(
            "click",
            async () => {

              await likeUser(
                button.dataset.like
              );

            }
          );

        });


      list
        .querySelectorAll(
          "[data-block]"
        )
        .forEach(button => {

          button.addEventListener(
            "click",
            async () => {

              await blockUser(
                button.dataset.block
              );

            }
          );

        });


    } catch (error) {

      console.error(error);

      list.innerHTML =
        `<div class="error">
          おすすめの読み込みに失敗しました。
        </div>`;

    }

  }

  /* =====================================================
     LIKE
  ===================================================== */

  async function likeUser(
    targetUid
  ) {

    if (!currentUser) {
      return;
    }


    try {

      const likeId =
        currentUser.uid +
        "_" +
        targetUid;


      const reverseLikeId =
        targetUid +
        "_" +
        currentUser.uid;


      await setDoc(
        doc(
          db,
          "likes",
          likeId
        ),
        {
          from: currentUser.uid,
          to: targetUid,
          createdAt:
            serverTimestamp()
        }
      );


      const reverseSnap =
        await getDoc(
          doc(
            db,
            "likes",
            reverseLikeId
          )
        );


      if (reverseSnap.exists()) {

        const matchId =
          [currentUser.uid, targetUid]
            .sort()
            .join("_");


        await setDoc(
          doc(
            db,
            "matches",
            matchId
          ),
          {
            users: [
              currentUser.uid,
              targetUid
            ],
            createdAt:
              serverTimestamp()
          },
          {
            merge: true
          }
        );


        alert(
          "💕 マッチしました！"
        );

        await loadMatches();

      } else {

        alert(
          "いいねしました 💕"
        );

      }


      await loadRecommendations();

    } catch (error) {

      console.error(error);

      alert(
        "いいねに失敗しました。"
      );

    }

  }

  /* =====================================================
     MATCHES
  ===================================================== */

  async function loadMatches() {

    const list =
      document.getElementById(
        "matchList"
      );


    if (!currentUser) {
      return;
    }


    list.innerHTML =
      `<div class="loading">
        <div class="spinner"></div>
        読み込み中...
      </div>`;


    try {

      const snapshot =
        await getDocs(
          collection(
            db,
            "matches"
          )
        );


      currentMatches = [];


      for (
        const snap of snapshot.docs
      ) {

        const data =
          snap.data();


        if (
          !Array.isArray(
            data.users
          )
        ) {
          continue;
        }


        if (
          !data.users.includes(
            currentUser.uid
          )
        ) {
          continue;
        }


        const partnerId =
          data.users.find(
            uid =>
              uid !==
              currentUser.uid
          );


        if (!partnerId) {
          continue;
        }


        const partnerSnap =
          await getDoc(
            doc(
              db,
              "users",
              partnerId
            )
          );


        if (
          !partnerSnap.exists()
        ) {
          continue;
        }


        currentMatches.push({

          id: snap.id,

          ...data,

          partnerId,

          partner:
            partnerSnap.data()

        });

      }


      if (
        currentMatches.length === 0
      ) {

        list.innerHTML =
          `<div class="empty">
            まだマッチしていません 💕
          </div>`;

        return;

      }


      list.innerHTML =
        currentMatches
          .map(match => {

            const p =
              match.partner;


            const location =
              [
                p.prefecture,
                p.city
              ]
              .filter(Boolean)
              .join("");


            return `

              <div
                class="match-item"
                data-match="${escapeHtml(match.id)}"
              >

                <div class="match-left">

                  <div class="match-avatar">
                    💕
                  </div>

                  <div>

                    <div class="match-name">
                      ${escapeHtml(
                        p.nickname ||
                        "名前未設定"
                      )}
                    </div>

                    <div class="match-location">
                      ${escapeHtml(location)}
                    </div>

                  </div>

                </div>


                <button
                  class="btn btn-primary btn-small"
                  data-open-chat="${escapeHtml(match.id)}"
                >
                  💬 チャット
                </button>

              </div>

            `;

          })
          .join("");


      list
        .querySelectorAll(
          "[data-open-chat]"
        )
        .forEach(button => {

          button.addEventListener(
            "click",
            () => {

              const matchId =
                button.dataset.openChat;

              openChat(
                matchId
              );

            }
          );

        });


    } catch (error) {

      console.error(error);

      list.innerHTML =
        `<div class="error">
          マッチ情報の読み込みに失敗しました。
        </div>`;

    }

  }


  /* =====================================================
     OPEN CHAT
  ===================================================== */

  async function openChat(
    matchId
  ) {

    const match =
      currentMatches.find(
        item =>
          item.id === matchId
      );


    if (!match) {

      await loadMatches();

      const retry =
        currentMatches.find(
          item =>
            item.id === matchId
        );

      if (!retry) {
        return;
      }

      return openChat(matchId);

    }


    selectedMatchId =
      matchId;

    selectedPartner =
      match.partner;


    document
      .querySelectorAll(".nav button")
      .forEach(
        b => b.classList.remove("active")
      );


    document
      .querySelector(
        '[data-tab="chat"]'
      )
      .classList.add("active");


    document
      .querySelectorAll(".tab")
      .forEach(
        section =>
          section.classList.add("hidden")
      );


    document
      .getElementById("chatTab")
      .classList.remove("hidden");


    document

      .classList.add("hidden");

      .classList.remove("hidden");

  /* =====================================================
     MESSAGE LISTENER
  ===================================================== */

  function listenMessages() {

    if (
      !selectedMatchId ||
      !currentUser
    ) {
      return;
    }


    if (unsubscribeMessages) {

      unsubscribeMessages();

      unsubscribeMessages = null;

    }


    const messagesRef =
      collection(
        db,
        "matches",
        selectedMatchId,
        "messages"
      );


    unsubscribeMessages =
      onSnapshot(
        messagesRef,
        snapshot => {

          const messages =
            snapshot.docs
              .map(docSnap => ({
                id: docSnap.id,
                ...docSnap.data()
              }))
              .sort(
                (a, b) => {

                  const at =
                    getTimestampValue(
                      a.createdAt
                    );

                  const bt =
                    getTimestampValue(
                      b.createdAt
                    );

                  return at - bt;

                }
              );


          renderMessages(
            messages
          );

        },
        error => {

          console.error(
            "メッセージ監視エラー",
            error
          );

          document
            .getElementById(
              "chatMessages"
            )
            .innerHTML =
              `<div class="error">
                メッセージを読み込めませんでした。
              </div>`;

        }
      );

  }


  function getTimestampValue(
    timestamp
  ) {

    if (!timestamp) {
      return 0;
    }

    if (
      typeof timestamp.toMillis ===
      "function"
    ) {
      return timestamp.toMillis();
    }

    if (
      timestamp.seconds !==
      undefined
    ) {
      return (
        timestamp.seconds * 1000
      );
    }

    return new Date(
      timestamp
    ).getTime() || 0;

  }


  /* =====================================================
     RENDER MESSAGES
  ===================================================== */

  function renderMessages(
    messages
  ) {

    const box =
      document.getElementById(
        "chatMessages"
      );


    if (messages.length === 0) {

      box.innerHTML =
        `<div class="empty">
          まだメッセージはありません。<br>
          最初のメッセージを送ってみよう 💕
        </div>`;

      return;

    }


    box.innerHTML =
      messages
        .map(message => {

          const mine =
            message.from ===
            currentUser.uid;


          const rowClass =
            mine
              ? "message-row mine"
              : "message-row";


          const time =
            formatDate(
              message.createdAt
            );


          if (
            message.type ===
              "image" &&
            message.imageUrl
          ) {

            return `

              <div class="${rowClass}">

                <div>

                  <div class="message-bubble photo-message">

                    <a
                      href="${escapeHtml(message.imageUrl)}"
                      target="_blank"
                      rel="noopener noreferrer"
                      class="chat-image-link"
                    >

                      <img
                        src="${escapeHtml(message.imageUrl)}"
                        class="chat-image"
                        alt="送信された写真"
                        loading="lazy"
                      >

                    </a>

                  </div>

                  <div class="message-time">
                    ${escapeHtml(time)}
                  </div>

                </div>

              </div>

            `;

          }


          return `

            <div class="${rowClass}">

              <div>

                <div class="message-bubble">

                  ${escapeHtml(
                    message.text || ""
                  )}

                </div>

                <div class="message-time">
                  ${escapeHtml(time)}
                </div>

              </div>

            </div>

          `;

        })
        .join("");


    requestAnimationFrame(
      () => {

        box.scrollTop =
          box.scrollHeight;

      }
    );

  }


  /* =====================================================
     SEND TEXT MESSAGE
  ===================================================== */

  document
    .getElementById("sendMessageBtn")
    .addEventListener(
      "click",
      sendTextMessage
    );


  document
    .getElementById("chatInput")
    .addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendTextMessage();

        }

      }
    );


  async function sendTextMessage() {

    if (
      !currentUser ||
      !selectedMatchId
    ) {

      alert(
        "先にチャット相手を選んでください。"
      );

      return;

    }


    const input =
      document.getElementById(
        "chatInput"
      );


    const text =
      input.value.trim();


    if (!text) {
      return;
    }


    input.disabled = true;


    try {

      await addDoc(
        collection(
          db,
          "matches",
          selectedMatchId,
          "messages"
        ),
        {

          from:
            currentUser.uid,

          type:
            "text",

          text,

          createdAt:
            serverTimestamp()

        }
      );


      input.value = "";


    } catch (error) {

      console.error(error);

      alert(
        "メッセージを送信できませんでした。"
      );

    } finally {

      input.disabled = false;

      input.focus();

    }

  }


  /* =====================================================
     PHOTO BUTTON
  ===================================================== */

  document
    .getElementById("photoButton")
    .addEventListener(
      "click",
      () => {

        if (
          !selectedMatchId
        ) {

          alert(
            "先にチャット相手を選んでください。"
          );

          return;

        }

        document
          .getElementById(
            "chatImageInput"
          )
          .click();

      }
    );


  document
    .getElementById("chatImageInput")
    .addEventListener(
      "change",
      async event => {

        const file =
          event.target.files?.[0];


        event.target.value = "";


        if (!file) {
          return;
        }


        await sendChatImage(
          file
        );

      }
    );


  /* =====================================================
     COMPRESS IMAGE
  ===================================================== */

  async function compressImage(
    file
  ) {

    const maxWidth = 1280;

    const maxHeight = 1280;

    const quality = 0.78;


    const dataUrl =
      await new Promise(
        (resolve, reject) => {

          const reader =
            new FileReader();


          reader.onload =
            () => resolve(
              reader.result
            );


          reader.onerror =
            reject;


          reader.readAsDataURL(
            file
          );

        }
      );


    const image =
      await new Promise(
        (resolve, reject) => {

          const img =
            new Image();


          img.onload =
            () => resolve(img);


          img.onerror =
            () =>
              reject(
                new Error(
                  "画像を読み込めませんでした。"
                )
              );


          img.src =
            dataUrl;

        }
      );


    let width =
      image.width;

    let height =
      image.height;


    const scale =
      Math.min(
        1,
        maxWidth / width,
        maxHeight / height
      );


    width =
      Math.round(
        width * scale
      );


    height =
      Math.round(
        height * scale
      );


    const canvas =
      document.createElement(
        "canvas"
      );


    canvas.width =
      width;

    canvas.height =
      height;


    const ctx =
      canvas.getContext(
        "2d"
      );


    ctx.drawImage(
      image,
      0,
      0,
      width,
      height
    );


    const blob =
      await new Promise(
        resolve => {

          canvas.toBlob(
            resolve,
            "image/jpeg",
            quality
          );

        }
      );


    if (!blob) {

      throw new Error(
        "画像の圧縮に失敗しました。"
      );

    }


    return blob;

  }


  /* =====================================================
     SEND CHAT IMAGE
  ===================================================== */

  async function sendChatImage(
    file
  ) {

    if (
      !currentUser ||
      !selectedMatchId
    ) {
      return;
    }


    const status =
      document.getElementById(
        "uploadStatus"
      );


    try {

      if (
        !file.type.startsWith(
          "image/"
        )
      ) {

        alert(
          "画像ファイルを選択してください。"
        );

        return;

      }


      const maxOriginalSize =
        10 * 1024 * 1024;


      if (
        file.size >
        maxOriginalSize
      ) {

        alert(
          "写真は10MB以下にしてください。"
        );

        return;

      }


      status.textContent =
        "📷 写真を圧縮しています...";


      const compressed =
        await compressImage(
          file
        );


      const maxUploadSize =
        5 * 1024 * 1024;


      if (
        compressed.size >
        maxUploadSize
      ) {

        alert(
          "圧縮後も写真が5MBを超えています。別の写真を選んでください。"
        );

        status.textContent = "";

        return;

      }


      status.textContent =
        "☁️ 写真をアップロードしています...";


      const safeName =
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2, 10) +
        ".jpg";


      const path =
        "chatImages/" +
        selectedMatchId +
        "/" +
        currentUser.uid +
        "/" +
        safeName;


      const imageRef =
        ref(
          storage,
          path
        );


      await uploadBytes(
        imageRef,
        compressed,
        {
          contentType:
            "image/jpeg"
        }
      );


      status.textContent =
        "💬 チャットに送信しています...";


      const imageUrl =
        await getDownloadURL(
          imageRef
        );


      await addDoc(
        collection(
          db,
          "matches",
          selectedMatchId,
          "messages"
        ),
        {

          from:
            currentUser.uid,

          type:
            "image",

          imageUrl,

          imagePath:
            path,

          createdAt:
            serverTimestamp()

        }
      );


      status.textContent =
        "📷 写真を送信しました 💕";


      setTimeout(
        () => {
          status.textContent = "";
        },
        2000
      );


    } catch (error) {

      console.error(
        "写真送信エラー",
        error
      );


      status.textContent = "";


      if (
        error.code ===
        "storage/unauthorized"
      ) {

        alert(
          "写真を送信する権限がありません。Firebase Storage Rulesを確認してください。"
        );

      } else if (
        error.code ===
        "storage/quota-exceeded"
      ) {

        alert(
          "Storageの容量制限を超えています。"
        );

      } else {

        alert(
          "写真を送信できませんでした。\n\n" +
          "Firebase Storageが有効になっているか確認してください。"
        );

      }

    }

  }


  /* =====================================================
     PHOTO MODAL
  ===================================================== */

  document
    .getElementById(
      "photoModalClose"
    )
    .addEventListener(
      "click",
      closePhotoModal
    );


  document
    .getElementById(
      "photoModal"
    )
    .addEventListener(
      "click",
      event => {

        if (
          event.target.id ===
          "photoModal"
        ) {

          closePhotoModal();

        }

      }
    );


  document
    .getElementById(
      "chatMessages"
    )
    .addEventListener(
      "click",
      event => {

        const image =
          event.target.closest(
            ".chat-image"
          );


        if (!image) {
          return;
        }


        event.preventDefault();


        openPhotoModal(
          image.src
        );

      }
    );


  function openPhotoModal(
    src
  ) {

    document
      .getElementById(
        "photoModalImage"
      )
      .src = src;


    document
      .getElementById(
        "photoModal"
      )
      .classList.remove(
        "hidden"
      );

  }


  function closePhotoModal() {

    document
      .getElementById(
        "photoModal"
      )
      .classList.add(
        "hidden"
      );


    document
      .getElementById(
        "photoModalImage"
      )
      .src = "";

  }


  /* =====================================================
     TALK BOARD
  ===================================================== */

  document
    .getElementById("postBtn")
    .addEventListener(
      "click",
      createPost
    );


  async function createPost() {

    if (!currentUser) {
      return;
    }


    const textarea =
      document.getElementById(
        "postText"
      );


    const text =
      textarea.value.trim();


    if (!text) {

      alert(
        "投稿内容を入力してください。"
      );

      return;

    }


    try {

      await addDoc(
        collection(
          db,
          "posts"
        ),
        {

          uid:
            currentUser.uid,

          nickname:
            currentProfile?.nickname ||
            "匿名",

          text,

          createdAt:
            serverTimestamp()

        }
      );


      textarea.value = "";


      await loadPosts();


    } catch (error) {

      console.error(error);

      alert(
        "投稿できませんでした。"
      );

    }

  }


  async function loadPosts() {

    const list =
      document.getElementById(
        "postList"
      );


    if (!currentUser) {
      return;
    }


    list.innerHTML =
      `<div class="loading">
        <div class="spinner"></div>
        読み込み中...
      </div>`;


    try {

      const snapshot =
        await getDocs(
          collection(
            db,
            "posts"
          )
        );


      const posts =
        snapshot.docs
          .map(docSnap => ({
            id:
              docSnap.id,
            ...docSnap.data()
          }))
          .sort(
            (a, b) =>
              getTimestampValue(
                b.createdAt
              ) -
              getTimestampValue(
                a.createdAt
              )
          );


      if (posts.length === 0) {

        list.innerHTML =
          `<div class="empty">
            まだ投稿はありません。<br>
            最初のひとことを投稿してみよう 💕
          </div>`;

        return;

      }


      list.innerHTML =
        posts
          .map(post => {

            return `

              <div class="post">

                <div class="post-name">

                  ${escapeHtml(
                    post.nickname ||
                    "匿名"
                  )}

                  <span class="post-time">

                    ${escapeHtml(
                      formatDate(
                        post.createdAt
                      )
                    )}

                  </span>

                </div>


                <div class="post-text">

                  ${escapeHtml(
                    post.text || ""
                  )}

                </div>

              </div>

            `;

          })
          .join("");


    } catch (error) {

      console.error(error);

      list.innerHTML =
        `<div class="error">
          投稿の読み込みに失敗しました。
        </div>`;

    }

  }


  /* =====================================================
     INITIAL
  ===================================================== */

  console.log(
    "ゼロ円マッチ 💕 起動しました"
  );

</script>
